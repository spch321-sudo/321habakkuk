打斷受苦者的哭泣；這不是 2:20 的意思。2:20 要安靜下來的，是全地、是人的自大與喧囂，不是受傷之人的眼淚。<\/p><p>最後，請記得：這節經文是第 3 章的門。先知在這裡安靜了，下一章，他開口了——這一次，不是質問，而是禱告與詩歌。<strong>從質問到靜默，從靜默到歌唱，這是哈巴谷書給我們的一條路。<\/strong>讓耶穌得著一切的榮耀，我們就從這個靜默裡，走進下一章的歌。<\/p><p>所以，這一節也是一個邀請：不管你此刻正站在哪一章的哪一個問題裡，都可以先暫停一下，不求答案，不編辯詞，只是站好，對神說：祢在祢的殿中，我在祢面前。<strong>這一句話，不需要任何的情緒或程度，它只需要誠實。<\/strong>誠實地靜默，本身就是一種敬拜。<\/p><p>靜默之後，才有歌。<\/p>"}],"3":[{"a":1,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>תְּפִלָּה לַחֲבַקּוּק הַנָּבִיא עַל שִׁגְיֹנֽוֹת׃ יְהוָה שָׁמַעְתִּי שִׁמְעֲךָ יָרֵאתִי יְהוָה פָּֽעָלְךָ בְּקֶרֶב שָׁנִים חַיֵּיהוּ בְּקֶרֶב שָׁנִים תּוֹדִיעַ בְּרֹגֶז רַחֵם תִּזְכּֽוֹר׃<\/p><\/blockquote>","lit":"<blockquote><p>「先知哈巴谷的禱告，調用流離歌。耶和華啊，我聽見你的名聲就懼怕。耶和華啊，求你在這些年間復興你的作為，在這些年間顯明出來；在發怒的時候以憐憫為念。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>禱告<\/td><td>תְּפִלָּה<\/td><td>tefillah<\/td><td>H8605<\/td><td>禱告、祈求<\/td><\/tr><tr><td>流離歌<\/td><td>שִׁגְיֹנוֹת<\/td><td>shigyonot<\/td><td>H7692<\/td><td>流離歌（音樂術語，意義不確定）<\/td><\/tr><tr><td>聽見<\/td><td>שָׁמַעְתִּי<\/td><td>shama'ti<\/td><td>H8085<\/td><td>我聽見<\/td><\/tr><tr><td>名聲<\/td><td>שִׁמְעֲךָ<\/td><td>shim'akha<\/td><td>H8088<\/td><td>你的名聲、你的消息<\/td><\/tr><tr><td>懼怕<\/td><td>יָרֵאתִי<\/td><td>yare'ti<\/td><td>H3372<\/td><td>我敬畏、我懼怕<\/td><\/tr><tr><td>作為<\/td><td>פָּעָלְךָ<\/td><td>pa'olekha<\/td><td>H6467<\/td><td>你的作為<\/td><\/tr><tr><td>復興<\/td><td>חַיֵּיהוּ<\/td><td>khayyehu<\/td><td>H2421<\/td><td>使它存活、使它甦醒<\/td><\/tr><tr><td>憐憫<\/td><td>רַחֵם<\/td><td>rakhem<\/td><td>H7355<\/td><td>憐憫、憐恤<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>禱告<\/strong>：tefillah 是舊約最一般的「禱告」一詞，全書只有這一章被稱為「禱告」。第 1、2 章先知的話多是問與聽，到了第 3 章，他真正地開口向神說話。<strong>流離歌<\/strong>：shigyonot 與詩篇 7 篇標題的 shiggayon 同根，是一種音樂或詩體的名稱，確切意義已不可考；和合本譯作「流離歌」是一種傳統譯法，各家不一，這裡不下定論。<\/p><p><strong>名聲<\/strong>：shim'akha，字根是「聽」，意思是「所聽見的關於祢的」。和合本旁註「或譯：言語」。它可以是「對祢的消息」，也可以是「祢所說的話」。無論哪一種，都是先知「聽見」的結果。<strong>懼怕<\/strong>：yare'ti，與 1:7 描寫迦勒底人的「可畏」是同一個字根，這裡是對神的敬畏。<\/p><p><strong>在這些年間復興你的作為<\/strong>：pa'olekha beqerev shanim khayyehu，「在歲月之中，使祢的作為活過來」。pa'ol（作為）與 1:5 神說「我行一件事」（po'al po'el）是同一個字根；先知求神把自己所說的那件事，在他們的時代，「使它活」。<strong>顯明出來<\/strong>：todia，「使人知道」。<\/p><p><strong>以憐憫為念<\/strong>：berogez rakhem tizkor，「在震怒之中，求祢記念憐憫」。rogez 是「震動、發怒」，與 3:16 的「戰兢」同一字根（ragaz）。先知求神在最激烈的時候，仍要記得憐憫。<\/p>","exp":"<p>第 3 章，是整卷書的第三個聲音：先知開口禱告。<\/p><p>第 1 章，先知向神問；第 2 章，神向先知回答；第 3 章，先知向神禱告。<strong>從「問」到「聽」到「禱」，這是一個人與神之間，最完整的一條路。<\/strong>他的禱告，不是從一堆辭藻開始，而是從「我聽見」開始：「耶和華啊，我聽見你的名聲就懼怕。」<\/p><p>這句話值得停下來。先知聽見的，是神過去所作的一切：祂在歷史中的作為，祂在創造與拯救中的威榮。<strong>他的反應，不是興奮，是懼怕。<\/strong>這不是驚嚇式的害怕，是一種認識了神是誰之後，深深的敬畏。他不再把神當作一個可以被質問到無話可說的對象；他知道，祂是神。<\/p><p>然後，他開口求：「求你在這些年間復興你的作為。」注意他求的是什麼：<strong>不是求神改變祂的計畫，不是求神拿掉他的痛苦，而是求神在他們的時代，使祂的作為「活過來」。<\/strong>他讀過神過去的作為，現在求祂在他們的日子，再作一次。<\/p><p>這句禱告的最後，有一個非常重要的請求：在發怒的時候，以憐憫為念。先知知道神的公義必然施行，迦勒底人的來臨已經確定；但他求的是：在那個最嚴厲的時刻，祢仍然記得憐憫。<strong>他沒有求神取消審判，他求的是，審判之中仍有憐憫。<\/strong><\/p><p>這是一種成熟的禱告：它承認神的公義，也抓住神的憐憫；它不迴避痛苦，也不放棄盼望。<strong>我們不必等到所有的疑問都解決，才能這樣禱告。<\/strong>先知這章的禱告，就是在第 1 章的問題沒有全部被回答之後說出來的。他仍有未解的疑問，卻選擇了禱告。<\/p><p>對正在受苦的人，這一節可以成為我們的話：「耶和華啊，我聽見祢的名聲就懼怕；求祢在這些年間，使祢的作為活過來。」這是一個沒有時間表的禱告，因為先知說的是「在這些年間」，不是「在今天」。我們把時間交給神，把自己放在祂的憐憫裡。<\/p><p>這個禱告還有一個值得留意的地方：它不是先知自己的創作，而是被「交給伶長」的詩歌，是要被教會一代一代唱出來的。<strong>私人的掙扎，被收進公共的敬拜。<\/strong>一個人在黑暗中所說的話，後來成為整個群體可以開口的話。這是神給受苦者的一種尊重：你的問與你的禱告，不是羞恥，是可以被眾人一起唱的歌。<\/p><p>所以，如果你此刻說不出完整的禱告，可以先借用先知的這一句：「耶和華啊，我聽見祢的名聲就懼怕。求祢在這些年間復興祢的作為。」說完就好，不必再加。<\/p>"},{"a":3,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אֱלוֹהַ מִתֵּימָן יָבוֹא וְקָדוֹשׁ מֵֽהַר־פָּארָן סֶלָה כִּסָּה שָׁמַיִם הוֹדוֹ וּתְהִלָּתוֹ מָלְאָה הָאָֽרֶץ׃ וְנֹגַהּ כָּאוֹר תִּֽהְיֶה קַרְנַיִם מִיָּדוֹ לוֹ וְשָׁם חֶבְיוֹן עֻזֹּֽה׃ לְפָנָיו יֵלֶךְ דָּבֶר וְיֵצֵא רֶשֶׁף לְרַגְלָֽיו׃ עָמַד וַיְמֹדֶד אֶרֶץ רָאָה וַיַּתֵּר גּוֹיִם וַיִּתְפֹּֽצְצוּ הַרְרֵי־עַד שַׁחוּ גִּבְעוֹת עוֹלָם הֲלִיכוֹת עוֹלָם לֽוֹ׃ תַּחַת אָוֶן רָאִיתִי אָהֳלֵי כוּשָׁן יִרְגְּזוּן יְרִיעוֹת אֶרֶץ מִדְיָֽן׃<\/p><\/blockquote>","lit":"<blockquote><p>「神從提幔而來；聖者從巴蘭山臨到。（細拉）他的榮光遮蔽諸天；頌讚充滿大地。他的輝煌如同日光；從他手裡射出光線，在其中藏著他的能力。在他前面有瘟疫流行；在他腳下有熱症發出。他站立，量了大地，觀看，趕散萬民。永久的山崩裂；長存的嶺塌陷；他的作為與古時一樣。我見古珊的帳棚遭難，米甸的幔子戰兢。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>神<\/td><td>אֱלוֹהַ<\/td><td>eloah<\/td><td>H433<\/td><td>神（較古老、詩歌的用字）<\/td><\/tr><tr><td>提幔<\/td><td>מִתֵּימָן<\/td><td>mittemanah<\/td><td>H8487<\/td><td>提幔（以東南部地名，意為「南方」）<\/td><\/tr><tr><td>巴蘭山<\/td><td>פָּארָן<\/td><td>paran<\/td><td>H6290<\/td><td>巴蘭（西奈北方曠野）<\/td><\/tr><tr><td>細拉<\/td><td>סֶלָה<\/td><td>selah<\/td><td>H5542<\/td><td>細拉（音樂或默想的停頓記號）<\/td><\/tr><tr><td>榮光<\/td><td>הוֹדוֹ<\/td><td>hodo<\/td><td>H1935<\/td><td>他的威嚴、榮光<\/td><\/tr><tr><td>頌讚<\/td><td>וּתְהִלָּתוֹ<\/td><td>utehillato<\/td><td>H8416<\/td><td>他的頌讚<\/td><\/tr><tr><td>瘟疫<\/td><td>דָּבֶר<\/td><td>dever<\/td><td>H1698<\/td><td>瘟疫<\/td><\/tr><tr><td>量了大地<\/td><td>וַיְמֹדֶד אֶרֶץ<\/td><td>vayyomed erets<\/td><td>H4128<\/td><td>他量度大地（或：使地震動）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>神從提幔而來，聖者從巴蘭山臨到<\/strong>：eloah mitteman yavo, veqadosh mehar paran。eloah 是舊約用於神的較古老詩歌用字（申32:15、詩50:22）。提幔與巴蘭，是在西奈南方與北方的曠野地名，與申33:2 「耶和華從西奈而來，從西珥向他們顯現，從巴蘭山發出光輝」是同一類的畫面。先知把神帶領以色列出埃及的記憶，用來描寫神的來臨。<\/p><p><strong>細拉<\/strong>：selah，出現在 3:3、3:9、3:13，是詩篇中常見的標記，可能是音樂的停頓，也可能是邀請人默想。我們不確知它的確切意義；本講義把它當作「在這裡停一停」。<\/p><p><strong>瘟疫與熱症<\/strong>：dever 與 resheph，前者是瘟疫，後者在迦南的文獻裡，與一位掌管疫病的神同名；先知把它放在耶和華的腳前，是說它只是祂的僕役，不是獨立的力量。這種讀法有學者支持，也不是每一位學者都接受；本講義只取最穩的意思：疫病與熱症，都在神的腳前。<\/p><p><strong>量了大地<\/strong>：vayyomed erets，「他量度大地」；和合本旁註「或譯：使地震動」。這句的讀法，各家不同。<strong>古珊、米甸<\/strong>：cushan 與 midyan，是曾經與以色列相遇、也曾經被神勝過的地名（士3:8–10、士7）。先知用這些舊名，來喚起人對神過去作為的記憶。<\/p>","exp":"<p>先知禱告之後，沒有等神回答，他先看見了。<\/p><p>3:3 開始，是一幅非常宏大的畫面：<strong>神從提幔而來，聖者從巴蘭山臨到。<\/strong>這不是一個新的故事，這是舊的記憶：當年以色列從埃及出來，神在西奈、在曠野，一路帶領他們。先知回頭，把這些畫面再看一次。<\/p><p>他的榮光遮蔽諸天，頌讚充滿大地。<strong>注意：「充滿大地」。<\/strong>在 2:14，是認識神榮耀的知識要充滿遍地；在 3:3，是對神的頌讚已經充滿大地。這兩節遙相呼應：先知盼望的，在異象中已經看見。<\/p><p>3:4 描寫神的輝煌如同日光，光線從祂手裡射出，在那裡藏著祂的能力。<strong>「藏著」這個字很有意思。<\/strong>祂的能力不是被炫耀的，是被收藏的。神的大能，比人所看見的，更深。<\/p><p>3:5–7 是這幅畫面的另一邊：在祂前面有瘟疫流行，在祂腳下有熱症發出。他站立，量了大地，觀看，趕散萬民。<strong>這裡有一個特別的字：「觀看」。<\/strong>全卷追蹤的「看」，在這裡出現的主語，是神自己。1:3 先知問：祢為何看著不理？3:6 說：祂站立，觀看。神不是沒有看，祂在看，而且祂動了。<\/p><p>這幾節經文有很多令人不安的畫面：瘟疫、熱症、趕散萬民。我們要誠實地承認，這些畫面不容易被輕鬆地讀過。<strong>我們不把這些畫面套到今天的任何一個國家或事件，也不拿它們為任何形式的暴力辯護。<\/strong>先知寫的是一幅詩歌式的異象，描寫神在歷史中的主權與威嚴；我們讀的重點，是神自己的來臨，不是災難的細節。<\/p><p>這個異象給先知的功課，是記憶：祂曾經這樣來過。<strong>當現在的處境讓人懷疑神是不是還在，記憶是一種抵抗。<\/strong>先知不是靠自己的感覺撐下去，他是靠回頭看神曾經如何作。我們也一樣：把神過去的作為，一件一件，寫在自己的記憶裡。<\/p><p>讀這一段，也請留意先知「用眼睛看」的順序：他先看見神從南方的曠野而來，再看見光，再看見瘟疫與熱症在前後，最後看見山嶺崩裂、帳棚戰兢。<strong>從遠到近，從天到地，從神到人。<\/strong>這是一個鏡頭慢慢拉近的過程：一直到「我見」（3:7），先知才把自己放進畫面。他不是在遠處看熱鬧，他是在畫面裡發抖的人。<\/p><p>古珊與米甸的帳棚戰兢，提醒我們：昔日看起來強大的力量，在神的來臨之前，都只是帳棚。<strong>帳棚是可以被一陣風吹倒的東西。<\/strong>人所倚靠的權勢與保障，在神面前，都有這樣的輕與薄。<\/p>"},{"a":8,"z":12,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲבִנְהָרִים חָרָה יְהוָה אִם בַּנְּהָרִים אַפֶּךָ אִם־בַּיָּם עֶבְרָתֶךָ כִּי תִרְכַּב עַל־סוּסֶיךָ מַרְכְּבֹתֶיךָ יְשׁוּעָֽה׃ עֶרְיָה תֵעוֹר קַשְׁתֶּךָ שְׁבֻעוֹת מַטּוֹת אֹמֶר סֶלָה נְהָרוֹת תְּבַקַּע־אָֽרֶץ׃ רָאוּךָ יָחִילוּ הָרִים זֶרֶם מַיִם עָבָר נָתַן תְּהוֹם קוֹלוֹ רוֹם יָדֵיהוּ נָשָֽׂא׃ שֶׁמֶשׁ יָרֵחַ עָמַד זְבֻלָה לְאוֹר חִצֶּיךָ יְהַלֵּכוּ לְנֹגַהּ בְּרַק חֲנִיתֶֽךָ׃ בְּזַעַם תִּצְעַד־אָרֶץ בְּאַף תָּדוּשׁ גּוֹיִֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華啊，你乘在馬上，坐在得勝的車上，豈是不喜悅江河、向江河發怒氣、向洋海發憤恨嗎？你的弓全然顯露，向眾支派所起的誓都是可信的。（細拉）你以江河分開大地。山嶺見你，無不戰懼；大水氾濫過去，深淵發聲，洶湧翻騰。因你的箭射出發光，你的槍閃出光耀，日月都在本宮停住。你發忿恨通行大地，發怒氣責打列國，如同打糧。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>江河<\/td><td>בַּנְּהָרִים<\/td><td>bannaharim<\/td><td>H5104<\/td><td>江河<\/td><\/tr><tr><td>洋海<\/td><td>בַּיָּם<\/td><td>bayyam<\/td><td>H3220<\/td><td>海<\/td><\/tr><tr><td>發怒氣<\/td><td>חָרָה<\/td><td>kharah<\/td><td>H2734<\/td><td>發怒、怒氣燃起<\/td><\/tr><tr><td>得勝的車<\/td><td>מַרְכְּבֹתֶיךָ יְשׁוּעָה<\/td><td>markevotekha yeshu'ah<\/td><td>H3444<\/td><td>你的戰車是拯救（得勝）<\/td><\/tr><tr><td>弓<\/td><td>קַשְׁתֶּךָ<\/td><td>qashtekha<\/td><td>H7198<\/td><td>你的弓<\/td><\/tr><tr><td>深淵<\/td><td>תְּהוֹם<\/td><td>tehom<\/td><td>H8415<\/td><td>深淵、深水<\/td><\/tr><tr><td>日月<\/td><td>שֶׁמֶשׁ יָרֵחַ<\/td><td>shemesh yareakh<\/td><td>H8121<\/td><td>太陽、月亮<\/td><\/tr><tr><td>打糧<\/td><td>תָּדוּשׁ<\/td><td>tadush<\/td><td>H1758<\/td><td>踹打（如打穀）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>你乘在馬上，坐在得勝的車上<\/strong>：tirkav al susekha markevotekha yeshu'ah，「祢騎在祢的馬上，祢的戰車是拯救」。yeshu'ah（H3444，拯救）是 3:18 「救我的神」（yish'i）的同一個字根。這裡「得勝」的原文是「拯救」：神的戰車，所載的是拯救。<\/p><p><strong>向眾支派所起的誓都是可信的<\/strong>：shevu'ot mattot omer，這一句非常難譯，各家的讀法差異很大，有人讀為「祢向眾支派所發的誓言」，有人讀為「杖的誓言」「箭的誓言」。和合本取一種傳統讀法。本講義不在這裡下定論。<\/p><p><strong>深淵發聲，洶湧翻騰<\/strong>：natan tehom qolo, rom yadehu nasa，「深淵發出聲音，高高舉起它的手」。tehom 是創1:2 「淵面」的那個字。深水被擬人化：它發聲，它舉手，像是向神投降或致敬。<\/p><p><strong>日月都在本宮停住<\/strong>：shemesh yareakh amad zevulah，「日月站在它們的居所」。這與約書亞記 10:12–13 的「日頭停留」有類似的語言，但各家對兩處的關聯有不同的看法。<strong>如同打糧<\/strong>：tadush，打穀的動詞；先知把神通行大地，比作打穀場上的踐踏。<\/p>","exp":"<p>這一段是全章最宏大的詩歌，也是最容易被讀錯的一段。<\/p><p>3:8 開頭是一個問句：耶和華啊，祢是不是向江河發怒，向洋海發憤恨？<strong>這個問句有一個特別的畫面：神的敵人，不是人，而是水。<\/strong>在古代世界，江河、洋海、深淵，是混亂的象徵。先知用神與水的爭戰，來描寫神對混亂的主權。<\/p><p>3:10 非常動人：山嶺見祢，無不戰懼；大水氾濫過去，深淵發聲，高舉雙手。<strong>山在顫抖，深淵在舉手。<\/strong>連創造中最巨大、最古老的東西，在神面前，都只能回應。這個畫面，與 2:20 的「全地肅敬靜默」，是同一種真理，用不同的詩歌說出來。<\/p><p>3:11 說日月都在本宮停住，因祢的箭射出發光，祢的槍閃出光耀。<strong>日月是人類拿來定時間的東西。<\/strong>連時間的計量，也在祂面前停住。這是一種對時間的提醒：先知問「到幾時」，現在他看見，時間本身，也在神的手裡。<\/p><p>3:12：祢發忿恨通行大地，發怒氣責打列國，如同打糧。這是一節令人不安的經文，我們不要輕輕帶過。<strong>神的審判是真實的，列國在祂面前不是無關的。<\/strong>但我們也要記得兩件事：第一，這一段是詩歌，用的是戰爭與自然的圖像，描寫神的主權；第二，經文沒有給任何人拿起刀劍的授權。<\/p><p>特別要提醒的是：<strong>這一段從頭到尾，行動的主語是神，不是人。<\/strong>弓是祂的弓，箭是祂的箭，通行大地的是祂。沒有一個字，是在告訴我們：你要去打誰，你要去報復誰。我們不拿這些畫面，去為任何戰爭、暴力或報復辯護。先知所看見的，是神的主權，而他自己的回應，是 3:16 的戰兢，不是舉起武器。<\/p><p>對受苦的人，這一段的安慰是：<strong>連洶湧的水與深淵，都向祂低頭。<\/strong>你所面對的，不論多大、多黑、多深，都在祂的腳前。這不是要你立刻不再害怕，而是讓你知道，你所害怕的，不是最大的。<\/p><p>這一段也有一個很深的神學重點：<strong>神是創造的主，所以祂也是拯救的主。<\/strong>江河、洋海、深淵，在創造的記載裡，是祂所制伏的。先知把創造與出埃及、與眼前的危機，連成一條線：那位使深淵低頭的神，也能面對迦勒底人的來臨。這是信靠的根基，也是 3:18 能夠說出口的原因。<\/p><p>同時，我們要再一次提醒自己，不要把這些戰爭與自然的圖像，變成今天任何一場衝突的註腳。詩歌的力量，在於它讓我們看見神有多大；而不是讓我們以為自己可以替祂動手。<\/p>"},{"a":13,"z":15,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>יָצָאתָ לְיֵשַׁע עַמֶּךָ לְיֵשַׁע אֶת־מְשִׁיחֶךָ מָחַצְתָּ רֹּאשׁ מִבֵּית רָשָׁע עָרוֹת יְסוֹד עַד־צַוָּאר סֶֽלָה׃ נָקַבְתָּ בְמַטָּיו רֹאשׁ פְּרָזָיו יִסְעֲרוּ לַהֲפִיצֵנִי עֲלִיצֻתָם כְּמוֹ־לֶאֱכֹל עָנִי בַּמִּסְתָּֽר׃ דָּרַכְתָּ בַיָּם סוּסֶיךָ חֹמֶר מַיִם רַבִּֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「你出來要拯救你的百姓，拯救你的受膏者，打破惡人家長的頭，露出他的腳，直到頸項。（細拉）你用敵人的戈矛刺透他戰士的頭；他們來如旋風，要將我們分散。他們所喜愛的是暗中吞吃貧民。你乘馬踐踏紅海，就是踐踏洶湧的大水。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>出來<\/td><td>יָצָאתָ<\/td><td>yatsa'ta<\/td><td>H3318<\/td><td>你出來了<\/td><\/tr><tr><td>拯救<\/td><td>לְיֵשַׁע<\/td><td>leyesha<\/td><td>H3468<\/td><td>為了拯救<\/td><\/tr><tr><td>百姓<\/td><td>עַמֶּךָ<\/td><td>ammekha<\/td><td>H5971<\/td><td>你的百姓<\/td><\/tr><tr><td>受膏者<\/td><td>מְשִׁיחֶךָ<\/td><td>meshiakhekha<\/td><td>H4899<\/td><td>你的受膏者<\/td><\/tr><tr><td>打破<\/td><td>מָחַצְתָּ<\/td><td>makhatsta<\/td><td>H4272<\/td><td>你擊碎、你打破<\/td><\/tr><tr><td>根基<\/td><td>יְסוֹד<\/td><td>yesod<\/td><td>H3247<\/td><td>根基、基礎<\/td><\/tr><tr><td>貧民<\/td><td>עָנִי<\/td><td>ani<\/td><td>H6041<\/td><td>困苦人、貧窮的人<\/td><\/tr><tr><td>踐踏<\/td><td>דָּרַכְתָּ<\/td><td>darakhta<\/td><td>H1869<\/td><td>你踐踏、你踏過<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>你出來要拯救你的百姓<\/strong>：yatsa'ta leyesha ammekha, leyesha et meshiakhekha。yesha（拯救）在這一節出現兩次，是 3:8「得勝」與 3:18「救我的神」的同一個字根。全章的核心動詞，是「拯救」。<\/p><p><strong>你的受膏者<\/strong>：meshiakhekha，「祢的受膏者」。這個詞在舊約可指君王、祭司、先知，或整個民族（詩105:15）。這裡指誰，各家看法不同：有人指大衛家的君王，有人指整個以色列百姓，有人指將來的彌賽亞。本講義不替經文決定單一的所指。新約以耶穌為神的受膏者，這是新約自己作的連結；但在這節經文裡，我們先照文字讀。<\/p><p><strong>打破惡人家長的頭，露出他的腳<\/strong>：makhatsta rosh mibbeit rasha, arot yesod ad tsavvar。「家長」原文是「惡人之家的頭」；「腳」和合本旁註「原文是根基」。這一句是一個建築的畫面：打碎房屋的頂，把根基一直露到頸項。各家對這個畫面的具體意思有不同的理解，但共同的方向是：惡人的房子，從頂到底，都被神拆毀。<\/p><p><strong>他們所喜愛的是暗中吞吃貧民<\/strong>：alitsutam kemo le'ekhol ani bammistar，「他們的歡樂，像是暗中吞吃困苦人」。ani 是困苦人、受壓的人。這一句回到先知一開始所哭的：受壓的人。<strong>踐踏紅海<\/strong>：darakhta vayyam susekha，「祢的馬踏過海」，回到出埃及的記憶。<\/p>","exp":"<p>3:13 是這一段的樞紐：<strong>你出來要拯救你的百姓。<\/strong><\/p><p>在這幅巨大的異象裡，先知終於看見神行動的目的。神不是為了展示祂的力量而來，祂是為了「拯救」而來。這個字在一節裡出現兩次：<strong>拯救你的百姓，拯救你的受膏者。<\/strong>全部的威嚴與光輝，都指向一個方向：拯救。<\/p><p>然後有一句極難讀的話：打破惡人家長的頭，露出他的腳，直到頸項。我們必須在這裡停下來，說清楚幾件事：<strong>第一，這是詩歌的語言，不是行動的指令。第二，行動的主語是神，不是人。第三，這句話沒有給任何人拿起暴力的理由。<\/strong>先知是在描寫神對那個以暗中吞吃貧民為樂的力量，做最後的審判。<\/p><p>3:14 說，那個力量「所喜愛的是暗中吞吃貧民」。這是整個審判的原因，也是整卷書的起點：<strong>先知一開始哭的，就是這些被吞吃的人。<\/strong>神的行動，不是為了抽象的正義，而是為了具體的、被吞吃的、沒有人看見的人。這是神的心。<\/p><p>3:15 以出埃及的記憶收尾：你乘馬踐踏紅海，就是踐踏洶湧的大水。這是神最熟悉的作為：祂曾經在無路之處，開了一條路。<strong>先知把這個記憶放在這一段的最後，是要告訴我們：神所做的，是祂從前已經做過的。<\/strong>祂不是第一次拯救。<\/p><p>對受壓的人，這一段的安慰是：<strong>神的眼睛，先看見被吞吃的人。<\/strong>你的名字沒有被寫在報紙上，也許沒有人知道你受的苦，但神知道，祂為你出來。對握有權力的人，這一段是一個沉重的提醒：我的力量，是拿來保護人，還是在暗中吞吃人？<\/p><p>最後要提醒：這段經文在牧養上要慢慢讀。曾經被暴力傷害的人，讀到「打破頭」，可能會感到不安，甚至被觸動。我們不催促任何人「要為此歡喜」，也不要求受傷的人立刻同意任何一個畫面。<strong>先讓他知道：這裡的神，是站在受傷者那一邊的。<\/strong><\/p><p>對正在尋找「神在哪裡」的人，這一段提供了一個很具體的答案：<strong>祂在往你這邊走來的路上。<\/strong>「你出來」，是一個動作的動詞。先知看見的神，不是端坐不動的神，是走出來的神。這與 1:13 的「靜默不語」，形成一個很強的對比：靜默的神，在異象裡，是出來行動的神。<\/p><p>我們可以把這一段，放在耶穌的身上來讀：新約告訴我們，神真的「出來」了——祂差了自己的兒子，進到人的苦難裡。我們不替哈巴谷書的這一節強加更多的解釋；我們只是在讀完之後，看見新約所做的那個連結，並且謙卑地說：祂是那位為我們出來的神。<\/p>"},{"a":16,"z":16,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>שָׁמַעְתִּי וַתִּרְגַּז בִּטְנִי לְקוֹל צָלֲלוּ שְׂפָתַי יָבוֹא רָקָב בַּעֲצָמַי וְתַחְתַּי אֶרְגָּז אֲשֶׁר אָנוּחַ לְיוֹם צָרָה לַעֲלוֹת לְעַם יְגוּדֶֽנּוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「我聽見耶和華的聲音，身體戰兢，嘴唇發顫，骨中朽爛；我在所立之處戰兢。我只可安靜等候災難之日臨到，犯境之民上來。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>聽見<\/td><td>שָׁמַעְתִּי<\/td><td>shama'ti<\/td><td>H8085<\/td><td>我聽見<\/td><\/tr><tr><td>戰兢<\/td><td>וַתִּרְגַּז<\/td><td>vattirgaz<\/td><td>H7264<\/td><td>顫動、發抖<\/td><\/tr><tr><td>身體<\/td><td>בִּטְנִי<\/td><td>bitni<\/td><td>H990<\/td><td>我的肚腹、我的內臟<\/td><\/tr><tr><td>嘴唇<\/td><td>שְׂפָתַי<\/td><td>sefatay<\/td><td>H8193<\/td><td>我的嘴唇<\/td><\/tr><tr><td>發顫<\/td><td>צָלֲלוּ<\/td><td>tsalelu<\/td><td>H6750<\/td><td>顫動、嗡嗡作響<\/td><\/tr><tr><td>朽爛<\/td><td>רָקָב<\/td><td>raqav<\/td><td>H7538<\/td><td>腐朽<\/td><\/tr><tr><td>安靜等候<\/td><td>אָנוּחַ<\/td><td>anukhakh<\/td><td>H5117<\/td><td>我要安息、我要等候<\/td><\/tr><tr><td>災難之日<\/td><td>לְיוֹם צָרָה<\/td><td>leyom tsarah<\/td><td>H6869<\/td><td>為了患難的日子<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>我聽見<\/strong>：shama'ti，這是 3:2 「我聽見祢的名聲」的重現，是 3:16 與 3:2 之間的一個拱形。先知在 3:2 聽見，就懼怕；在 3:16 再次聽見，他的身體整個反應了。<\/p><p><strong>身體戰兢，嘴唇發顫，骨中朽爛<\/strong>：vattirgaz bitni, letsalelu sefatay, yavo raqav be'atsamay。三個身體部位：肚腹（bitni）、嘴唇（sefatay）、骨頭（atsamay）。他的戰兢，是從裡到外：內臟、嘴唇、骨頭。這是一個全人的反應。<strong>戰兢<\/strong>：ragaz，與 3:2 的「震怒」（rogez）是同一個字根：神震動，人也震動。<\/p><p><strong>我在所立之處戰兢<\/strong>：vetakhtay ergaz，「在我底下，我發抖」，也有人譯為「我的腳站不穩」。<strong>我只可安靜等候<\/strong>：asher anukhah leyom tsarah，字面是「我要安息，等候患難的日子」。anukhah 的字根是 nu'akh「安息、停下來」，和合本譯成「安靜等候」，是一個很能表達意思的譯法。<\/p><p><strong>犯境之民上來<\/strong>：la'alot le'am yegudennu，「當那個侵略我們的民興起來的時候」。先知所等的，是那一天的來臨。<\/p>","exp":"<p>這一節很短，卻是全卷書最誠實的一節。<\/p><p><strong>我聽見耶和華的聲音，身體戰兢，嘴唇發顫，骨中朽爛。<\/strong>在這一節之前，是壯麗的異象；在這一節之後，是那句有名的「然而，我要因耶和華歡欣」。但在這兩者之間，先知沒有跳過，他停在這裡：他的身體在發抖。<\/p><p>這一點，必須先講。<strong>我們常常急著讀 3:17–18，卻跳過 3:16。<\/strong>我們喜歡「然而，我要歡欣」，卻不喜歡「骨中朽爛」。但先知沒有跳過。他是一個真實的人，他看見神的威榮，他聽見災難要來，他的整個身體都在說：我怕。<\/p><p>這個「怕」，不是信心的缺乏，是在神面前，一個有限的人最真實的反應。<strong>先知沒有在這裡假裝自己很堅強。<\/strong>他不是說「我不怕」，他說「我發抖」。一個肯在神面前誠實地發抖的人，才有可能在下一節，真實地歡欣。<\/p><p>接著是一句很特別的話：我只可安靜等候。這裡的「安靜」，與 2:20 的「肅敬靜默」，是前後呼應。<strong>他在發抖中，選擇了安靜地等。<\/strong>不是因為不怕，而是因為，他知道神在殿中。<\/p><p>牧養上，這一節是給所有「沒有辦法一下子好起來」的人的。你的身體可能在發抖，你的睡眠可能被打亂，你的骨頭可能像在朽爛。這些都不是你「信心不夠」的證明。<strong>先知也有，聖經把它寫了下來。<\/strong>你可以先承認它，不必假裝。<\/p><p>也請在小組裡，讓這一節有足夠的時間。不要太快地說「但是你要歡欣」。先讓人說出他的戰兢，先讓他知道這是被經文允許的。<strong>先有「戰兢」，才有「然而」。<\/strong>沒有被聽見的戰兢，會讓後面的歡欣變得很輕。<\/p><p>讓我們再停留一下，看這節經文的位置。<strong>它前面是最壯麗的異象，後面是最著名的信心宣告。<\/strong>如果我們把這一節拿掉，異象就只剩下壯觀，信心宣告就只剩下口號。是 3:16，把整件事放回人的身體裡。<\/p><p>在教會裡，我們需要更多這樣的「3:16 時刻」：有人可以說「我在發抖」，而其他人不需要立刻解決；有人可以說「我睡不著」，而其他人只是坐下來。<strong>陪伴，往往比答案更接近經文。<\/strong><\/p><p>最後，這一節也給帶領者一個提醒：當有人在小組裡說出自己的戰兢時，請不要用經文去堵住他的口，也不要急著說「但是你要有信心」。<strong>先聽，先陪，先承認這一節就在聖經裡。<\/strong>等他說完了，你可以輕輕地問：你願意讓我為你禱告嗎？<\/p>"},{"a":17,"z":19,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>כִּֽי־תְאֵנָה לֹֽא־תִפְרָח וְאֵין יְבוּל בַּגְּפָנִים כִּחֵשׁ מַעֲשֵׂה־זַיִת וּשְׁדֵמוֹת לֹא־עָשָׂה אֹכֶל גָּזַר מִמִּכְלָה צֹאן וְאֵין בָּקָר בָּרְפָתִֽים׃ וַאֲנִי בַּיהוָה אֶעְלוֹזָה אָגִילָה בֵּאלֹהֵי יִשְׁעִֽי׃ יְהוִהּ אֲדֹנָי חֵילִי וַיָּשֶׂם רַגְלַי כָּֽאַיָּלוֹת וְעַל בָּמוֹתַי יַדְרִכֵנִי לַמְנַצֵּחַ בִּנְגִינוֹתָֽי׃<\/p><\/blockquote>","lit":"<blockquote><p>「雖然無花果樹不發旺，葡萄樹不結果，橄欖樹也不效力，田地不出糧食，圈中絕了羊，棚內也沒有牛；然而，我要因耶和華歡欣，因救我的神喜樂。主耶和華是我的力量；他使我的腳快如母鹿的蹄，又使我穩行在高處。這歌交與伶長，用絲弦的樂器。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>無花果樹<\/td><td>תְאֵנָה<\/td><td>te'enah<\/td><td>H8384<\/td><td>無花果樹<\/td><\/tr><tr><td>不發旺<\/td><td>לֹא תִפְרָח<\/td><td>lo tifrakh<\/td><td>H6524<\/td><td>不開花、不發芽<\/td><\/tr><tr><td>葡萄樹<\/td><td>בַּגְּפָנִים<\/td><td>baggefanim<\/td><td>H1612<\/td><td>葡萄樹<\/td><\/tr><tr><td>橄欖樹<\/td><td>זַיִת<\/td><td>zayit<\/td><td>H2132<\/td><td>橄欖樹<\/td><\/tr><tr><td>然而<\/td><td>וַאֲנִי<\/td><td>va'ani<\/td><td>H589<\/td><td>然而我、但是我<\/td><\/tr><tr><td>歡欣<\/td><td>אֶעְלוֹזָה<\/td><td>e'lozah<\/td><td>H5937<\/td><td>我要歡呼<\/td><\/tr><tr><td>喜樂<\/td><td>אָגִילָה<\/td><td>agilah<\/td><td>H1523<\/td><td>我要喜樂、跳躍<\/td><\/tr><tr><td>力量<\/td><td>חֵילִי<\/td><td>khayli<\/td><td>H2428<\/td><td>我的力量<\/td><\/tr><tr><td>母鹿<\/td><td>כָּאַיָּלוֹת<\/td><td>ka'ayyalot<\/td><td>H355<\/td><td>如母鹿<\/td><\/tr><tr><td>高處<\/td><td>בָּמוֹתַי<\/td><td>bamotay<\/td><td>H1116<\/td><td>我的高處<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>雖然<\/strong>：3:17 的 ki（和合本譯作「雖然」）通常是「因為」「當」的意思，這裡帶讓步語氣。意思是：即使這一切都發生了。<strong>無花果樹、葡萄樹、橄欖樹、田地、羊、牛<\/strong>：這六樣，是古代農家最基本的生計。從果樹到田地到牲畜，是一個完整的經濟：最後一樣也沒有了。<\/p><p><strong>然而，我要因耶和華歡欣<\/strong>：va'ani bayhwh e'lozah，字面是「但我，在耶和華裡，我要歡呼」。va'ani（但我）是一個強烈的轉折。<strong>歡欣、喜樂<\/strong>：e'lozah（H5937）與 agilah（H1523），兩個動詞並列。agilah 的字根 gil，就是 1:15 迦勒底人「歡喜快樂」（yagil）的同一個字根。同一個字，對象換了：從網，換成耶和華。<\/p><p><strong>救我的神<\/strong>：be'lohe yish'i，「在我拯救的神裡」。yesha（H3468）是 3:13 反覆出現的「拯救」。<strong>主耶和華是我的力量<\/strong>：YHWH adonay khayli，khayil 有「力量、軍力、能力」的意思，是舊約形容軍隊的字；先知用它來說：祂是我的軍隊，我的全部力量。<\/p><p><strong>快如母鹿的蹄，穩行在高處<\/strong>：vayyasem raglay ka'ayyalot ve'al bamotay yadrikheni。bamot（高處）在舊約也指山嶺（申32:13、賽58:14），這裡的畫面是：母鹿在險峻的山岩間，腳不打滑，一步一步踏在高處。<strong>伶長、絲弦的樂器<\/strong>：lamenatse'akh binginotay，這是詩篇常見的結尾格式，說明這是一首被唱出來的禱告。<\/p>","exp":"<p>這一段是全卷的高峰，也是整本書最安靜的一次轉身。<\/p><p>先知先說：雖然無花果樹不發旺，葡萄樹不結果，橄欖樹也不效力，田地不出糧食，圈中絕了羊，棚內也沒有牛。<strong>這是一個一個被拿走的清單。<\/strong>果樹、田地、牲畜，是一個農家全部的生計。他不是在說一個小小的缺乏，他是在說一個什麼都沒有的日子。<\/p><p>請注意：這個「雖然」，沒有說「事情會好起來」。<strong>先知沒有說這些會恢復，也沒有承諾他會得到補償。<\/strong>他說的是：就算全部都沒有。這是一個不帶條件的「雖然」。<\/p><p>然後，是一個詞：<strong>然而。<\/strong>va'ani，「但我」。這個「然而」，不是否認前面的缺乏，也不是把缺乏變小。它站在缺乏的旁邊，說：我要因耶和華歡欣，因救我的神喜樂。<\/p><p>這句話的力量，來自一個對比。<strong>1:15 迦勒底人對著網，歡喜快樂；3:18 先知對著耶和華，歡喜快樂。<\/strong>同一個字，歡喜的對象換了。迦勒底人的歡喜，建立在他的網滿了；先知的歡喜，建立在他的網空了、田也空了，他仍然有耶和華。這是真正的「無己」：我的歡喜，不靠我所擁有的。<\/p><p>接著是 3:19：主耶和華是我的力量。他使我的腳快如母鹿的蹄，又使我穩行在高處。<strong>這句話不是成功神學。<\/strong>它不是說「我會升遷」「我會得勝」，更不是說「我會變得富有」。它說的是：在險峻的地方，我的腳不會滑；因為祂是我的力量。<\/p><p>請小心，不要把 3:18 變成一種壓力。<strong>不要對正在受苦的人說：「你要歡欣！」<\/strong>先知是在經過了 3:16 的戰兢之後，才說出這句話的。這個歡欣，是一個人在神面前走過真實的恐懼之後，所做的選擇，不是一個被命令的情緒。<\/p><p>讓耶穌作王，在這一節的意思，是：我的歡喜，不再建立在無花果樹的收成上，而建立在那位「救我的神」上。耶穌是我們的榜樣：祂在客西馬尼園戰兢，也在十字架上把自己交給父；祂是真正在「雖然」之中說出「然而」的那一位。<strong>讓耶穌得著一切的榮耀，因為最後站著的，不是我們的信心，是那位拯救我們的神。<\/strong><\/p><p>這一段的結構，也值得留意：先知用了三節，說了一個完整的下沉與上升。3:17 是一路往下，從果樹到田地到牲畜，一樣一樣失去；3:18 是一個轉身；3:19 是向上，從腳到高處。<strong>下沉得越深，轉身越清楚，上升越有力量。<\/strong>先知沒有避開下沉，他走進了下沉的最深處，才在那裡說出「然而」。<\/p><p>這也是整卷書給我們的路：從問，到站，到等，到靜默，到戰兢，到歡欣。每一個階段，都被經文承認。<strong>先知不是一下子到達 3:18 的；他是一步一步，被神帶到那裡的。<\/strong>如果你今天還在 1:2 的地方，不要急；那裡也是被神的話所收容的地方。<\/p>"}]},"serm":{"1":{"min":11,"blocks":[["h","《你為何看著不理呢》"],["p","弟兄姊妹平安。"],["p","今天我們讀哈巴谷書第一章。"],["p","先問一個問題。"],["p","你有沒有在半夜裡，"],["p","睜著眼睛看天花板，"],["p","對神問過一句話？"],["p","不是「神啊，祢愛我嗎」。"],["p","是更硬的一句：要到幾時。"],["p","要到幾時，這件事才會過去。"],["p","要到幾時，那個人才會改變。"],["p","要到幾時，祢才肯出手。"],["p","很多人不敢問。"],["p","怕被說成信心不夠。"],["p","怕被說成在埋怨神。"],["p","可是今天，我們要翻開一卷書，"],["p","它的第一句話，就是這個問題。"],["p","我們分三個部分來讀。"],["p","第一，到幾時。"],["p","第二，我行一件事。"],["p","第三，為何看著不理。"],["h","一、到幾時"],["p","先看這一卷書的書名。"],["q","先知哈巴谷所得的默示。（哈1:1）"],["p","只有一節。"],["p","沒有王的名字。"],["p","沒有年代。"],["p","也沒有告訴我們，他是哪一個城的人。"],["p","別的先知書，開頭都說「在某王的日子」。"],["p","這一卷沒有。"],["p","我們只知道一件事：有一個人，"],["p","叫哈巴谷，他得了一份默示。"],["p","「默示」這個字，在原文裡，有一個意思，"],["p","叫擔子。"],["p","就是壓在肩上的重量。"],["p","他不是旁觀者。"],["p","他是被這個問題壓住的人。"],["p","一個沒有年代的書名，"],["p","反而成了一個邀請。"],["p","誰在受苦，誰就可以站在他的位置上。"],["p","接著，他開口了。"],["q","耶和華啊！我呼求你，你不應允，要到幾時呢？我因強暴哀求你，你還不拯救。（哈1:2）"],["p","請你留意，他不是在對人說話。"],["p","也不是在對空氣說話。"],["p","他是對著耶和華說的。"],["p","他沒有先寫三段頌讚。"],["p","沒有先說「我知道祢的旨意是美好的」。"],["p","他直接說：我呼求，祢不應允。"],["p","這個「到幾時」，在詩篇裡，出現了很多次。"],["p","詩篇十三篇說：耶和華啊，"],["p","你忘記我要到幾時呢？"],["p","所以，這不是一個離經叛道的問題。"],["p","這是聖經裡，受苦的人最古老的禱告。"],["p","你可能正在等一個人。"],["p","等一個孩子回家。"],["p","等一份診斷報告。"],["p","等一場官司結束。"],["p","等一個遲遲沒有來的答案。"],["p","這個時候，你最需要的，"],["p","不是別人告訴你：要有信心。"],["p","你需要一個地方，可以誠實地說："],["p","我撐不住了，要到幾時。"],["p","哈巴谷書，就是為這樣的人，預備的地方。"],["p","最會質問神的人，"],["p","常常是還沒有離開神的人。"],["p","真正離開的人，已經不問了。"],["p","接下來，先知說他看見了什麼。"],["q","你為何使我看見罪孽？你為何看著奸惡而不理呢？（哈1:3）"],["p","他的痛苦，不只是自己遭遇了什麼。"],["p","是被迫看見。"],["p","看見身邊的人受欺壓。"],["p","看見公平被踩在腳下。"],["p","看見一個本來可以出手的神，"],["p","好像沒有動。"],["p","有一種痛，叫做看見的痛。"],["p","你不是當事人，可是你看見了，"],["p","你就放不下。"],["p","然後，他把這個景象，推到整個社會。"],["q","因此律法放鬆，公理也不顯明；惡人圍困義人，所以公理顯然顛倒。（哈1:4）"],["p","律法放鬆。"],["p","這個「放鬆」，原文的意思是麻木。"],["p","像手腳發麻的人，動不了。"],["p","不是律法被廢掉。"],["p","是律法失去了力量。"],["p","公理，像一條直線，被人扭彎了。"],["p","惡人，不是欺負義人而已。"],["p","是把義人圍起來。"],["p","弟兄姊妹，我們要在這裡停一停。"],["p","神的話，容許一個受苦的人這樣開口。"],["p","先知的問題，被寫進了聖經。"],["p","放在書的最前面。"],["p","沒有被修剪，也沒有被糾正。"],["p","這是神給受苦者的第一個安慰："],["p","你可以這樣問。"],["p","我們不替先知加上他沒有說的話。"],["p","也不急著替神解釋。"],["p","先站在他的旁邊，聽他把話說完。"],["p","也請你留意一個界線。"],["p","先知的質問，是禱告。"],["p","不是教我們用怨恨，對待神。"],["p","他的呼求，是對著神，不是對著鄰舍。"],["p","還有一種人，連問都問不出來。"],["p","只能安靜地坐著。"],["p","神也聽得見，沒有聲音的呼求。"],["h","二、我行一件事"],["p","先知問完了，神回答了。"],["q","你們要向列國中觀看，大大驚奇；因為在你們的時候，我行一件事，雖有人告訴你們，你們總是不信。（哈1:5）"],["p","請你看，神的第一句回答，不是解釋。"],["p","是一個命令：你們要看。"],["p","先知一直在看自己的面前。"],["p","暴力。"],["p","不公。"],["p","公理顛倒。"],["p","他被這些畫面釘住了。"],["p","神說：抬起頭來，向列國中觀看。"],["p","祂沒有否認先知看見的痛苦。"],["p","祂是說：還有一些事，你沒有看見。"],["p","「我行一件事。"],["p","」"],["p","原文是兩個同根的字，疊在一起。"],["p","意思是：我正在作為。"],["p","神沒有睡覺。"],["p","神沒有袖手旁觀。"],["p","很多時候，我們以為神沒有回答。"],["p","其實，神在動工。"],["p","只是祂動工的方向，我們沒有看見。"],["p","神的沉默，不等於神不動工。"],["p","這一句，我們要記在心裡。"],["p","可是，下一句話，讓人說不出話來。"],["q","我必興起迦勒底人，就是那殘忍暴躁之民，通行遍地，佔據那不屬自己的住處。（哈1:6）"],["p","先知為猶大國裡的暴力與不公哀求。"],["p","神說：我要興起一個更兇猛的國。"],["p","這個回答，比問題更大，也更難。"],["p","難怪神先說：雖有人告訴你們，"],["p","你們總是不信。"],["p","祂知道這個答案，不容易接受。"],["p","弟兄姊妹，這裡有三件事，我們要記住。"],["p","第一，神真的聽見了。"],["p","祂有回答。"],["p","第二，祂的回答，"],["p","不一定是我們要的那一種。"],["p","第三，祂的作為，常常比我們的問題更大。"],["p","請你不要太快替神解釋。"],["p","也不要太快說：我明白了。"],["p","然後，經文用了五節的篇幅，"],["p","描寫迦勒底人。"],["p","他們威武可畏。"],["p","馬比豹更快。"],["p","比晚上的豺狼更猛。"],["p","馬兵從遠方來，像老鷹俯衝，抓食。"],["p","第十節又說，他們譏誚君王，"],["p","笑話首領，嗤笑一切保障。"],["p","沒有一道牆，擋得住他們。"],["p","沒有一個權威，被他們放在眼裡。"],["p","這幾節，從馬，寫到兵，寫到態度，"],["p","最後寫到心。"],["p","經文一路往裡面走。"],["p","外面的威風，最後都指向一個問題："],["p","他把什麼，放在神的位置上。"],["p","這是一個很好的提醒。"],["p","我們判斷一個人，一個系統，"],["p","不要只看它多強大。"],["p","要看它，最後敬拜什麼。"],["p","可是請你留意，這幾節最後落在哪裡。"],["p","他們「都為行強暴而來」。"],["p","強暴。"],["p","先知在第二節，"],["p","哀求神救他脫離的那個字。"],["p","神在這裡，用同一個字，回答他。"],["p","這不是巧合。"],["p","這是神在說：我聽見你哭的那個字了。"],["p","我沒有忘記。"],["p","先知喊的那個字，"],["p","成了神回答裡的那個字。"],["p","這是整卷書，一條很深的線。"],["p","我們在第二章，還要再看見它。"],["p","神記得我們哭的是什麼。"],["p","再看第十一節。"],["q","他以自己的勢力為神，像風猛然掃過，顯為有罪。（哈1:11）"],["p","這一句，說穿了這個帝國的問題。"],["p","他可怕，不只是因為馬快、兵多。"],["p","是因為他把自己的力量，當作神。"],["p","這是舊約最深的一個罪名："],["p","把神的位置，放給自己。"],["p","讀到這裡，我們很容易鬆一口氣。"],["p","原來，神也看見他們的罪。"],["p","但是，這一句，也是對我們說的。"],["p","以自己的勢力為神，不只是帝國的試探。"],["p","也是每一個握著一點權力的人的試探。"],["p","職位。"],["p","金錢。"],["p","人脈。"],["p","能力。"],["p","所以，我們先不把這一節，指向別人。"],["p","我們先把它，舉到自己的面前。"],["p","也請記住一件事。"],["p","迦勒底人，是當時的一個帝國。"],["p","是神在那個歷史時刻，所用的工具。"],["p","我們不把他們，"],["p","對應到今天任何一個國家、民族或政權。"],["p","也不拿這段經文，替任何戰爭辯護。"],["p","經文說的，是神在歷史中的主權。"],["p","不是替人間的強權背書。"],["h","三、為何看著不理"],["p","先知聽完了。"],["p","他沒有鬆一口氣。"],["p","他問得更深。"],["q","你眼目清潔，不看邪僻，不看奸惡；行詭詐的，你為何看著不理呢？惡人吞滅比自己公義的，你為何靜默不語呢？（哈1:13）"],["p","請你留意，他是從哪裡開口的。"],["p","前一節，他先說：耶和華，我的神，"],["p","我的聖者啊，你不是從亙古而有嗎？"],["p","他是跪著問的。"],["p","他先站在神的永恆上。"],["p","然後才問：我所認識的神，眼目清潔；"],["p","可是我眼前的歷史，卻讓這位神，"],["p","像一個旁觀者。"],["p","這兩件事，怎麼同時是真的？"],["p","這不是外面人的挑戰。"],["p","是一個信徒心裡的衝突。"],["p","他沒有離開神。"],["p","他把這個衝突，直接放在神面前。"],["p","他還說了一句話：我們必不致死。"],["p","這句話，在原文裡，有不同的讀法。"],["p","但是力量是一樣的。"],["p","先知抓住神的永恆，當作一根繩子。"],["p","祢是亙古的，"],["p","所以我們不會被這件事，徹底毀滅。"],["p","人在最黑的時候，需要一根這樣的繩子。"],["p","不是一個答案。"],["p","是一根，可以抓住的繩子。"],["p","這就是信靠的一種方式。"],["p","一個人，若對神已經沒有任何信靠，"],["p","他不會這樣稱呼祂。"],["p","他不會說：我的神，我的聖者。"],["p","這個稱呼，是從一個關係裡，出來的。"],["p","所以，這卷書的質問，與一般的抱怨，"],["p","不一樣。"],["p","抱怨的人，是轉身離開。"],["p","質問的人，是面對面，站著。"],["p","然後，他把眼前的畫面，說出來。"],["p","他說：祢為何使人如海中的魚？"],["p","一個人，站在水邊。"],["p","手裡拿著鉤，拿著網。"],["p","魚，沒有管轄的人，沒有任何防備。"],["p","這個人用網捕獲，用拉網聚集。"],["p","他歡喜快樂。"],["q","就向網獻祭，向網燒香，因他由此得肥美的分和富裕的食物。（哈1:16）"],["p","他不是在報仇。"],["p","他是在享受。"],["p","他向網獻祭。"],["p","他把自己的工具，當作神明。"],["p","當一個人的方法，比他的對象更大。"],["p","工具，就成了神。"],["p","這個危險，不只在帝國身上。"],["p","也在我們身上。"],["p","有人靠一個技術。"],["p","有人靠一套人脈。"],["p","有人靠一個成功的模式。"],["p","還有人，"],["p","靠一套讓自己不必倚靠神的辦法。"],["p","這是我們的網。"],["p","我們要誠實地問：我在向哪一張網，燒香？"],["p","也許，你不是在拿刀。"],["p","你只是每天，在一個地方，"],["p","用一種方法，把自己養得很安全。"],["p","這個方法，不叫神。"],["p","可是，當它不見了，你就整個人垮了。"],["p","那它，就是你的網。"],["p","發現這一點，不是定罪。"],["p","是恩典的開始。"],["p","因為你看見的時候，神已經在這裡。"],["p","這一章的最後，沒有答案。"],["q","他豈可屢次倒空網羅，將列國的人時常殺戮，毫不顧惜呢？（哈1:17）"],["p","先知把問題，放在神面前。"],["p","就停在那裡。"],["p","他沒有說：我明白了。"],["p","也沒有說：我不問了。"],["p","弟兄姊妹，這是第一章最誠實的地方。"],["p","它告訴我們：信心，不是沒有問題。"],["p","信心，是把問題帶到神面前，然後等候。"],["p","第二章第一節，就是這個等候的開始。"],["p","先知說：我要站在守望所。"],["p","他的轉折，不是得到了答案。"],["p","是換了站立的位置。"],["p","這一章，沒有給我們一個漂亮的結局。"],["p","可是，它給了我們一個姿態："],["p","帶著問題，不離開。"],["p","今天，如果你還站在「到幾時」的地方，"],["p","請你不要急。"],["p","也不要覺得羞愧。"],["p","這個地方，是被神的話收容的地方。"],["p","神沒有責備先知。"],["p","祂把他的問題，收進了聖經。"],["p","最後，我們把這一章，放回三二一。"],["p","耶穌是我的榜樣。"],["p","祂在客西馬尼園，也問過；"],["p","祂在十字架上，也喊過：我的神，"],["p","我的神，為什麼離棄我？"],["p","祂沒有離開父，祂是帶著問題，"],["p","把自己交在父的手裡。"],["p","聖經是我的準則。"],["p","它容許我們這樣問，"],["p","也要我們帶著問題，繼續聽。"],["p","聖靈是我的引導。"],["p","當我們問不出口的時候，"],["p","祂親自為我們禱告。"],["p","讓耶穌作王，"],["p","就是放下我要先弄明白才肯信的那個驕傲。"],["p","讓耶穌得到一切的榮耀，"],["p","就是在還沒有答案的時候，"],["p","仍然把眼睛放在祂身上。"],["p","焦點在耶穌，不在強暴，"],["p","不在迦勒底人，不在我的處境。"],["p","求主使我們這一週，"],["p","在每一個問題裡，"],["p","都不離開祂的面前。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"2":{"min":11,"blocks":[["h","《惟義人因信得生》"],["p","弟兄姊妹平安。"],["p","今天我們讀哈巴谷書第二章。"],["p","先問一個問題。"],["p","你有沒有等過一個結果？"],["p","一份檢查報告。"],["p","一封面試的通知。"],["p","一個孩子的消息。"],["p","你每天看手機，看了又看。"],["p","越看，越覺得時間走得很慢。"],["p","這樣的日子，聖經有一個字，叫做等候。"],["p","今天這一章，就是一個人，"],["p","站在崗位上，等候的故事。"],["p","我們分三個部分來讀。"],["p","第一，守望所與因信得生。"],["p","第二，五禍與榮耀的知識。"],["p","第三，偶像與聖殿。"],["h","一、守望所與因信得生"],["p","上一章的最後，"],["p","先知問完了一串沒有答案的問題。"],["p","第二章的第一句，他沒有再問。"],["p","他換了一個位置。"],["q","我要站在守望所，立在望樓上觀看，看耶和華對我說什麼話。（哈2:1）"],["p","請你留意三個動作。"],["p","我要站。"],["p","我要立。"],["p","我要觀看。"],["p","這不是路過。"],["p","這是刻意選了一個位置。"],["p","守望的人有一個特點。"],["p","他不決定，消息什麼時候來。"],["p","他只決定，自己站在哪裡。"],["p","第一章，先知看的是罪孽、強暴、公理顛倒。"],["p","他看的是周圍。"],["p","第二章，他看的是神。"],["p","他沒有等到周圍變好，才去看神。"],["p","他是在周圍沒有變的時候，"],["p","轉過身去，看神。"],["p","這一小步，是整卷書最重要的一步。"],["p","弟兄姊妹，你不必先想通。"],["p","你可以先站好。"],["p","站在禱告裡。"],["p","站在聚會裡。"],["p","站在每天讀經的那個固定時間裡。"],["p","這個站，不是消極的。"],["p","是把自己，放在神可以對我說話的地方。"],["p","我不知道，你今天站在哪裡。"],["p","有人站在新聞的畫面前。"],["p","有人站在帳單前面。"],["p","有人站在別人對自己的評語前面。"],["p","這些位置，都不是守望所。"],["p","守望所，是一個選擇。"],["p","對有的人，是清晨的一段安靜。"],["p","對有的人，是週間固定的禱告會。"],["p","對有的人，是下班路上的十分鐘。"],["p","位置不必華麗。"],["p","只要固定，而且，人在那裡。"],["p","神回答了。"],["p","第一句，不是答案。"],["p","是一個指示。"],["q","將這默示明明地寫在版上。（哈2:2）"],["p","寫下來。"],["p","寫大一點。"],["p","讓路過的人，也讀得到。"],["p","神把先知一個人的問題，"],["p","變成了一份給眾人的話。"],["p","請你留意，神寫的是「異象」。"],["p","不是「理由」。"],["p","神沒有給先知一份，完整的解釋。"],["p","祂給的，是一個可以被信靠的方向。"],["p","人在苦難裡，常常盼望理由。"],["p","神常常先給的，是祂自己的話。"],["p","理由，也許很後面才出現。"],["p","也許今生，都不出現。"],["p","但是神的話，現在就可以抓住。"],["p","然後，是每一個等候的人，都熟悉的一節。"],["q","因為這默示有一定的日期，快要應驗，並不虛謊。雖然遲延，還要等候；因為必然臨到，不再遲延。（哈2:3）"],["p","這一節，有兩個層次。"],["p","第一層，是人的感覺：遲延。"],["p","神沒有否認，人覺得慢。"],["p","祂用了這個字，承認等候的人，"],["p","所感受到的，是真的。"],["p","第二層，是神的時間：不再遲延。"],["p","在祂那裡，它不會晚到。"],["p","這兩句話，並排放著。"],["p","沒有互相取消。"],["p","它們同時是真的。"],["p","請你注意，神沒有說：再等一下就好。"],["p","祂說的是：還要等候。"],["p","我們不知道日期。"],["p","我們不拿這句話，去算任何事情。"],["p","我們只是知道，神的話，不虛謊。"],["p","神的時間，不遲到。"],["p","而你，不是一個人在這裡等。"],["p","先知，也等過。"],["p","接著，就是整卷書最有名的一節。"],["q","迦勒底人自高自大，心不正直；惟義人因信得生。（哈2:4）"],["p","兩個人。"],["p","兩條路。"],["p","一個，自高自大，裡面是歪的。"],["p","一個，是義人。"],["p","第一章，這個義人，被圍困，被吞滅。"],["p","他是被傷害的那個人。"],["p","現在，神對他說：你要活。"],["p","而你活著的方式，不是靠你的力量。"],["p","是靠一個，穩定的倚靠。"],["p","這個「信」，原文的意思，是可靠，是站得穩。"],["p","不是頭腦裡，一個很大的相信。"],["p","所以，我們要很小心。"],["p","義人因信得生，不是說：信心夠大，"],["p","才有生命。"],["p","它不是一個分數。"],["p","生命，是神給的。"],["p","信，是靠著祂，不離開。"],["p","一個信心搖搖晃晃的人，"],["p","不需要先把信心練到某個程度，"],["p","才算活著。"],["p","他只要繼續，向神倚靠。"],["p","新約三次引用這一節。"],["p","羅馬書、加拉太書、希伯來書。"],["p","保羅用它講稱義。"],["p","希伯來書用它講忍耐。"],["p","但是它們，都沒有離開哈巴谷的處境："],["p","一個在等候中的義人，靠著神，活下去。"],["p","我們的主耶穌，就是這樣活的。"],["p","祂在曠野，被試探的時候，靠神的話，活。"],["p","祂在十字架上，把靈魂交在父的手裡。"],["p","祂是第一個，真正因信得生的義人。"],["p","我們因信，與祂聯合。"],["p","祂的信實，成了我們活下去的根基。"],["h","二、五禍與榮耀的知識"],["p","接下來，是五個「禍哉」。"],["p","我們要先理解一件事。"],["p","這五個禍，是被壓迫的人，編成的歌。"],["p","不是先知拿來咒詛任何人的話。"],["q","這些國的民豈不都要提起詩歌並俗語譏刺他說：禍哉！迦勒底人，你增添不屬自己的財物，多多取人的當頭，要到幾時為止呢？（哈2:6）"],["p","「禍哉」這個字，原本是喪禮上的哀哭。"],["p","像是對一個還活著的人，唱哀歌。"],["p","意思是：你正走向死亡，你自己還不知道。"],["p","先知問神：到幾時。"],["p","被壓迫的人問壓迫者：到幾時。"],["p","同一個句型。"],["p","第一個禍，說的是增添。"],["p","這是一首歌。"],["p","唱歌的人，是誰？"],["p","是那些，被取走的人。"],["p","是那些，被押當，被債務壓住的人。"],["p","神說，有一天，他們的聲音，要被聽見。"],["p","這個聽見，是神給受壓迫者的尊重。"],["p","在我們讀的時候，要先問：這首歌裡，"],["p","有沒有我所傷害過的人的聲音？"],["p","增添不屬自己的財物。"],["p","可能是錢。"],["p","也可能是時間，是功勞，是別人的付出。"],["p","第二個禍，說的是家。"],["p","為本家積蓄不義之財，在高處搭窩，"],["p","指望免災。"],["p","他的動機，聽起來不壞。"],["p","我要保護我的家。"],["p","可是，用不義的方法保護，最後，"],["p","卻使家蒙羞。"],["p","然後，有一句很驚人的話。"],["q","牆裡的石頭必呼叫；房內的棟樑必應聲。（哈2:11）"],["p","一座房子，石頭開口作證。"],["p","棟樑，回應。"],["p","被害的人，也許沒有機會說話。"],["p","但是房子，會說話。"],["p","你沒有聲音的地方，連石頭，都有聲音。"],["p","第三個禍，是以人血建城。"],["p","一座城，是人類最大的成就。"],["p","也是最大的誘惑。"],["p","我要建一個，不朽的東西。"],["p","但是，如果這座城，是用別人的血汗，"],["p","堆起來的，它會被火燒。"],["p","可是就在這裡，在兩個「禍哉」之間，"],["p","突然出現一幅，完全不同的畫面。"],["q","認識耶和華榮耀的知識要充滿遍地，好像水充滿洋海一般。（哈2:14）"],["p","不是血。"],["p","是水。"],["p","不是火焚。"],["p","是充滿。"],["p","請你想一想，海裡有沒有一處，"],["p","是沒有水的？"],["p","沒有。"],["p","神榮耀的知識，最後，也是這樣。"],["p","不是局部的。"],["p","是無所不在的。"],["p","強暴，曾經充滿這塊地。"],["p","但是，它不是最後一句話。"],["p","這是對先知問題，最深的一個回答。"],["p","他問：祢為何看著不理？"],["p","神說：我的榮耀，要充滿遍地。"],["p","這是一個方向。"],["p","不是一個日期。"],["p","我們不拿它，變成時間表。"],["p","我們只知道，歷史的方向，不是強暴。"],["p","是認識神的榮耀。"],["p","所以，我們每一個人，在家裡，在職場，"],["p","在教會，"],["p","做一件誠實的事，"],["p","饒恕一個人，"],["p","不佔一次便宜，"],["p","就是在這片海裡，多加了一滴水。"],["p","這不是為了成就自己。"],["p","是為了讓耶穌，得著榮耀。"],["p","第四個禍，是最需要小心閱讀的一個。"],["p","它講的，是一種對鄰舍的羞辱與侵犯。"],["p","經文用了含蓄的筆法。"],["p","我們也不重述畫面。"],["p","更不拿它，開任何玩笑。"],["p","我要先對一些人說一句話。"],["p","如果你曾經被人這樣傷害。"],["p","請你聽經文，先說的話。"],["p","神看見了。"],["p","而且說，這是禍。"],["p","它不是你的羞恥。"],["p","是那個人的。"],["p","你可以不急著說話。"],["p","你也可以找一位可信的人，慢慢地講。"],["p","教會，應該是一個安全的地方。"],["p","不追問細節。"],["p","不催你原諒。"],["p","陪著你，走這條路。"],["p","也有一個提醒，給握有位置與權力的人。"],["p","我有沒有用我的位置，"],["p","讓人在我面前，不敢說不？"],["p","真正的權柄，是讓人在我面前，更安全。"],["p","不是更脆弱。"],["q","耶和華右手的杯必傳到你那裡。（哈2:16）"],["p","人用杯，使人失去尊嚴。"],["p","神的杯，是公義的杯。"],["p","在祂手裡，羞辱不再是，"],["p","一個人可以隨意，"],["p","施加在另一個人身上的武器。"],["p","這一段，我們不催促任何人說：你要原諒。"],["p","復原，是一條路。"],["p","有時間，有同伴，有時也需要專業的協助。"],["h","三、偶像與聖殿"],["p","第五個禍，是一幅，幾乎荒謬的畫面。"],["q","對木偶說：醒起！對啞巴石像說：起來！（哈2:19）"],["p","一個人，拿著木頭。"],["p","對它說：醒來吧。"],["p","對著石頭說：起來幫助我。"],["p","聽起來很可笑。"],["p","可是，請你想一想。"],["p","我們每一個人，有沒有一些東西，"],["p","我們指望它醒來，幫助我們？"],["p","我的專業。"],["p","我的存款。"],["p","我的計畫。"],["p","我的名聲。"],["p","凡是我必須靠它，才能安心的，"],["p","就是我的神。"],["p","第一章，迦勒底人向網獻祭。"],["p","第二章，人向木偶求醒。"],["p","全卷有一個，一致的主題："],["p","一個人的神，是他所倚靠的東西。"],["p","外表，包著金銀。"],["p","裡面，毫無氣息。"],["p","這與第四節的「因信得生」，"],["p","形成最深的對比。"],["p","義人因信，得生。"],["p","偶像之人，倚靠沒有氣息的東西。"],["p","生命，來自活的神。"],["p","不是來自人造的東西。"],["p","我們也不必恐慌。"],["p","發現自己的偶像，是恩典的開始。"],["p","不是定罪的開始。"],["p","因為，當我們看見的時候，"],["p","神已經在這裡了。"],["p","祂不是來嚇我們。"],["p","祂是來，把我們帶回那位，"],["p","有氣息的神那裡。"],["p","然後，第二章，用一節，收尾。"],["p","只有一節。"],["q","惟耶和華在他的聖殿中；全地的人都當在他面前肅敬靜默。（哈2:20）"],["p","前面有那麼多聲音。"],["p","譏刺的歌。"],["p","石頭的呼叫。"],["p","棟樑的回應。"],["p","木偶，被喊著「醒起」。"],["p","到了最後，所有的聲音，都停了。"],["p","這個「惟」字，很重要。"],["p","在這一切之後，惟有耶和華。"],["p","偶像是啞巴的。"],["p","耶和華，是活著的。"],["p","偶像，要被人搖醒。"],["p","耶和華，不需要任何人叫醒。"],["p","這個靜默，不是被迫閉嘴。"],["p","不是屬靈的壓抑。"],["p","它是一個人，被神的回答，安靜了。"],["p","我們要小心。"],["p","這節經文，不是要叫人，停止禱告，"],["p","停止問問題。"],["p","先知的問題，神沒有責備。"],["p","這裡的靜默，是在神回答之後的靜默。"],["p","靜默，是回答之後的敬拜。"],["p","不是問題之前的封口。"],["p","也不是用來，打斷受苦者的眼淚。"],["p","今天，當你的心裡，有很多聲音。"],["p","各種擔憂。"],["p","各種「我該怎麼辦」。"],["p","請你停一停，對自己說一句話："],["p","惟耶和華在祂的聖殿中。"],["p","最後，我們把這一章，放回三二一。"],["p","耶穌是我的榜樣。"],["p","祂在最黑暗的時候，仍然信靠父，"],["p","把自己交在祂的手裡。"],["p","聖經是我的準則。"],["p","它告訴我們，義人的生命，"],["p","不在自己的力量，在神的信實。"],["p","聖靈是我的引導。"],["p","在等候的日子裡，祂陪我們站在守望所。"],["p","我們也要放下一個東西。"],["p","放下我要自己，保障自己的那個「窩」。"],["p","無己，才能在等候中，不慌張。"],["p","無己，才能把耶穌，放在聖殿的中間。"],["p","讓耶穌作王，就是讓祂，"],["p","在我心裡的殿中，作主。"],["p","讓耶穌得到一切的榮耀，"],["p","就是讓一切的聲音，在祂面前，安靜。"],["p","焦點在耶穌，不在我的等候，"],["p","不在別人的成功，不在環境的好壞。"],["p","先知在守望所，站好了。"],["p","神，就開口了。"],["p","你也站好。"],["p","不必急著，要祂今天就說完所有的話。"],["p","祂的話，不虛謊，祂的時間，不遲到。"],["p","你只要，繼續站著，繼續聽。"],["p","求主使我們這一週，"],["p","每天找一個守望所，站好，安靜，"],["p","不離開。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]},"3":{"min":11,"blocks":[["h","《然而，我要因耶和華歡欣》"],["p","弟兄姊妹平安。"],["p","今天我們讀哈巴谷書第三章。"],["p","也是這一卷書的最後一章。"],["p","先問一個問題。"],["p","你有沒有一首歌，"],["p","是只有在特別黑的夜晚，"],["p","才唱得出來的？"],["p","不是在舞台上唱的。"],["p","是在廚房裡，一邊洗碗，一邊哼的。"],["p","是在病房外面，坐著，輕輕地哼。"],["p","這樣的歌，往往不好聽。"],["p","聲音在抖。"],["p","可是，它是真的。"],["p","哈巴谷書第三章，就是這樣一首歌。"],["p","它的標題，叫做禱告。"],["p","我們分三個部分來讀。"],["p","第一，求你復興。"],["p","第二，神的顯現。"],["p","第三，雖然，然而。"],["h","一、求你復興"],["p","前面兩章，先知的角色，不一樣。"],["p","第一章，他在問。"],["p","第二章，他在聽。"],["p","第三章，他開口，禱告。"],["p","問，聽，禱。"],["p","這是一個人與神之間，最完整的一條路。"],["q","耶和華啊，我聽見你的名聲就懼怕。耶和華啊，求你在這些年間復興你的作為，在這些年間顯明出來；在發怒的時候以憐憫為念。（哈3:2）"],["p","他的禱告，從「我聽見」開始。"],["p","聽見什麼？"],["p","聽見神，在歷史裡所作的事。"],["p","他的反應，不是興奮。"],["p","是懼怕。"],["p","這不是驚嚇。"],["p","是認識了神是誰，之後的敬畏。"],["p","他不再把神，當作一個，"],["p","可以被質問到無話可說的對象。"],["p","他知道，祂是神。"],["p","然後，他求。"],["p","求什麼？"],["p","不是求神，改變祂的計畫。"],["p","不是求神，拿掉他的痛苦。"],["p","他求神：在這些年間，使祢的作為，活過來。"],["p","這個「作為」，就是第一章五節，神說的："],["p","我行一件事。"],["p","先知求神，把自己說過的事，"],["p","在他們的時代，使它活。"],["p","然後，是最重要的一個請求。"],["p","在發怒的時候，以憐憫為念。"],["p","他知道，神的公義，必然施行。"],["p","迦勒底人的來臨，已經確定。"],["p","但是他求：在那最嚴厲的時刻，"],["p","祢仍然記得憐憫。"],["p","他沒有求神，取消審判。"],["p","他求的是，審判之中，仍有憐憫。"],["p","這是一個很成熟的禱告。"],["p","它承認神的公義。"],["p","也抓住神的憐憫。"],["p","它不迴避痛苦。"],["p","也不放棄盼望。"],["p","你不必等到所有的疑問，都解決了，"],["p","才能這樣禱告。"],["p","先知這一章的禱告，"],["p","就是在第一章的問題，"],["p","沒有全部被回答之後，說出來的。"],["p","他仍有疑問。"],["p","他卻選擇，禱告。"],["p","而且，這個禱告，後來被「交給伶長」，"],["p","用絲弦的樂器，唱出來。"],["p","一個人在黑暗裡，說的話，"],["p","後來成為整個群體，一起唱的歌。"],["p","這是神給受苦者的一種尊重。"],["p","你的問，你的禱告，不是羞恥。"],["p","是可以被眾人，一起唱的歌。"],["p","如果你今天，說不出完整的禱告。"],["p","可以先借用先知的這一句。"],["p","耶和華啊，我聽見祢的名聲就懼怕。"],["p","求祢在這些年間，使祢的作為活過來。"],["p","說完就好。"],["p","不必再加。"],["h","二、神的顯現"],["p","接著，先知看見了。"],["q","神從提幔而來；聖者從巴蘭山臨到。（哈3:3）"],["p","提幔，巴蘭。"],["p","這是西奈曠野南方與北方的地名。"],["p","這是以色列人的老記憶。"],["p","當年，他們從埃及出來。"],["p","神在西奈，在曠野，一路帶領。"],["p","先知回頭，把這些畫面，再看一次。"],["p","這個異象，給先知一個功課。"],["p","記憶。"],["p","當現在的處境，讓人懷疑神是不是還在。"],["p","記憶，是一種抵抗。"],["p","先知不是靠自己的感覺，撐下去。"],["p","他是靠回頭，看神曾經怎樣作。"],["p","我們也是一樣。"],["p","把神過去的作為，一件，一件，"],["p","寫在自己的記憶裡。"],["p","這個月，神怎樣幫助了你？"],["p","去年，神怎樣帶你走過？"],["p","把它們，記下來。"],["p","黑暗的時候，這是你的提醒。"],["p","這個異象，是從舊的記憶，長出來的。"],["p","然後是光。"],["p","榮光遮蔽諸天。"],["p","頌讚充滿大地。"],["p","注意這句話：頌讚，充滿大地。"],["p","第二章，說：知識，要充滿遍地。"],["p","第三章，先知已經在異象裡，看見了。"],["p","他盼望的，他已經看見。"],["p","再往下，是瘟疫，是熱症，是山崩，"],["p","是帳棚戰兢。"],["p","這些畫面，不容易讀。"],["p","我們要誠實地承認。"],["p","我們不輕輕帶過。"],["p","但是，我們也要記得兩件事。"],["p","第一，這是詩歌。"],["p","用的是自然與戰爭的圖像。"],["p","它在描寫，神的主權與威嚴。"],["p","第二，從頭到尾，行動的主語，是神。"],["p","不是人。"],["p","弓，是祂的弓。"],["p","箭，是祂的箭。"],["p","通行大地的，是祂。"],["p","沒有一個字，是告訴我們：你要去打誰。"],["p","你要去報復誰。"],["p","我們不拿這些畫面，"],["p","去為任何戰爭、暴力或報復，辯護。"],["p","也不把它們，"],["p","套到今天的任何一個國家，"],["p","或任何一場事件。"],["p","先知所看見的，是神自己。"],["p","而他自己的回應，是什麼？"],["p","等一下，我們會看見。"],["p","不是拿起武器。"],["p","是戰兢。"],["p","在這一段裡，有一個字，我們要特別留意。"],["p","第六節說，祂站立，觀看。"],["p","觀看。"],["p","第一章，先知問：祢為何看著不理？"],["p","第三章，先知看見，神自己，站立，觀看。"],["p","祂不是沒有看。"],["p","祂在看。"],["p","而且，祂動了。"],["p","再看第十節。"],["p","山嶺見祢，無不戰懼。"],["p","深淵發聲，高舉雙手。"],["p","連創造中，最大的，最古老的東西，"],["p","在神面前，都只能回應。"],["p","這與第二章最後一節，是同一個真理。"],["p","全地，都當在祂面前肅敬靜默。"],["p","那位使深淵低頭的神，"],["p","也能面對迦勒底人的來臨。"],["p","這是信靠的根基。"],["p","也是後來，第十八節，能夠說出口的原因。"],["p","然後，是整段異象的樞紐。"],["q","你出來要拯救你的百姓，拯救你的受膏者。（哈3:13）"],["p","你出來。"],["p","是一個動作的動詞。"],["p","先知看見的神，不是端坐不動的神。"],["p","是走出來的神。"],["p","這與第一章的靜默不語，"],["p","形成一個很強的對比。"],["p","在異象裡，靜默的神，是出來行動的神。"],["p","祂出來，是為了什麼？"],["p","拯救。"],["p","這個字，在一節裡，出現兩次。"],["p","全部的威嚴與光輝，"],["p","都指向一個方向：拯救。"],["p","而且，經文告訴我們，祂特別看見的是誰。"],["p","他們所喜愛的，是暗中吞吃貧民。"],["p","這是整個審判的原因。"],["p","也是整卷書的起點。"],["p","先知一開始哭的，就是這些被吞吃的人。"],["p","神的行動，不是為了抽象的正義。"],["p","是為了具體的、被吞吃的、沒有人看見的人。"],["p","你的名字，也許沒有被寫在報紙上。"],["p","也許沒有人知道，你受的苦。"],["p","但是，神知道。"],["p","祂為你出來。"],["p","這一段，要慢慢讀。"],["p","曾經被暴力傷害的人，讀到這裡，"],["p","可能會不安。"],["p","我們不催促任何人，為此歡喜。"],["p","也不要求，受傷的人，同意任何一個畫面。"],["p","先讓他知道，這裡的神，"],["p","站在受傷者的那一邊。"],["h","三、雖然……然而"],["p","接著，我們來到，這卷書，最誠實的一節。"],["q","我聽見耶和華的聲音，身體戰兢，嘴唇發顫，骨中朽爛；我在所立之處戰兢。我只可安靜等候災難之日臨到，犯境之民上來。（哈3:16）"],["p","先知看完了壯麗的異象。"],["p","他沒有歡呼。"],["p","他的身體，在發抖。"],["p","肚腹，在發抖。"],["p","嘴唇，在發顫。"],["p","骨頭，像在朽爛。"],["p","這是一個全人的反應。"],["p","我們常常，急著讀第十八節。"],["p","卻跳過了第十六節。"],["p","我們喜歡「然而，我要歡欣」。"],["p","卻不喜歡「骨中朽爛」。"],["p","但是先知，沒有跳過。"],["p","這個發抖，不是信心的缺乏。"],["p","是在神面前，一個有限的人，"],["p","最真實的反應。"],["p","他沒有說：我不怕。"],["p","他說：我戰兢。"],["p","一個肯在神面前，誠實地發抖的人，"],["p","才有可能，真實地歡欣。"],["p","還記得第二章第四節嗎？"],["p","惟義人因信得生。"],["p","這一句，到了第三章，有了一個，活的樣子。"],["p","義人因信得生，不是一句口號。"],["p","它是一個人，"],["p","在無花果樹不發旺的時候，仍然說："],["p","然而。"],["p","信，不是感覺很好。"],["p","信，是在什麼都沒有的時候，"],["p","仍然把重量，放在神身上。"],["p","接著，他說：我只可安靜等候。"],["p","這個安靜，與第二章第二十節，前後呼應。"],["p","他在發抖中，選擇了安靜地等。"],["p","不是因為不怕。"],["p","是因為，他知道，神在殿中。"],["p","如果你今天，身體在發抖。"],["p","睡不著。"],["p","胃很緊。"],["p","這些，不是你信心不夠的證明。"],["p","先知也有。"],["p","聖經，把它寫下來了。"],["p","你可以先承認它，不必假裝。"],["p","然後，是整卷書的高峰。"],["q","雖然無花果樹不發旺，葡萄樹不結果，橄欖樹也不效力，田地不出糧食，圈中絕了羊，棚內也沒有牛；（哈3:17）"],["p","這是一個，一樣一樣，被拿走的清單。"],["p","果樹。"],["p","田地。"],["p","牲畜。"],["p","是一個農家，全部的生計。"],["p","他不是在說一個小小的缺乏。"],["p","他是在說，一個什麼都沒有的日子。"],["p","請你留意，這個「雖然」，沒有說："],["p","事情會好起來。"],["p","他沒有說，這些會恢復。"],["p","也沒有承諾，他會得到補償。"],["p","他說的是：就算全部都沒有。"],["p","然後，是一個詞。"],["q","然而，我要因耶和華歡欣，因救我的神喜樂。（哈3:18）"],["p","然而。"],["p","這個「然而」，不是否認前面的缺乏。"],["p","也不是把缺乏變小。"],["p","它站在缺乏的旁邊。"],["p","說：我要因耶和華歡欣。"],["p","你還記得第一章嗎？"],["p","迦勒底人，對著網，歡喜快樂。"],["p","這裡的歡喜，用的是同一個字。"],["p","同一個字，歡喜的對象，換了。"],["p","迦勒底人的歡喜，建立在他的網，滿了。"],["p","先知的歡喜，建立在，他的網空了，"],["p","田也空了，他仍然有耶和華。"],["p","這就是無己。"],["p","我的歡喜，不靠我所擁有的。"],["p","最後一節。"],["q","主耶和華是我的力量；他使我的腳快如母鹿的蹄，又使我穩行在高處。（哈3:19）"],["p","母鹿，在險峻的山岩間。"],["p","腳，不打滑。"],["p","一步，一步，踏在高處。"],["p","這句話，不是成功神學。"],["p","它不是說：我會升遷。"],["p","我會得勝。"],["p","我會變得富有。"],["p","它說的是，在險峻的地方，我的腳，不會滑。"],["p","因為，祂是我的力量。"],["p","弟兄姊妹，我們要很小心。"],["p","不要把第十八節，變成一種壓力。"],["p","不要對一個正在受苦的人說：你要歡欣！"],["p","先知，"],["p","是在經過了第十六節的戰兢之後，"],["p","才說出這句話的。"],["p","也請你記得，這個選擇，沒有一個時間表。"],["p","有人，在一個晚上，說出了這句話。"],["p","有人，花了好幾年。"],["p","有人，說了又退回去，又再說。"],["p","這都是被允許的。"],["p","神沒有在計算，你說得有多快。"],["p","祂只在等，你的腳步，朝向祂。"],["p","這個歡欣，是一個人，在神面前，"],["p","走過真實的恐懼之後，所做的選擇。"],["p","不是一個，被命令出來的情緒。"],["p","所以，如果你還在戰兢裡，不要急。"],["p","先有戰兢，才有然而。"],["p","沒有被聽見的戰兢，"],["p","會讓後面的歡欣，變得很輕。"],["p","所以，今天這一課，我們不急著，"],["p","叫任何人歡欣。"],["p","我們先讓每一個人，"],["p","有說「我在發抖」的位置。"],["p","也讓每一個人，"],["p","有說「我還沒有辦法」的位置。"],["p","在小組裡，在家裡，"],["p","我們需要更多這樣的時刻。"],["p","有人可以說：我在發抖。"],["p","而其他人，不急著解決。"],["p","有人可以說：我睡不著。"],["p","而其他人，只是坐下來。"],["p","陪伴，往往比答案，更接近經文。"],["p","最後，我們把這一章，放回三二一。"],["p","耶穌是我的榜樣。"],["p","祂在客西馬尼園，戰兢，流汗如血。"],["p","祂也在十字架上，把自己交給父。"],["p","祂是真正在「雖然」之中，"],["p","說出「然而」的那一位。"],["p","聖經是我的準則。"],["p","它讓我們看見，信心的路，是問，聽，禱，"],["p","戰兢，歡欣，一步一步走出來的。"],["p","聖靈是我的引導。"],["p","當我們說不出「然而」的時候，"],["p","祂用說不出來的歎息，替我們禱告。"],["p","讓耶穌作王，就是讓我的歡喜，"],["p","不再建立在無花果樹的收成上。"],["p","讓耶穌得到一切的榮耀，"],["p","因為最後站著的，不是我的信心，"],["p","是那位拯救我的神。"],["p","無己，才能在一無所有的時候，仍然有神。"],["p","無己，才能穩行在高處，不靠自己的腳力。"],["p","焦點在耶穌，不在果樹，不在田地，"],["p","不在我所失去的。"],["p","求主使我們，在每一個「雖然」的日子，"],["p","都學會，說出一句真實的「然而」。"],["p","讓耶穌作王掌權。"],["p","讓耶穌得到一切的榮耀。"],["p","奉主耶穌基督的名禱告，阿們。"]]}},"issues":[{"id":"ISS00_1","t":"書的年代與背景：沒有王名與日期的先知書","r":"1:1--1","ch":[1],"why":"哈巴谷書沒有告訴我們王名、年代或作者的出身，只有「先知哈巴谷所得的默示」。這使得寫作年代、背景與全書的結構都成為討論的題目，也使這卷書特別貼近每一代受苦的人。","pos":[["寫於迦勒底人崛起、耶路撒冷淪陷之前","","多數學者認為，神說要興起迦勒底人（1:6），是尚未發生的預告，因此書寫在新巴比倫帝國崛起之時，約在公元前七世紀末。"],["年代不能確定，只能依內容推測","","經文沒有給日期，一切推論都是從內容反推；本講義尊重經文的沉默，不替它補上資料，也不用年代去算任何日子。"]],"con":[],"say":"本講義的立場：承認背景大致與迦勒底人的興起有關，但不下精確的年代結論，也不用年代討論去取代經文的重點。哈巴谷書沒有日期，使它成為每一個世代受苦者都可以站進去的位置；這是牧養上很重要的特點。","care":"不要讓年代的討論，成為逃避經文質問的方式。對初次讀這卷書的會眾，可以簡單說：它的年代大約在新巴比倫崛起前後；更重要的是，先知的問題，就是我們可以開口的問題。"},{"id":"ISS00_2","t":"質問神與敬畏：哈巴谷書的禱告姿態","r":"1:2--4；1:12--17；3:1--2","ch":[1,3],"why":"哈巴谷書一開頭就質問神，結尾卻是敬畏與歡欣。質問與敬畏是否矛盾？有人覺得質問是不信，也有人覺得敬畏就不該質問。這個問題牽涉到整卷書的結構：從第一章的問，到第三章的歌，這條路徑如何被讀成一個整體。","pos":[["質問是信靠的方式","","先知是對著神說，稱祂為「我的神」，並且神沒有責備他；質問成為與神之間關係的一部分，詩篇也有大量的哀歌。"],["敬畏是質問之後的歸宿","","3:2 先知說「我聽見你的名聲就懼怕」，3:16 身體戰兢；敬畏不是壓抑質問，而是在神回答之後，人在祂面前的安靜。"]],"con":[],"say":"本講義取兩者並存：質問與敬畏不是對立的，而是同一條路上的兩個階段：問、聽、禱、戰兢、歡欣。哈巴谷書給我們的，是一個完整的信心旅程，而不是一個只有答案的結論。這樣處理，使會眾不必在「該問」或「不該問」之間二選一，而可以跟著先知，走完整條路。","care":"帶領者要特別注意：不要用「敬畏」去堵住人的質問，也不要用「質問」去貶低敬畏。讓會眾知道，這兩者都可以出現在同一個人身上，而且神都收容。"},{"id":"ISS00_3","t":"迦勒底人與歷史上的強權：不對應今日任何國家","r":"1:5--11；2:5--8","ch":[1,2],"why":"迦勒底人的畫像、五禍的描寫，容易使人把它們對應到今日某個強權或某個國家，或拿來證明某種政治立場。這個問題牽涉到如何讀預言與歷史：把經文套到今日，常使經文成為政治工具，並傷害人。","pos":[["讀作當時的歷史對象","","迦勒底人是新巴比倫帝國；五禍是對當時以強暴、債務、不義建立勢力的審判；經文對象是當時的猶大與列國。"],["讀作任何自以為神的強權的原型","","「以自己的勢力為神」（1:11）可以是任何時代任何強權的試探；這樣的應用只能用來照自己，不能用來給別人貼標籤。"]],"con":[],"say":"本講義的紅線：不把迦勒底人、列國、網、強權對應到今日任何國家、民族、政權或行業，也不用這些經文為任何戰爭或政治立場背書。若要應用，先照自己：我的網是什麼？我是否向它獻祭？這樣處理，也使經文先改變我們，再談別人，並保護了會眾裡可能因身分而受傷的人。","care":"若會眾中有人來自受戰爭影響的地方，要特別尊重，不讓他聽到自己的家鄉被指為「迦勒底人」。可以先說清楚：這段經文講的是神的主權，不是替任何現代政治背書。"},{"id":"ISS00_4","t":"「因信」的意思與新約引用：羅 1:17、加 3:11、來 10:38","r":"2:4--4","ch":[2],"why":"「義人因信得生」是新約三次引用的舊約經文。它在哈巴谷書的處境、在保羅的稱義神學、在希伯來書的忍耐勸勉裡，各有不同的重點。這個問題牽涉到舊約與新約的關係，也牽涉到「信」到底是什麼，影響每一個人如何理解自己的信心。","pos":[["先聽哈巴谷書的處境","","在一個等候中被圍困的義人，神說：你要活，活的方式是靠著我；emunah 是可靠、站得穩的倚靠。"],["再聽新約的引用","","保羅用它講人因信靠神而稱義；希伯來書用它勸人在患難中忍耐；兩者都沒有離開「倚靠神」的核心。"]],"con":[],"say":"本講義的次序是：先聽哈巴谷書的處境，再看新約的連結。「信」不是分數，也不是信心大小的比賽；生命是神給的，信是靠著祂、不離開。我們不把「因信得生」講成「信心夠大，才有生命」。這樣處理，也使哈巴谷書不被縮成一個教義公式，而仍然是一個等候中的人的故事。","care":"對軟弱的人，要特別小心。不要用這節經文去量人的信心。可以說：神扶住你，比你抓住神更確實；你不需要先把信心練到某個程度，才算活著。"},{"id":"ISS00_5","t":"神的顯現與暴力：3:3–15 與戰爭、報復","r":"3:3--15","ch":[3],"why":"第 3 章的神顯現，有瘟疫、熱症、箭、槍、打糧、打破頭等意象，使人不安，也可能被人拿去為暴力辯護，或被套到現代的衝突。這個問題牽涉到如何讀舊約中的審判意象，並且關乎受暴力傷害的人在教會中是否安全。","pos":[["神學上：神的主權與審判","","這段詩歌描寫神對惡的審判與對百姓的拯救；行動的主語是神，不是人，也沒有授權人類去執行。"],["牧養上：不為暴力辯護，先站在傷者一邊","","經文沒有給任何人拿起武器的授權；對受過暴力傷害的人，先陪伴，不催促他同意任何一個畫面。"]],"con":[],"say":"本講義的紅線：不為任何戰爭、暴力或報復辯護，不把「打破惡人家長的頭」說成信徒的行動。先知自己的回應是戰兢，不是動手。讀這一段，先承認它的重量，再慢慢讀。這樣處理，也使我們對神的主權保持敬畏，又對受傷者保持溫柔，兩者不互相取消。","care":"若會眾中有人曾遭受暴力或戰爭傷害，讀這一段要特別小心。不追問細節，不要求原諒，不催促歡喜；會後單獨關心，必要時協助他尋求專業協助。"},{"id":"ISS00_6","t":"外在全無仍歡欣：信仰的力量與受苦者的真實","r":"3:16--19","ch":[3],"why":"3:17–19 是全卷最有名的信心宣告，也是最常被用來安慰人的經文。但它也可能被誤用：對受苦者說「你要歡欣」，或把一無所有仍快樂當作信徒的標準。這個問題牽涉到信仰與情緒的關係：信仰是否要求人在失去一切時仍要快樂，以及受苦者的真實如何被尊重。","pos":[["這是先知自己在走過戰兢之後的選擇","","先知先說 3:16 的戰兢，再說 3:18 的歡欣；歡欣是選擇，不是情緒的命令，也不是對所有人的要求。"],["這是教會可以一起學習的方向","","在彼此的「雖然」裡，一起說出「然而」；陪伴的人可以邀請，不能代替別人說，也不能催促速度。"]],"con":[],"say":"本講義的紅線：不拿 3:18 去壓迫正在受苦的人；3:16 的戰兢必須先講，不能跳過；3:19 的「穩行在高處」不是成功神學。我們誠實地說出「雖然」，再慢慢走向「然而」；每個人有自己的步調。這樣處理，也使「然而」成為一個可以慢慢走近的方向，而不是一個必須立刻達到的標準。","care":"對正在受苦的人，先承認他的難過是被允許的。不要說「你要歡欣」，可以說：我陪你。若他有自傷的念頭或長期無望感，要協助他尋求專業協助與可信的陪伴。"},{"id":"ISS01_1","t":"書的年代與背景：只有「先知哈巴谷所得的默示」，沒有王名與日期","r":"1:1--1","ch":[1],"why":"其他先知書多半在開頭說明王名與年代，哈巴谷書沒有，只說「先知哈巴谷所得的默示」。讀者很想知道這卷書寫在什麼時代，以及它回應的是哪一段歷史。","pos":[["傾向猶大王約雅敬年間","","有學者從神要興起迦勒底人（1:6）的語氣，推論這是在新巴比倫帝國崛起、但尚未攻陷耶路撒冷之前；理由是先知對迦勒底人的來臨，用的是預告的語氣。"],["年代不能確定","","也有學者指出經文沒有給任何王名或日期，一切推論都是從內容反推；本講義尊重經文的沉默，不替它補上資料。"]],"con":[],"say":"這一卷的書名簡短到只有一個名字與一個身分。我們大致知道，它與迦勒底人（新巴比倫）的興起有關；至於確切年份，經文沒有給，我們也不推算。這份沉默本身有牧養的意義：沒有時間、沒有地點，使這個質問成為每一代受苦之人都可以站進去的位置。","care":"不要因為年代不明，就覺得這卷書離自己很遠；也不要拿年代去算任何日子。對正在受苦的人，可以直接說：先知的問題，就是你可以開口的問題。"},{"id":"ISS01_2","t":"1:2–4 的質問是禱告，還是不信？","r":"1:2--4","ch":[1],"why":"先知一開口就說「你不應允，要到幾時」「你為何看著奸惡而不理」，這些話聽起來很像對神的指控。有人擔心讀這段會鼓勵人埋怨神，也有人覺得受苦的人不該這樣說。","pos":[["這是合乎聖經傳統的禱告","","詩篇有大量類似的哀歌（詩13:1–2、詩74:10、詩80:4），「到幾時」是受苦者向神說話的方式；先知是對著神說，不是離開神。"],["這是對神的質疑，需要被糾正","","有人認為質問神的公義是缺乏信心；但經文沒有責備先知，神的回答（1:5）反而接著他的問題而來，說明這樣的問沒有被拒絕。"]],"con":[],"say":"本講義的立場是：1:2–4 是禱告，不是不信。判斷的標準有三個：他是對神說話；他稱神為「耶和華」「我的神」；神沒有責備他，反而回答。這給受苦的人第一個安慰：你可以這樣開口。同時我們也提醒：這樣的問是對著神說，不是教人以怨恨對待鄰舍或神。","care":"不要對正在質問神的人說「你不該這樣問」。也不要把這段經文變成鼓勵怨恨的許可。陪他把話說完，然後問他：你願意讓我和你一起把這句話對神說一次嗎？"},{"id":"ISS01_3","t":"1:5 與徒 13:41 的引文：字句差異與古代版本","r":"1:5--5","ch":[1],"why":"徒 13:41 引用這節經文時，把「你們要向列國中觀看」寫成「你們這輕慢的人」。有人因此懷疑聖經彼此矛盾，也有人懷疑是引錯了，或是新約作者隨意改動舊約。這個問題在查經班裡經常被問到。","pos":[["使徒引用的是當時流通的版本","","古老的希臘文譯本與死海古卷的注釋，讀的是「背信的人」（bogedim），與希伯來瑪所拉本的「列國」（bagoyim）只差一個字母；使徒行傳引用的是這個異讀。"],["兩者在意思上是相通的","","無論讀「列國」或「輕慢的人」，神的作為都是出人意外的，聽的人都不容易相信；重點在 1:5 後半「我行一件事，你們總是不信」。"]],"con":[],"say":"和合本跟從希伯來文瑪所拉本，譯為「列國」；徒 13:41 引用時採用當時的譯本，兩者的差異是文本傳承的現象。這個差異不影響這節經文的核心：神正在行一件人難以相信的事。我們在講道時，先解釋這是版本差異，再回到經文的重點。","care":"帶領者不必為這個差異過度緊張，也不必把它變成爭論的焦點。可以簡單說：古代抄本有不同的讀法，新約作者引用了其中一種；信心不建立在每一個字母上，而建立在神的話的整體見證上。"},{"id":"ISS01_4","t":"迦勒底人與今日：不對應任何國家、民族或政權","r":"1:6--11","ch":[1],"why":"迦勒底人的畫像生動而可怕，容易使人把他們對應到今日某個強權，或用來指某個國家、民族。這樣的套用在歷史上常造成傷害，也使經文變成政治工具，離開了先知原本要說的話。","pos":[["只讀作當時的新巴比倫帝國","","迦勒底人是公元前七世紀末興起的新巴比倫帝國，是神在那個歷史時刻所用的工具；經文的對象是當時的猶大，不是今日任何國家。"],["讀為「強權自以為神」的原型","","也有人把迦勒底人看作一個原型，描寫任何自以為神的強權；這個讀法只能用來照自己、提醒自己，不能用來給別人貼標籤。"]],"con":[],"say":"本講義採取最穩的立場：迦勒底人是當時的歷史對象；若要應用，只應用在「以自己的勢力為神」這個原則上，而且先照自己。我們不把任何現代國家、族群、政黨或領袖，對應到迦勒底人，也不拿這段經文去支持或反對任何戰爭。","care":"若會眾中有人來自受戰爭影響的地方，讀這一段時要特別小心。不要讓他聽到自己的家鄉被當成「迦勒底人」。可以先說清楚：這段經文講的是神的主權，不是替任何現代政治背書。"},{"id":"ISS01_5","t":"1:12「我們必不致死」的文本問題","r":"1:12--12","ch":[1],"why":"和合本 1:12 說「我們必不致死」，但古老的文士傳統記載，這裡原本可能是「祢不死」，後來為避免對神說出「死」字而改動。這是一個小地方的文本問題，卻牽涉到整句話的意思，值得說清楚。","pos":[["讀作「祢不死」（文士修訂）","","有古老的傳統（提古尼·蘇斐林，即文士修訂）記載，原文為「祢不死」，意思是神的永恆；理由是上下文先說「祢不是從亙古而有嗎」。"],["讀作「我們不死」（現行希伯來文）","","現行的希伯來文本是「我們不死」，和合本跟從；這句話表達一種由神的永恆而來的盼望：因祢是亙古的，所以我們不會被徹底毀滅。"]],"con":[],"say":"兩種讀法都有學者支持。和合本與現行希伯來文一致，譯為「我們必不致死」。本講義的處理是：先說明有異讀，再抓住兩種讀法共同的核心：神的永恆，是受苦者不被絕望吞沒的繩子。我們不把這句話當作「信徒不會遇到死亡」的承諾。","care":"對正在面對死亡或失去的人，不要說「你不會死」。可以說：神是亙古的，祂不離開你；這是我們可以抓住的繩子，不是一個保證不受傷的承諾。"},{"id":"ISS01_6","t":"1:13「看著不理」與神的公義、聖潔","r":"1:13--13","ch":[1],"why":"先知說神眼目清潔，不看邪僻，卻又問祂為何看著奸惡不理。這在神學上似乎有張力：神是聖潔的，為何容許惡？這是歷世歷代的信徒，在苦難中最難安放的一個問題。","pos":[["這是信徒在信靠中的質問，不是系統神學的答案","","先知並沒有宣告一個教義，他是在說出自己的困惑；神的回答要等到第 2 章。"],["這提醒我們神的聖潔不等於神的缺席","","聖潔的神不是看不見惡，而是不與惡同流；先知的問，是要求神按祂的聖潔行動。"]],"con":[],"say":"本講義不在 1:13 替神下結論，只先承認這個張力是真實的，並且是被聖經收容的。第 2 章神會親自回答：義人因信得生；第 3 章先知也看見神出來拯救。我們帶著這個張力，繼續讀，不急著解開。這也是這一章的牧養姿態：不急著給答案，先讓問題在神面前被聽見。","care":"不要用「神的道路高過你的道路」這樣的話，去堵住受苦者的口。先讓他說完，再陪他一起讀下一章，並且承認：這個問題，我們也沒有現成的答案。"},{"id":"ISS01_7","t":"1:14–17 如海中的魚、向網獻祭","r":"1:14--17","ch":[1],"why":"先知用魚、鉤、網、拉網描寫被捕獲的人，又說捕獲者向網獻祭燒香。畫面很強烈，也容易被講成對被捕者的責備，或被講成只對外人的指控，兩種講法都偏離了先知的重點。","pos":[["描寫被壓迫者的處境","","魚是沒有防備的，神的眼睛先看見他們；責任在拿網的人，不在被捕的人，這是這段經文先要確定的事。"],["描寫以工具為神的偶像崇拜","","向網獻祭，是把自己的方法與成功當作神（呼應 1:11）；這個原則也可以用來照自己：我有沒有一張網？我是否向它獻祭？"]],"con":[],"say":"本講義兩個面向都取：對被捕的人，先站在他們旁邊；對握有網的人，先照自己。我們不把「魚」說成是被害者的責任，也不把「網」只指外人。這段經文要回到神的位置：誰才是神？先知把問題留在這裡，要等到第 2 章與第 3 章，才一步一步被回答。","care":"對受害者，不要說「你就是那條魚」，也不要說「你當初應該小心」。對自己，要誠實地問：我的網是什麼？不要把這個問題變成指責別人的工具。"},{"id":"ISS01_8","t":"受害者的質問與「神為何不管」","r":"1:2--4；1:12--17","ch":[1],"why":"許多受害者與受苦者，在讀 1:2–4、1:12–17 時，會用自己的處境說出同樣的問題：神為何不管。教會要如何陪伴這樣的人，是講道前就要預備的事。這個議題比任何字義的討論，都更接近牧養的核心。","pos":[["先陪伴，再談神學","","受害者需要的第一件事，是被聽見，不是被解釋；先站在他旁邊，聽他說完，再決定下一步要怎麼陪他走。"],["在陪伴中引導向神說話","","先知把問題帶到神面前，教會可以邀請受苦者也這樣做，並承認神沒有責備這個問，讓他知道這樣的禱告是被允許的。"]],"con":[],"say":"本章的牧養原則是：先站在受害者旁邊，不替神辯護，不催促原諒，不要求感恩。先知的問被寫進聖經，就是神給受苦者的第一個安慰。若需要專業協助（輔導、醫療、法律），也要協助他尋求。教會是同伴，不是唯一的出路。","care":"若有人說出被傷害的經歷，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助尋求專業協助與保護。"},{"id":"ISS02_1","t":"2:3「雖然遲延」：遲延是人的感受，必然臨到是神的話（不算日子）","r":"2:3--3","ch":[2],"why":"2:3 說「這默示有一定的日期，快要應驗」，又說「雖然遲延，還要等候」。有人想從「一定的日期」推算應驗的時間，也有人用「快要應驗」催促等候的人。這個問題在受苦的人心裡特別沉重，因為「遲延」往往不只是時間，也是一種被忽略的感覺。","pos":[["遲延是人的感受，不遲延是神的時間","","經文並列兩層：從人的角度說「遲延」，從神的角度說「不再遲延」；這兩句話同時是真的，沒有互相取消。"],["這節經文是給等候的人一個姿態，不是一個日期","","「還要等候」是一個動詞，經文給的是站立與等候的方向，沒有提供任何可以計算的時間。"]],"con":[],"say":"本講義的立場：不算日子、不給時間表。我們承認等候的人感覺到的「遲延」是真實的，也抓住神的話「不再遲延」。這節經文給受苦者的，不是倒數計時，而是一個可以靠著站立的話。我們不對正在等的人說「再等一下就好」。","care":"陪伴等候的人，不要說「快了」，也不要說「你還不夠有信心所以遲延」。可以說：等得辛苦是真的，我們一起站在這裡，繼續等。需要時，單獨為他禱告，不用任何話催促他。"},{"id":"ISS02_2","t":"2:4「義人因信得生」：信、信實，與羅 1:17、加 3:11、來 10:38","r":"2:4--4","ch":[2],"why":"「義人因信得生」是新約引用最多的舊約經文之一。原文 emunah 可譯為「信」，也可譯為「信實、忠信」，這使人對「誰的信」「怎麼活」有不同的強調。不同的強調，影響人如何理解自己的信，也影響軟弱的人是得安慰還是得壓力。","pos":[["強調人對神的信靠","","保羅在羅 1:17、加 3:11 把這句話用在稱義上：人不是靠行為，是靠信靠神而得生；這與哈巴谷處境中「倚靠神」的意思相通。"],["強調忠信、堅忍的生活","","希伯來書 10:38 用這句話鼓勵人在患難中堅忍；emunah 的本意有「可靠、站得穩」，指一種持續的、穩定的倚靠。"]],"con":[],"say":"本講義取兩個面向並存：「信」不是一個分數，也不是一次的感覺，是靠著神的持續倚靠；生命是神給的，不是信心換來的。我們先聽哈巴谷書自己的處境：一個在等候中被圍困的義人，神對他說，你要活，你活的方式是靠著我，不離開。","care":"不要用這節經文去衡量任何人的信心大小。對軟弱的人，可以說：神扶住你，比你抓住神更確實。這節經文是給站不穩的人的邀請，不是給站得穩的人的獎賞。"},{"id":"ISS02_3","t":"2:2「寫在版上」「隨跑隨讀」的兩種譯法","r":"2:2--2","ch":[2],"why":"和合本 2:2 說「使讀的人容易讀」，經文旁註為「隨跑隨讀」。原文直譯是「使讀的人可以奔跑」，這句話有不同的理解方式。這個字義問題看似很小，卻牽涉到神為什麼要把話交給先知，以及這份話後來要如何被使用，值得簡單說明。","pos":[["讀的人跑著也能讀","","字寫得夠大、夠清楚，路過的人就算在跑，也讀得到；重點在清晰、公開，不是隱密的話。"],["讀的人讀了就跑去傳","","讀了之後，馬上跑去告訴別人；重點在話語要被傳開，而不是留在先知一個人的心裡。"]],"con":[],"say":"兩種讀法都有學者支持，並且都落在同一個方向：神要先知把話寫清楚，讓人能讀、能傳。本講義不在這裡下單一結論，只取最穩的牧養意義：先知個人的問題，被神變成一份給眾人的話。這樣處理，也讓一般會眾不被字義的細節卡住，仍能抓住神把話交給眾人的心意。","care":"帶領者不必在這個字義上花太多時間。可以簡單提醒：神把一個人在守望所裡領受的，變成給眾人的話；我們有領受的時候，也要考慮如何把它說出來、寫下來，給下一個等候的人。"},{"id":"ISS02_4","t":"2:5「因酒詭詐」：字面的酒，還是比喻？各家的讀法","r":"2:5--5","ch":[2],"why":"和合本 2:5 說「迦勒底人因酒詭詐」。這句在希伯來文裡讀法有分歧，有人視為字面的酒，有人視為比喻，也有人認為原文詞形需要校正。這一句在原文有詞形與讀法的問題，各家的處理差異很大，容易被講成一個與經文重點無關的道德論斷。","pos":[["字面的酒，指縱慾奢華","","迦勒底人在宴飲與酒中失去自制，貪婪而狂傲；酒是他們放縱欲望的象徵。"],["比喻，指被自己的欲望灌醉","","「酒」也可以是一個比喻，描寫一個人被貪欲與驕傲灌醉，不再能清醒地行事。"]],"con":[],"say":"本講義的處理：先說明有不同的讀法，再回到上下文：2:5 的重點是迦勒底人貪得無厭，擴充心欲如陰間，聚集萬國都歸自己。我們不從這一句去論斷任何喝酒的人，也不以它為禁酒的唯一根據。這樣處理，是為了讓會眾看見經文真正的重點，而不是停在一個讀法的爭論，更不被帶往對別人的論斷。","care":"不要用這句經文去論斷個別的人。若會眾有人正與酒癮掙扎，要先給他安全與尊重，不當眾點名，也不把酒癮說成「屬靈不夠」，必要時協助他尋求專業的協助。"},{"id":"ISS02_5","t":"五個「禍哉」與咒詛的界線","r":"2:6--19","ch":[2],"why":"五個「禍哉」措辭強烈，有人把它們當作咒詛的話，用來指著特定的人或機構，也有人因為這些話太重而避開不談。五個禍措辭激烈，若沒有先理解它的文類，很容易讀偏，變成咒詛的工具或避談的禁區。","pos":[["這是被壓迫者編成的歌","","2:6 說明這些話是受害的國民提起詩歌、俗語、譏刺說的；「禍哉」是喪禮的哀歌，意思是對一個正走向死亡的人唱挽歌。"],["這是先知對一個原則的宣告","","五個禍各對應一種偏差：增添、不義的保障、以血建城、羞辱他人、倚靠偶像；這些是原則，不是點名。"]],"con":[],"say":"本講義的立場：五禍先照自己，不拿來咒詛任何人、機構或敵人。「禍哉」是一個哀歌的呼聲，神發出這個呼聲時，是看見而痛惜的。我們讀五禍，每一個禍都問：我有沒有？我如何回到本位？這樣的處理，也使五禍成為一面鏡子，而不是一把槍，讓神的話先改變我們，再談別人。","care":"帶領小組時，不要讓五禍變成「指認誰是壞人」的遊戲。先讓每個人靜默，各選一個禍，對自己說。需要時，先停下來為受害者禱告。"},{"id":"ISS02_6","t":"2:15–16 羞辱與「未受割禮」：不描述細節，另有古抄本讀法","r":"2:15--16","ch":[2],"why":"2:15 描寫一種對鄰舍的羞辱與侵犯，2:16 說「你也喝吧，顯出是未受割禮的」。古抄本與譯本在「顯出是未受割禮的」一句有不同的讀法，部分傳統讀為「你也搖搖晃晃」。","pos":[["讀作「未受割禮的」","","現行希伯來文讀為 he'arel（顯出未受割禮的樣子），用割禮的語言，羞辱那個行惡的人。"],["讀作「搖搖晃晃」","","死海古卷與古老譯本讀為 hera'el（搖晃、踉蹌），描寫喝了神的杯之後站不穩，不涉及割禮。"]],"con":[],"say":"兩種讀法都有學者支持，本講義不在這裡下單一結論。最要緊的是牧養上的處理：不重述羞辱的細節，不開玩笑，先站在被羞辱、被侵犯的人那一邊。經文的「禍」落在行惡的人身上，不在受害者。這樣的處理，也提醒帶領者，這是需要事先預備的段落，不要在毫無準備的情況下，讓人在小組裡朗讀這幾節。","care":"若會眾中有人曾在失去自制時被侵犯，讀這一段時要特別小心。不追問細節，不要求原諒，不催促復原；會後單獨關心，必要時協助他尋求專業協助與保護。"},{"id":"ISS02_7","t":"2:14「認識耶和華榮耀的知識要充滿遍地」","r":"2:14--14","ch":[2],"why":"2:14 與以賽亞書 11:9 幾乎相同，只多了「榮耀」。有人把它講成末世的時間表，也有人把它當作「我們不必做什麼，神自己完成」的理由。這節經文的位置在第三個禍與第四個禍之間，所以它的解讀，直接影響整章的盼望與行動的關係。","pos":[["這是歷史的方向與終局的盼望","","神的榮耀要充滿遍地，是整卷書給先知問題最深的回答之一；它是一個方向，不是一個日期。"],["這也鼓勵我們今天的忠心","","每一次誠實的行動、饒恕、不佔便宜的選擇，都是在這片海裡多加一滴水；盼望使人行動，不使人消極。"]],"con":[],"say":"本講義的處理：不把 2:14 變成時間表，也不把它變成消極等待的藉口。這節經文放在第三個禍之後，說明盼望不是等到審判結束才出現，而是與審判並行。我們帶著這個方向，今天就用誠實與饒恕，參與神榮耀的知識的擴散。","care":"不要用 2:14 去壓迫正在受苦的人「要有盼望」。對受苦者，可以說：這是神的方向，不是對你今天的要求；你今天只需要站在守望所，一步一步走下去。"},{"id":"ISS02_8","t":"2:18–19 偶像與今日：不嘲諷他人的信仰","r":"2:18--19","ch":[2],"why":"2:18–19 對偶像的批判很尖銳。有人用它嘲諷其他宗教的信徒，也有人認為今天沒有人拜木頭石頭，這段經文與今日無關。先知對偶像的批判，在今日的處境容易被誤用，一邊是攻擊別人，一邊是以為與自己無關，兩者都需要被提醒。","pos":[["先照自己：什麼是我的木偶","","偶像不只是廟裡的東西，是任何取代神位置的東西；專業、存款、計畫、名聲，都可能成為我指望它「醒來」的對象。"],["經文針對的是倚靠無氣息之物","","先知的諷刺是針對人造之物不能救人，目的是把人帶回那位活著的神，不是羞辱拜偶像的人。"]],"con":[],"say":"本講義取第一種為主：先照自己。我們不用這段經文去嘲諷任何人的信仰或文化，也不把它變成對別人的攻擊。先知的諷刺，是為了讓人從夢裡醒過來。這樣的處理，使先知的諷刺回到它原來的目的：使人從倚靠無氣息之物，回到那位有氣息的活神。","care":"若會眾中有人來自其他信仰背景，要特別尊重，不當眾嘲笑。可以邀請每個人安靜地問：我最指望它「醒來」幫助我的，是什麼？帶領者要先預備好自己的回答，不讓這個題目變成辯論會。"},{"id":"ISS02_9","t":"2:20 的「聖殿」是天上還是地上","r":"2:20--20","ch":[2],"why":"2:20 說「惟耶和華在他的聖殿中」，原文 heikhal qodsho 可指耶路撒冷的聖殿，也可指神在天上的居所。有人還據此推論聖殿的相關教義。聖殿在舊約有多重意義，這節經文裡的用法，容易被帶進與先知重點無關的教義討論。","pos":[["指耶路撒冷的聖殿","","在當時猶大的處境裡，聖殿是神臨在的地方；先知用這個畫面說：神在祂的殿中，祂是活著的。"],["指神在天上的居所","","詩篇 11:4 也說「耶和華在他的聖殿中，耶和華的寶座在天上」；聖殿的概念可以指向天上的神的居所。"]],"con":[],"say":"兩種讀法並不互相排斥。本講義不在這裡建立聖殿教義，只取最穩的牧養意義：偶像是啞巴的，耶和華是活著的；全地的人，包括先知自己的問題與喧鬧，都在祂面前安靜。這樣處理，也使會眾把注意力留在經文的重點：耶和華是活著的，全地都要在祂面前安靜，而不是聖殿的地理位置。","care":"不要用「肅敬靜默」去打斷受傷者的哭泣或封住他們的口。這裡的靜默是神回答之後的敬拜，不是問題之前的封口；有人需要哭、需要說，我們先陪他。"},{"id":"ISS03_1","t":"3:1「流離歌」與 3:19「伶長、絲弦的樂器」：音樂用語難以確定","r":"3:1--1；3:19--19","ch":[3],"why":"第 3 章的開頭與結尾都有音樂的術語：「流離歌」「伶長」「絲弦的樂器」。這些詞在詩篇標題裡也常見，但確切的意思，古今學者都不能完全確定。這些術語的不確定，使有些人覺得這段經文難讀，也使有些人想從術語推導出敬拜的規範。","pos":[["視為音樂與詩體的專門術語","","「流離歌」（shigyonot）可能是一種詩體或曲調，詩篇 7 篇標題有相近的詞；「伶長」指樂團的領唱或指揮；細節已難考。"],["視為這首禱告被用於敬拜的證據","","無論術語確切指什麼，這首禱告最後被交給伶長、用絲弦的樂器歌唱，說明它是被群體敬拜使用的詩歌，不是先知私人的筆記。"]],"con":[],"say":"本講義取最穩的立場：承認術語的意思不能確定，不在這裡建立任何音樂或敬拜儀式的規定；只取一個牧養意義：一個人在黑暗中說的禱告，後來成為眾人一起唱的歌。這是神給受苦者的一種尊重。","care":"帶領者不必在這些術語上花太多時間。可以簡單說：古人怎麼唱，我們不能確定；可以確定的是，這首禱告是要被唱出來、被一群人一起使用的。"},{"id":"ISS03_2","t":"3:2「在這些年間復興你的作為」：求什麼、不求什麼","r":"3:2--2","ch":[3],"why":"3:2 的「復興你的作為」，容易被理解成求神使教會興旺或使社會改變，也有人把「在這些年間」解讀為某個預定的年份。這句禱告很短，卻最容易被各種口號借用，需要先弄清楚先知到底在求什麼。","pos":[["求神的作為在他們的時代活過來","","「作為」與 1:5 神說的「我行一件事」同一個字根；先知求神把自己所說的那件事，在他們的時代「使它活」。"],["求審判之中仍有憐憫","","「在發怒的時候以憐憫為念」說明先知不求取消審判，而求審判之中仍有憐憫；這是一種成熟的禱告。"]],"con":[],"say":"本講義的處理：不把「在這些年間」解讀為特定年份，也不把「復興」講成教會增長的口號。我們取先知禱告的姿態：先聽見神的名聲，就懼怕；再求神的作為在我們的時代活過來；並求審判中仍有憐憫。這個禱告沒有時間表。","care":"不要用這節經文去承諾某個「復興的日期」。也不要把它變成一個要求教會成長的口號。可以邀請會眾一起說：主啊，求祢在這些年間，使祢的作為在我們中間活過來。"},{"id":"ISS03_3","t":"3:3 提幔、巴蘭山與出埃及並讀","r":"3:3--3","ch":[3],"why":"3:3「神從提幔而來，聖者從巴蘭山臨到」，這兩個地名在西奈的南北，與申命記 33:2、士師記 5:4 的描寫相近。有人想從這裡推論神的顯現的確切地點。這個地名問題，容易讓人把重點放在地理，而忽略先知用舊記憶支撐自己的方式。","pos":[["先知以舊記憶描寫神的來臨","","提幔與巴蘭是以色列出埃及時代的記憶，先知用這些地名，說明神現在要像從前那樣來臨。"],["地名有不同的考證與讀法","","提幔意為「南方」，可能指以東南部地區；巴蘭山在西奈北方曠野；學者對確切位置有不同看法，並不影響整體意思。"]],"con":[],"say":"本講義不在地名考證上下結論，只取一個牧養意義：先知用神過去的作為，幫助自己在黑暗中站得住。記憶是一種抵抗：把神過去的作為一件一件寫在記憶裡，在現在的處境裡，成為提醒。這樣處理，也讓會眾看見記憶如何成為抵抗黑暗的力量，而不被地名的考證卡住。","care":"可以邀請會眾分享：神過去怎樣在你的生命裡作過一件事？讓這個記憶，成為今日的力量。不要把重點放在地理的考證上。不必讓任何人為說不出神的作為而感到羞愧。"},{"id":"ISS03_4","t":"3:3–15 神的顯現與暴力意象：不為任何戰爭、暴力或報復辯護","r":"3:3--15","ch":[3],"why":"這段經文有瘟疫、熱症、山崩、箭與槍、通行大地、打糧、打破頭等戰爭與審判的意象。有人讀了不安，也有人拿它為戰爭或暴力辯護，把它套到現代的衝突上。","pos":[["詩歌式的異象，描寫神的主權","","這是一段詩歌，用自然與戰爭的圖像描寫神的威嚴；行動的主語是神，不是人。"],["取材於出埃及與曠野的記憶","","江海、山嶺、日月、紅海，都是出埃及與征服的記憶；先知用這些記憶描寫神對惡的審判與對自己百姓的拯救。"]],"con":[],"say":"本講義的立場：這段詩歌描寫的是神，不是授權人類。我們不為任何戰爭、暴力或報復辯護，也不把畫面套到任何現代國家、民族或事件。先知自己的回應是 3:16 的戰兢，不是舉起武器。讀這一段，要慢慢讀，先承認它的重量。","care":"曾經受過暴力、戰爭傷害的人，讀到這一段可能被觸動。不要催促他同意任何畫面，也不要說「這是神的作為所以要歡喜」。先陪他，讓他知道，這裡的神站在受傷者的一邊。"},{"id":"ISS03_5","t":"3:13「受膏者」是誰：君王、百姓，還是彌賽亞","r":"3:13--13","ch":[3],"why":"3:13「拯救你的受膏者」，原文 meshiakhekha（祢的受膏者）。這個詞在舊約可指君王、祭司、先知，也可指整個民族，因此引起不同的解讀。受膏者的所指，牽涉到舊約王權、以色列民族與新約彌賽亞的關係，一直是解經上的討論點。","pos":[["指大衛家的君王","","在猶大的處境裡，受膏者常指君王；先知求神拯救祂所膏的王，也等於拯救整個國家。"],["指整個以色列百姓，或指向將來的彌賽亞","","詩 105:15 以「我的受膏者」指全民；新約以耶穌為神的受膏者，這是新約自己作的連結，不是哈巴谷書自己給的答案。"]],"con":[],"say":"本講義不替經文決定單一的所指。我們先照文字讀：神出來，是為了拯救祂的百姓，也拯救祂所膏的人。在新約的光中，我們看見耶穌是那位真正的受膏者；但這是新約自己的連結，我們在這裡不加強加。","care":"不要把這節經文講成「這就是預言耶穌」的確定證據。可以說：新約告訴我們，耶穌是神的受膏者；這使我們在讀這節經文時，多一層看見神拯救的心。"},{"id":"ISS03_6","t":"3:16 戰兢與「安靜等候災難之日」","r":"3:16--16","ch":[3],"why":"3:16 描寫先知身體戰兢、嘴唇發顫、骨中朽爛，並說「我只可安靜等候災難之日臨到」。有人把它讀成消極的接受，也有人急著跳過它去讀 3:18。3:16 在整卷書中位置特殊，它介於壯麗異象與信心宣告之間，容易被讀得太快。","pos":[["這是真實的身體反應","","先知聽見神的聲音，身體整個反應：肚腹、嘴唇、骨頭，他沒有假裝堅強；這是被聖經承認的戰兢。"],["「安靜等候」是主動的姿態","","anukhah 的字根是「安息、停下來」，與 2:20「肅敬靜默」相呼應；他在發抖中選擇安靜地等，不是因為不怕，而是因為神在殿中。"]],"con":[],"say":"本講義把 3:16 當作全卷最誠實的一節，並且不跳過。先有戰兢，才有然而。在牧養上，我們先承認戰兢，不說「你要有信心」；先讓人知道，這是被聖經承認的反應。「安靜等候」不是壓抑，是在神面前不再喧嚷。這樣的處理，使 3:16 不被跳過，也使後面的 3:18 有真實的重量，不流於口號。","care":"若小組中有人說出睡不著、發抖、焦慮，不要急著給建議。先坐下，聽，說：聖經裡也有這樣的人。必要時，協助他尋求醫療或專業的協助。"},{"id":"ISS03_7","t":"3:17–19「雖然……然而」與受苦的人：不壓迫人要歡欣","r":"3:17--19","ch":[3],"why":"「雖然無花果樹不發旺……然而，我要因耶和華歡欣」是全卷的高峰，也是最常被引用來安慰人的經文。但它也可能被誤用，變成對受苦者的命令。這是全卷最常被引用的經文，也是最容易在受苦者面前被用錯的經文，需要特別小心。","pos":[["這是先知自己的信心宣告","","3:18 是先知在走過戰兢之後的選擇，是第一人稱的「我要」，不是對別人的命令，也不是對所有人的要求。"],["這是教會可以一起唱的歌","","這首禱告被交給伶長，是群體一起唱的；教會可以在彼此的「雖然」裡，一起說出「然而」，但不能代替別人說。"]],"con":[],"say":"本講義的立場：不拿 3:18 去壓迫正在受苦的人，也不把「失去一切仍要快樂」當作標準。先知先說「雖然」，承認失去；然後說「然而」，站在缺乏的旁邊。我們可以邀請，但不能命令；可以陪伴，但不能催促。這樣的處理，使這節經文成為一種邀請，而不是一個命令，並讓受苦者有自己的步調。","care":"對正在受苦的人，先說：你的難過是被允許的。等他準備好，再邀請他一起讀 3:18。不要說「你要歡欣」，可以說：我們一起，慢慢走向那個然而。"},{"id":"ISS03_8","t":"3:19「穩行在高處」與成功神學","r":"3:19--19","ch":[3],"why":"3:19 說「使我穩行在高處」，容易被講成成功、升遷、得勝的應許，與先知前一節的一無所有形成反差。成功神學把「穩行在高處」講成地位的升遷，與先知在一無所有之中所說的話，完全相反，需要特別說明。","pos":[["高處是險峻的山地","","母鹿在險峻的山岩上，腳不打滑；bamot（高處）在舊約也指山嶺，這裡的畫面是在險峻之地仍能穩行。"],["高處是神給的站立之處","","先知的力量不是自己的腳力，是「主耶和華是我的力量」；穩行是神所賜，不是成功的標記。"]],"con":[],"say":"本講義的處理：3:19 不是成功神學，不承諾地位、財富或升遷。它說的是：在險峻的地方，我的腳，因為神是我的力量而不會滑。這個應許給的是站得住，不是爬得高。這樣的處理，使 3:19 回到它原來的位置：在一無所有之後，神給的是站穩的力量，不是更高的職位。","care":"不要用這節經文承諾「你會升遷」「你會得勝」。可以說：祂是你的力量；在你最險峻的地方，你的腳，不是靠你自己站著。也提醒帶領者自己，不要把這節經文當成鼓勵人追求成功的口號。"}],"terrain":{"points":[[1.059,40,0,"到幾時","mid"],[1.176,22,0,"公理顯然顛倒","bot"],[1.294,12,0,"興起迦勒底人","bot"],[1.706,18,0,"你為何看著不理呢","bot"],[2.0,50,0,"站在守望所","mid"],[2.1,60,0,"雖然遲延，還要等候","mid"],[2.15,76,0,"惟義人因信得生","top"],[2.65,86,0,"知識要充滿遍地","top"],[2.95,90,0,"肅敬靜默","top"],[3.053,62,0,"復興你的作為","mid"],[3.632,92,0,"拯救你的百姓","top"],[3.789,14,0,"身體戰兢","bot"],[3.842,3,0,"雖然無花果樹不發旺","bot"],[3.895,100,0,"我要因耶和華歡欣","top"]]},"tracks":[{"gk":"רָאָה／נָבַט／צָפָה","tr":"ra'ah／nabat／tsafah","gl":"看、觀看、守望","code":"H7200／H5027／H6822","root":"√ראה（看）、√נבט（定睛看）、√צפה（守望）","stops":[["1:3","「你為何使我看見罪孽」先知先被迫「看見」：看見罪孽，卻看不見神動手。同一節的「看著奸惡而不理」用的是另一個「看」（נָבַט）。","top"],["1:5","「你們要向列國中觀看」神把先知的眼睛轉向：不是向自己的處境，是向列國，看神正在做的事。","top"],["1:13","「你眼目清潔，不看邪僻，不看奸惡」一節三個「看」（מֵרְאוֹת、וְהַבִּיט、תַבִּיט）：先知抓住神眼目清潔，卻問祂為何「看著不理」。","top"],["2:1","「立在望樓上觀看」先知的「看」換了位置：從質問的人，變成守望的人（צָפָה，與「看」並用）。","top"],["2:15","「好看見他下體」「看」被拿來羞辱人：這是看的墮落，與 2:1 的守望相反。（不描述細節。）",""],["3:6","「觀看，趕散萬民」神自己也「站立」、「觀看」；先知在 2:1 站著看，神在 3:6 站著看。","top"],["3:7","「我見古珊的帳棚遭難」先知終於「看見」：看見神行動的後果，先前他說看不見。",""],["3:10","「山嶺見你，無不戰懼」「看見」神的，這次是山嶺。先知 1:3 看見罪孽，3:10 看見的是祂。",""]],"ins":"「看」在全卷有三個字根，合計 13 個詞、8 節（看 ראה 7、定睛看 נבט 5、守望 צפה 1）。次序是：先知被迫**看見罪孽**（1:3）→ 神叫他向列國**觀看**（1:5）→ 他質問神為何**看著不理**（1:13）→ 他站到**守望所**去看（2:1）→ 看的墮落（2:15）→ **神自己站立、觀看**（3:6）→ 先知**看見**（3:7）→ 連山嶺也**見祂**（3:10）。全卷的轉折不是先知看懂了，是他換了站立的位置。"},{"gk":"חָמָס","tr":"khamas","gl":"強暴","code":"H2555","root":"√חמס（強暴、暴虐）","stops":[["1:2","「我因強暴哀求你，你還不拯救」全卷第一個「強暴」：先知的呼求，開口就是這個字。","top"],["1:3","「毀滅和強暴在我面前」先知自己的眼前：強暴就在面前。",""],["1:9","「都為行強暴而來」迦勒底人來的目的就是強暴：先知哀求的那個字，神的答案裡再出現。","top"],["2:8","「向國內的城並城中一切居民施行強暴」神的回覆：你所行的強暴，必回到你身上（「各國剩下的民都必搶奪你」）。原文「國內」是「地」。",""],["2:17","「你向黎巴嫩行強暴與殘害驚嚇野獸的事必遮蓋你」同一節兩次（原文「黎巴嫩的強暴」「地的強暴」）：強暴最後遮蓋行強暴的人。","top"]],"ins":"「強暴」（חָמָס）全卷 6 次、分布於 5 節（2:17 一節兩次）。同一個字走了一個圈：先知哀求神救他脫離**強暴**（1:2–3）→ 迦勒底人**為強暴而來**（1:9）→ 神說：你所行的強暴要**回到你身上**（2:8、17）。**先知哀求的字，成了神審判的字。**"},{"gk":"הוֹי","tr":"hoy","gl":"禍哉","code":"H1945","root":"הוֹי（禍哉、有禍了）","stops":[["2:6","「禍哉！迦勒底人」第一禍：增添不屬自己的財物，多多取人的當頭。","top"],["2:9","「為本家積蓄不義之財」第二禍：為本家積蓄不義之財、在高處搭窩、指望免災。",""],["2:12","「以人血建城、以罪孽立邑的有禍了」第三禍：以人血建城。","top"],["2:15","「給人酒喝、又加上毒物」第四禍：使人喝醉、羞辱人。（不描述細節。）",""],["2:19","「對木偶說：醒起！對啞巴石像說：起來！那人有禍了」第五禍：偶像。最後一禍落在「對木偶說醒起」的人身上。","top"]],"ins":"「禍哉」（הוֹי）全卷 5 次、全部在第 2 章：2:6、9、12、15、19，各佔一組小段。五禍的次序：掠奪（2:6）→ 為本家積不義之財（2:9）→ 以人血建城（2:12）→ 使人羞辱（2:15）→ 偶像（2:19）。五個「禍」把審判落在可被每個人認出的五種罪上；**中間夾著 2:14（知識充滿遍地），收在 2:20（全地靜默）。**"},{"gk":"אֶרֶץ","tr":"erets","gl":"地、大地、國內","code":"H776","root":"√ארץ（地、大地）","stops":[["1:6","「通行遍地」迦勒底人通行遍地，佔據那不屬自己的住處。","top"],["2:8","「向國內的城並城中一切居民」原文「國內」是「地」（חֲמַס־אֶרֶץ）：強暴也在這地上。",""],["2:14","「要充滿遍地」「認識耶和華榮耀的知識要充滿遍地」：地被充滿的，是認識耶和華榮耀的知識。","top"],["2:17","「向國內的城並城中一切居民」同 2:8，原文「國內」是「地」。",""],["2:20","「全地的人都當在他面前肅敬靜默」全地要靜默：不是被強權嚇住，是在耶和華面前。","top"],["3:3","「頌讚充滿大地」神一顯現，頌讚充滿大地（呼應 2:14 的充滿遍地）。","top"],["3:6","「量了大地」神站立，量了大地。（此節另有譯法：使地震動，見和合本小字。）",""],["3:7","「米甸的幔子戰兢」原文「米甸地的幔子」（אֶרֶץ מִדְיָן）：連地方都在戰兢。",""],["3:9","「你以江河分開大地」神以江河分開大地。",""],["3:12","「你發忿恨通行大地」和合本 1:6 與 3:12 同用「通行」，原文用字不同，但畫面對得上：迦勒底人通行遍地，神也通行大地。",""]],"ins":"「地」（אֶרֶץ）全卷 10 次、分布於 10 節。先是**迦勒底人通行遍地**（1:6）和強暴填滿的**地**（2:8、17）；然後神說：**認識耶和華榮耀的知識要充滿遍地**（2:14）、**全地都當肅敬靜默**（2:20）；第 3 章**頌讚充滿大地**（3:3），神**量了大地**（3:6）、**分開大地**（3:9）、**通行大地**（3:12）。**同一塊地，被誰通行、被什麼充滿，是全卷的問題。**（注意：2:8、2:17、3:7 和合本把「地」譯作「國內」「米甸的」，次數以原文為準。）"},{"gk":"יְהוָה","tr":"YHWH","gl":"耶和華","code":"H3068／H3069","root":"יהוה（耶和華；3:19「主耶和華」拼法為 יְהוִה，字根編號 H3069）","stops":[["1:2","「耶和華啊！我呼求你」全卷第一個名字：先知的呼求。","top"],["1:12","「耶和華－我的神，我的聖者啊」一節兩次（原文）：「耶和華我的神」與「耶和華，你派定他」。先知抓住神的永恆與聖潔。","top"],["2:2","「他對我說」神第一次回答守望的先知。和合本此處沒有寫出「耶和華」，原文有（וַיַּעֲנֵנִי יְהוָה）。","top"],["2:13","「不都是出於萬軍之耶和華嗎」眾民勞碌得來的被火焚燒：不都出於萬軍之耶和華。",""],["2:14","「認識耶和華榮耀的知識要充滿遍地」全卷最大的盼望：認識耶和華榮耀。","top"],["2:16","「耶和華右手的杯必傳到你那裡」審判的杯。",""],["2:20","「惟耶和華在他的聖殿中」五禍之後只剩這一句：耶和華在他的聖殿中。","top"],["3:2","「耶和華啊，求你在這些年間復興你的作為」一節兩次（原文）：先知的禱告：我聽見你的名聲就懼怕，求你復興你的作為。",""],["3:8","「耶和華啊，你乘在馬上」先知向神說話，看神乘馬。",""],["3:18","「我要因耶和華歡欣」歌的高峰：歡欣的對象是耶和華。","top"],["3:19","「主耶和華是我的力量」全卷最後的稱呼：主耶和華（原文 אֲדֹנָי יְהוִה）。","top"]],"ins":"「耶和華」在希伯來文實檔 13 次、分布於 11 節（1 章 3 次：1:2、1:12×2；2 章 5 次：2:2、13、14、16、20；3 章 5 次：3:2×2、8、18、19）。和合本字面是 15 處：1:5、2:1、3:16 為和合本補譯主詞，2:2 和合本沒有寫出名字，原文有。分布的形狀就是全卷的形狀：第 1 章先知**呼求**祂，第 2 章祂**回答**並自己出聲（2:2、14、20），第 3 章先知**歡欣**於祂（3:18）、稱祂為**我的力量**（3:19）。**全卷最大的聲音，是這個名字。**"}],"lesson":{"1":{"no":1,"vol":"《321哈巴谷書講義》第1課·哈巴谷書第1章","title":"你為何看著不理呢——問、答、問","chars":4706,"min":60,"deep":8,"dchars":1455,"tchars":1293,"blocks":[["h","一、一個沒有日期的書名，一個說不出口的問題（1:1--4）"],["p","弟兄姊妹平安。你有沒有過這樣的經驗：你為一件事禱告了很久，有一天，神真的回答了，可是那個答案，比你原來的問題還要難。你求的是「讓這件事停下來」，神給的卻是『我正在做一件更大的事』。你坐在那裡，不知道該不該說謝謝。今天我們翻開哈巴谷書第一章，就是一個先知，帶著這樣的問題，站在神面前。"],["p","整卷書的第一節只有十來個字：「先知哈巴谷所得的默示。」沒有王的名字，沒有年代，也沒有告訴我們他是哪一個城的人。別的先知書，開頭大多會說「在某王的日子」；這一卷沒有。「默示」這個字，原文有「擔子」的意思，就是壓在肩上的重量。一個沒有日期的書名，反而成了一個邀請：誰正在受苦，誰就可以站在這個位置上讀。"],["p","接著，先知開口了，而且第一句，就是一個沒有包裝的問題：「耶和華啊！我呼求你，你不應允，要到幾時呢？」他沒有先寫三段頌讚，也沒有先說『我知道祢的旨意是美好的』。他把禱告貼著地面喊出來。這個「到幾時」，在詩篇裡出現過很多次，所以這不是離經叛道的埋怨，是聖經裡受苦的人最古老的禱告。請你留意，他是對著耶和華說的，不是對人，也不是對空氣說的。"],["p","請你想一想，這個先知為什麼值得我們信靠地讀下去？不是因為他有答案，而是因為他有誠實。他把心裡最硬的話，原原本本地說出來，沒有包裝，沒有修飾，這使每一個受苦的人，都可以在他的話裡，找到自己的聲音。"],["p","第三節，他說出了痛的來源：「你為何使我看見罪孽？」他的痛，不只是自己遭遇了什麼，而是被迫看見：看見身邊的人受欺壓，看見公平被踩在腳下，看見一個本來可以出手的神，好像沒有動。有一種痛，叫做看見的痛。你不是當事人，可是你看見了，你就放不下。"],["p","第四節，他把畫面推到整個社會：律法放鬆，公理不顯明，惡人圍困義人，所以公理顯然顛倒。「放鬆」這個字，原文的意思是麻木，像手腳發麻的人，動不了；「顛倒」是彎曲，像一條直線被人扭彎了。不是幾個壞人而已，是整個應該扶住人的東西，都軟掉了。"],["d",["先知這樣質問神，算不算沒有信心？","不算。判斷的標準有三個：第一，他是對著神說話，沒有離開；第二，他稱神為「耶和華」，後面還稱祂是「我的神，我的聖者」，是帶著關係在問；第三，神沒有責備他，反而在下一段回答。最會質問神的人，常常是還沒有離開神的人；真正離開的人，已經不問了。當然，這不是鼓勵我們用怨恨對待鄰舍或對待神，而是說：你可以把心裡最硬的話，帶到神面前，聖經早就替你開了這個口。你不需要用漂亮的話開始，只要誠實，就是一個好的開始。"]],["h","二、神的回答比問題更大（1:5--11）"],["p","先知問完了，神回答了。可是祂的第一句，不是解釋，而是一個命令：「你們要向列國中觀看，大大驚奇。」先知一直在看自己的面前：暴力、不公、公理顛倒。神說：抬起頭來，向列國觀看。祂沒有否認先知看見的痛苦，祂是說：還有一些事，你沒有看見。接著是那句很重的話：「在你們的時候，我行一件事，雖有人告訴你們，你們總是不信。」原文是兩個同根的字疊在一起：作為，我正在作為。神沒有睡覺，也沒有袖手旁觀。"],["p","可是，下一節讓人說不出話來：「我必興起迦勒底人，就是那殘忍暴躁之民，通行遍地，佔據那不屬自己的住處。」先知為猶大國裡的暴力與不公哀求，神說：我要興起一個更兇猛的國。這個回答，比問題更大，也更難。難怪神要先說：你們總是不信。祂知道，這個答案不容易接受。"],["p","1:7 到 1:10，經文用了四節的篇幅，把迦勒底人的畫像描寫得鉅細靡遺：他威武可畏；他的馬比豹更快，比晚上的豺狼更猛；馬兵從遠方飛奔而來，像老鷹俯衝抓食；他譏誚君王，笑話首領，嗤笑一切保障。沒有一道牆擋得住他，沒有一個權威被他放在眼裡。這幾節，從馬，寫到兵，寫到態度，一路往裡面走。外面的威風，最後都指向一個問題：他把什麼，放在神的位置上。"],["p","請留意 1:9 最後落在哪裡：「都為行強暴而來」。強暴，正是先知在 1:2 哀求神救他脫離的那個字。先知喊的那個字，神在回答裡，用同一個字說出來。這不是巧合，這是神在說：我聽見你哭的那個字了，我沒有忘記。這個字，在整卷書裡，還要走一個很長的圈。"],["p","還有一點值得留意：神在說完「我行一件事」之後，沒有立刻解釋祂的目的。這一段沒有「因為」，也沒有「為了」。這提醒我們，神的回答，並不總是附帶說明書；有時候，祂只是要我們知道：祂在動工，這就夠我們站穩了。"],["p","1:11 說穿了這個帝國的問題：「他以自己的勢力為神。」他可怕，不只是因為馬快、兵多，是因為他把自己的力量當作神。這是舊約最深的一個罪名：把神的位置，放給自己。讀到這裡，我們很容易鬆一口氣，原來神也看見他們的罪。但這一句也是對我們說的：職位、金錢、人脈、能力，每一個握著一點權力的人，都有這個試探。所以，我們先不把這一節指向別人，先把它舉到自己面前。這裡也要說清楚，迦勒底人是當時的新巴比倫帝國，是神在那個歷史時刻所用的工具；我們不把他們對應到今天任何一個國家、民族或政權。"],["d",["神為什麼用一個更兇猛的國，來回答先知的問題？","經文沒有給一個完整的解釋，我們也不替神編造，更不急著把答案說得太滿。我們能確定的有三件事：第一，神真的聽見了，祂有回答，沒有沉默；第二，神的作為，常常比我們的問題更大，也更難懂，所以祂先說「你們總是不信」；第三，神使用迦勒底人作工具，並沒有替他們辯護，1:11 說他「顯為有罪」，1:9 說他「為行強暴而來」。神的主權與人的責任，經文同時承認。這個難題，下一章還要繼續處理，我們先不急著替神解釋。"]],["h","三、原文亮光：強暴、看、網（1:2--17）"],["p","這一章有三個原文字，剛好可以串起前面的內容。第一個是「強暴」，希伯來文 חָמָס（khamas）。它不只是肢體的暴力，也包括一切不公正的、傷害人的行徑。先知在 1:2 說「我因強暴哀求你」，1:3 說「毀滅和強暴在我面前」，到了 1:9，神說迦勒底人「為行強暴而來」。同一個字，從先知的哭聲，變成神回答裡的字。"],["p","這個字，三十秒怎樣轉成生命？你可以問自己：我現在有沒有一個「強暴」，是我天天看見、卻只能哭的？也許是家裡一個一直沒有被處理的傷害，也許是職場裡一件不公平的事。先不急著解決，先像先知一樣，把那個字對神說出口。"],["p","第二個是「看」，希伯來文 תַּבִּיט（tabbit）。1:3 說「你為何看著奸惡而不理呢」，這個「看著」，是定睛注視。可是同一節的「使我看見罪孽」，用的是另一個「看」。先知的抱怨是：我被迫看見，祢卻定睛看著而不動手。神在 1:5 把這個「看」接了過去：你們也來看，向列國觀看。這個「看」，後面還會一路走到第 2 章的守望所，與第 3 章神自己站立觀看。"],["p","這個字，三十秒怎樣轉成生命？你可以問：我現在最常「看」的，是什麼？是新聞、是別人的成績、還是我的帳單？先知被神把眼睛轉了方向，我們也可以每天固定一個時間，把眼睛先轉向神。"],["p","第三個是「網」，希伯來文 חֶרְמוֹ（khermo，他的網）。1:15 說他「用網捕獲」，1:16 說他「向網獻祭，向網燒香」。這是把祭祀的語言，用在一張漁網上：他把自己的工具，當作神明。與 1:11「以自己的勢力為神」，互相呼應。"],["p","這個字，三十秒怎樣轉成生命？你可以問：我有沒有一張「網」，是我靠它得肥美的分、並且暗暗向它獻祭的？可能是職位、技術、人脈，也可能是一套讓我不必倚靠神的辦法。發現它，不是定罪，是恩典的開始。"],["d",["原文字義講得這麼細，有必要嗎？","有必要，但要有一個邊界：每一個原文字，都要能在三十秒內轉成生命。「強暴」使我們看見先知哀求的字，成了神回答的字；「看」使我們看見先知的眼睛怎樣被神轉向；「網」使我們看見工具怎樣變成神。這些不是為了顯示學問，而是為了使我們讀得更慢、更準，不錯過經文本身要說的話。不能轉成生命的，我們就留在書房，不帶到講台上，也不帶進小組裡。這是整個系列一貫的原則，也是對會眾時間的尊重。"]],["h","四、如魚與網：第二個問題（1:12--17）"],["p","迦勒底人的畫像，先知看完，沒有鬆一口氣，他問得更深。可是請你留意他是從哪裡開口的：「耶和華－我的神，我的聖者啊，你不是從亙古而有嗎？」他是跪著問的。他先站在神的永恆上，才開口再問。接著那句「我們必不致死」，在原文有一個古老的異讀，有人認為原文是「祢不死」；無論哪一種讀法，核心是相同的：先知抓住神的永恆，當作一根繩子，不被絕望吞沒。"],["p","第 13 節是這卷書的神學心臟：「你眼目清潔，不看邪僻，不看奸惡；行詭詐的，你為何看著不理呢？」先知抓住神的聖潔，然後把它拿來問神。這不是外面人的挑戰，而是一個信徒內在的衝突：我所認識的神，眼目清潔；可是我眼前的歷史，卻讓這位神，像一個旁觀者。這兩件事，怎麼同時是真的？"],["p","然後，他把眼前的畫面說出來：「你為何使人如海中的魚，又如沒有管轄的爬物呢？」魚沒有防備，爬物沒有領袖。他用鉤鉤住，用網捕獲，用拉網聚集，因此歡喜快樂，就向網獻祭，向網燒香，因他由此得肥美的分和富裕的食物。這個人不是在報仇，他是在享受；他把自己的工具，當作神明。當一個人的方法，比他的對象更大，工具就成了神。"],["p","先知把兩個問題擺在一起：一個是「到幾時」，問的是時間；一個是「為何」，問的是原因。時間與原因，是受苦的人最常問的兩件事，也是最難得到答案的兩件事。哈巴谷書沒有假裝有答案，這使它成為一卷特別誠實的書。"],["p","這一章的最後一節，沒有答案：「他豈可屢次倒空網羅，將列國的人時常殺戮，毫不顧惜呢？」先知把問題放在神面前，就停在那裡。他沒有說「我明白了」，也沒有說「我不問了」。這是第一章最誠實的地方：信心不是沒有問題，信心是把問題帶到神面前，然後等候。第二章第一節，就是這個等候的開始：先知說，我要站在守望所。他的轉折，不是得到了答案，而是換了站立的位置。"],["d",["我是受害者，讀到「如魚被網」這幾節，心裡很痛，怎麼辦？","請你先停下來，不必勉強讀完。這幾節描寫的是被捕的人，神的眼睛先看見他們，責任在拿網的人，不在被捕的人；經文沒有一個字說「是你不夠小心」。你可以選擇只讀到你能承受的地方，也可以找一位可信的人陪你一起讀。教會的責任，是成為一個安全的地方：不追問細節，不要求你原諒，不對你說「你要有信心」。如果需要，也協助你尋求專業的協助與保護。你的安全與復原，比讀完一章經文更重要。"]],["d",["為什麼這一章結束在問題，沒有答案？","因為這一章要先讓我們看見：問題本身，是被神的話收容的。先知沒有把問題修剪成頌讚，聖經也沒有替他補上一個漂亮的結尾。這樣的安排，給受苦的人一個空間：你可以停在還沒有答案的地方，不必急著跳過。答案要等到第二章，先知換了位置，神才親自開口。有時候，我們需要的不是更快的答案，而是一個可以誠實站著的地方。哈巴谷書第一章，就是這樣一個地方，它沒有催促我們離開。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 1:2–4 的質問，講成先知缺乏信心，勸人「不要這樣問神」。經文沒有責備先知，反而把他的問題收進了正典；受苦的人聽完，應該更敢向神說實話，而不是更不敢開口。"],["p","第二個偏差，是把迦勒底人對應到今日某個國家、民族或政權，說這是對現代的預言；或從 1:1 和迦勒底人的記載，推算全書的年代與日子。迦勒底人是當時的歷史對象，經文沒有給日期，我們也不算日子。"],["p","第三個偏差，是把 1:5「我行一件事」，講成『今天的苦難都是神親手安排的管教』，或把 1:6 神「興起」迦勒底人，講成神贊成暴力。神使用工具，不替工具的罪辯護；我們也不替任何人的苦難，加上這樣的標籤。"],["p","第四個偏差，是向受害者說『你就是被網捕的魚，是你自己不夠警覺』，或催促他『不要再問了，要感恩、要原諒』。1:14–17 描寫的是被捕的人，神的眼睛先看見他們；受傷的人，先需要被聽見。"],["p","第五個偏差，是急著替 1:17 補上答案，或把 1:13 的「看著不理」講成神冷漠、神看不見惡。這一章刻意停在問題上，聖潔的神與神的沉默並列，下一章神會親自回答；我們帶著這個張力，繼續讀。"],["d",["有人說迦勒底人就是今天某個國家，我該怎麼回應？","可以這樣回應：迦勒底人是公元前七世紀的新巴比倫帝國，是神在那個歷史時刻所用的工具；經文的對象是當時的猶大，不是今天任何一個國家或民族。把經文套到現代的政權上，常常使經文變成政治的工具，也傷害了會眾裡可能來自那個地方的人。若要應用，只能用在「以自己的勢力為神」這個原則上，而且先照自己：我的網是什麼？我是否向它獻祭？這樣的應用，才是經文真正要我們做的，而不是替歷史上的帝國，貼上今天的標籤。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「不要問為什麼」。在華人的家庭與教會文化裡，長輩常說：「要順服」「要忍耐」「神自有安排」。這些話本身不是錯，可是它們常常被用來叫人閉嘴，使受苦的人覺得：我心裡有疑問，是我信心不夠。哈巴谷書給我們一個不同的圖畫：先知把問題帶到神面前，神沒有責備他。教會要成為一個可以說「到幾時」的地方。"],["p","第二個問題：我們很習慣「用道理安慰人」。看見別人受苦，我們很快就說：「這是神的旨意」「凡事都有益處」「你要往好處想」。這些話說得太快，會讓受苦的人覺得自己的痛被打發了。先知哈巴谷的第一個回應，是把問題原原本本說出來；我們的第一個回應，也該是陪伴：先坐下來，聽他把話說完，再一起禱告。"],["h","七、活出321——帶著問題，不離開"],["p","耶穌是我的榜樣。祂在客西馬尼園戰兢禱告，在十字架上帶著最深的質問，喊出：「我的神！我的神！為什麼離棄我？」祂沒有離開父，祂是帶著問題，把自己交在父的手裡。我們帶著問題來到神面前，不是離經叛道，是跟隨耶穌的腳蹤。"],["p","聖經是我的準則。哈巴谷書把先知的質問，原原本本寫進聖經，沒有修剪。聖經容許我們這樣問，也要我們帶著問題，繼續聽下去，直到下一章神親自開口。我們讀這一章，是讓聖經自己說話，不是用它去指著別人，更不是推算任何日子。"],["p","聖靈是我的引導。當我們問不出口、禱告不出來的時候，聖靈親自用說不出來的歎息，替我們禱告。祂也引導我們，從「我要先弄明白」，走向「我先站在神面前」。"],["p","讓耶穌作王。無己，是放下『我要先想通才肯信』的那份驕傲，也放下以自己的勢力、方法、成功當作神的試探。回到本位，讓人作人，讓神作神。我把「到幾時」和「為什麼」，都放在耶穌的腳前，讓祂的主權，比我的問題更大。"],["p","讓耶穌得著一切的榮耀。神說：我行一件事。這一切，是神的作為，不是我們的功勞。我們不必先看懂祂的作為，才能把榮耀歸給祂；在還沒有答案的時候，仍然把眼睛放在祂身上，就是榮耀祂。"],["p","建立屬神的體系。一個屬神的群體，是一群容許彼此說出「到幾時」的人，先陪伴、後安慰；不拿網、不拿方法、不拿勢力當作神；在受苦者旁邊先站著、先聽著，不催促、不急著解釋。"],["d",["「帶著問題，不離開」具體可以怎麼做？","可以從三件小事開始。第一，每天固定三分鐘，把心裡最硬的一個問題，寫成一句話，對神說出口，說完不必加任何解釋。第二，找一位可信的同伴，告訴他：我有一個問題，我不需要你給答案，只需要你聽我說完。第三，在聚會裡、在小組裡，不用「要有信心」去打斷別人的問題，先說：我聽見了。這三件事都很小，可是它們使我們在還沒有答案的日子裡，仍然站在神面前。你不需要做很大的事，只需要不離開。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我要先弄明白，神才值得我信。經文對他說：先知也有疑問，可是他是跪著問的；先稱神為「我的神，我的聖者」，再說出問題。邀請你，把「我要先弄明白」，換成『我願意站在祢面前』。"],["p","恐懼型的人說：我不敢問，怕神生氣，怕被說信心不夠。經文對他說：神沒有責備哈巴谷，祂還回答了他。你可以把話說出來，神承受得起。邀請你，今天選一句最小的，對神說出口。"],["p","羞恥型的人說：我曾經對神說過重話，我不配再被祂聽見。經文對他說：先知說的話，比你說的更重，神仍然沒有離開他。祂沒有因為你的問，把你推開。邀請你，帶著羞愧，仍然回到祂面前。"],["p","受傷型的人說：我是被網捕的魚，我不知道神在哪裡。這一章先讓你看見：神的眼睛，先看見被捕的人；先知替你說出了你說不出的話。你不需要立刻明白，也不需要立刻原諒。邀請你，讓別人陪你坐一會兒。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天睡前，花三分鐘，安靜地說：主，我心裡有一個「到幾時」，我把它放在祢面前。連續七天，說完就睡，不必加任何話。"],["p","第二，找出你正在靠它才能安心的那一張「網」，寫下來，問自己：如果它不見了，我還剩下什麼？不必急著放下，先看見它。"],["p","第三，找一位正在受苦的人，這個星期只問他一句：你願意說說嗎？聽他說完，不給答案，不說「要有信心」。"],["p","第四，這個星期，遇到令你不平的事，先不轉發、不評論，先為那件事禱告三分鐘。"],["p","第五，在小組裡或家人面前，說一次：我現在有一個還沒有答案的問題。讓別人知道，你也有。"],["p","我宣告：我可以把我的問題，帶到神面前，神不會因此離棄我。"],["p","我宣告：我不以自己的勢力、方法、成功為神，我把它們放在耶穌的腳前。"],["p","我宣告：我願意站在受苦者旁邊，先聽，不催促，不急著替神解釋。"],["p","我宣告：耶穌是我的王，在我還沒有答案的日子，我仍然站在祂面前。"],["d",["這一週我可以立刻做的一件事是什麼，才不會只停在聽道？","最小、也最能立刻做的一件事，是今天晚上，用一分鐘，把你心裡那個「到幾時」寫成一句話，然後對神說出口。不需要寫得漂亮，也不需要有結論，只要說出來。如果你願意，再多做一步：明天找一個人，告訴他你寫了什麼。一件小事，做了，就不再只是聽道。真正的改變，常常從一句誠實的話開始，而不是一個很大的決心。今晚就可以開始，不必等到明天。如果你今晚做不到，明天早上也可以；重點不是完美，而是這一句話終於從心裡，走到了神面前。"]],["h","十、結語"],["p","哈巴谷書第一章，是一個沒有日期的書名，一個說不出口的問題，一個比問題更大的回答，和一個停在半空中的質問。先知帶著「到幾時」「為何看著不理」，沒有離開神；神沒有責備他，反而把他的問題，寫進了聖經。"],["p","在這一章，神要我們看見祂的心：祂是一位聽見的神，是一位正在作為的神，也是一位容許我們誠實發問的神。這一章沒有給我們一個漂亮的結局，卻給了我們一個姿態：帶著問題，不離開。"],["p","所以，請你記得今天這一課的三個重點：先知的問，是禱告，不是不信；神的回答，比我們的問題更大，也更難；我們先站在受苦者旁邊，不替神辯護，也不催促任何人。焦點在耶穌，不在強暴，不在迦勒底人，不在我的處境。"],["p","親愛的天父，謝謝祢，容許我們帶著問題來到祢面前。求祢使我們不離開，也使我們成為別人可以說出「到幾時」的地方。願耶穌作王，願一切榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 哈巴谷書一章二節：我呼求你，你不應允，要到幾時呢。你最近有沒有一個「到幾時」？請說出是哪一類，不必細節。"],["n","2. ★ 一章一節：「默示」有擔子的意思。你現在肩上扛著的，是什麼？請說出一個，例如家庭、健康、工作。"],["n","3. ★★ 一章三節：你為何使我看見罪孽。你有沒有一件事，是你看見了卻無能為力？請說出一件，不必細節。"],["n","4. ★★★ 請在安靜中想一件事：一件你一直不敢對神說出口的問題。現在用一句話寫下它，並寫下你願意讓誰陪你，一起把這句話對神說一次。"],["m","帶領提醒：請先安靜念一章二節，再開始。不要點名逼人說。這一章會碰到暴力、不公與被傷害的處境：如果有人提到性暴力、家庭暴力、流產、失去孩子、自傷的念頭或長期的無望感，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助他尋求專業協助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照一章十一節、十六節，你有沒有一張「網」，是你靠它才能安心的？請只說出一個，例如工作、金錢、人脈。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，讀一章五節：我行一件事。你心裡聽見的是什麼？請說出你聽到的第一個感覺。"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：一章九節說迦勒底人「為行強暴而來」，這個字與一章二節先知所哀求的是同一個字。請用自己的話向組員說明：這對你理解神的回答，有什麼幫助？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先向誰說出你的問題，並當場說出他的名字。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，用三分鐘把你的「到幾時」對神說出口；寫下時間，並說出誰會提醒你。"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，正在問「到幾時」的人？請說出名字，並決定這個月用一句具體的話關心他。"],["n","11. ★★ 你的小組或教會，有沒有人因為問問題而被說「信心不夠」？請說出你可以怎樣，在下次聽到時，不跟著說。"],["n","12. ★★ 你有沒有一位，曾經在你受苦時陪伴你、沒有急著講道理的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起學習「帶著問題不離開」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要用它論斷任何講員、教會、政府，也不要用經文推算任何時間，或套用到今日任何國家或領袖。若有人分享被傷害、被背棄、失去親人、成癮或家庭暴力的經歷，不追問細節、不要求原諒、不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助他尋求專業協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個問題，放在神面前。一起念一章二節。"],["p","由帶領者為每一位禱告：求神使我們帶著問題，不離開祂；也使我們成為別人可以誠實開口的地方。散會前，彼此問一句：這個星期，我可以怎樣為你禱告？"]]},"2":{"no":2,"vol":"《321哈巴谷書講義》第2課·哈巴谷書第2章","title":"惟義人因信得生——守、候、禍","chars":4987,"min":60,"deep":8,"dchars":1502,"tchars":1278,"blocks":[["h","一、站上守望所，聽神怎樣回答（2:1--3）"],["p","弟兄姊妹平安。你有沒有在月台上等過一班遲到的車？電子看板上寫著「誤點」，沒有寫幾分鐘。你站在那裡，一次又一次往軌道的盡頭看，越看，越覺得時間走得很慢。有人開始看手機，有人開始嘆氣，也有人乾脆走了。今天我們讀哈巴谷書第二章，就是一個人，站在月台上，等一班他不知道什麼時候會到的車。"],["p","上一章的最後，先知問完了一串沒有答案的問題。第二章的第一句，他沒有再問，他換了一個位置：「我要站在守望所，立在望樓上觀看，看耶和華對我說什麼話。」請你留意這三個動作：我要站，我要立，我要觀看。這不是路過，是刻意選了一個位置。守望的人有一個特點：他不決定消息什麼時候來，他只決定自己站在哪裡。"],["p","第一章，先知看的是罪孽、強暴、公理顛倒，他看的是周圍。第二章，他看的是神。他沒有等到周圍變好，才去看神；他是在周圍沒有變的時候，轉過身去，看神。這一小步，是整卷書最重要的一步。他也很誠實地說：我可用什麼話向他訴冤。他預備好了聽，也預備好了回答；心裡還有疑問，雙腳卻站好了。"],["p","神回答了。第一句不是答案，是一個指示：「將這默示明明地寫在版上，使讀的人容易讀。」寫下來，寫大一點，讓路過的人也讀得到。神把先知一個人的問題，變成了一份給眾人的話。請你留意，神寫的是「異象」，不是「理由」。神沒有給先知一份完整的解釋，祂給的是一個可以被信靠的方向。人在苦難裡，常常盼望理由；神常常先給的，是祂自己的話。"],["p","然後是每一個等候的人都熟悉的一節：「因為這默示有一定的日期，快要應驗，並不虛謊。雖然遲延，還要等候；因為必然臨到，不再遲延。」這一節有兩個層次：第一層是人的感覺，「遲延」；第二層是神的時間，「不再遲延」。神沒有否認人覺得慢，祂用了這個字，承認等候的人所感受到的，是真的。而且，神沒有說「再等一下就好」，祂說的是「還要等候」。我們不知道日期，也不拿這句話去算任何事情。"],["d",["「遲延」和「不再遲延」同時出現，會不會互相矛盾？","不矛盾。前者是從人的感受說的，後者是從神的時間說的；經文把兩層並排放著，沒有讓其中一個取消另一個。這給等候的人兩個安慰：你覺得慢，是被神承認的感覺，不是你信心不夠；而神的話不虛謊，神的時間不遲到。我們不能因此替神算出日期，也不能對正在等的人說「快了」。我們能做的，是陪他站在同一個月台上，一起等。這也是我們今天作教會的功課：不用答案堵住別人的嘴，而是用同在，扶住等候的人，讓他知道自己不是一個人。"]],["p","我常常想，守望的人，其實是一個很特別的角色。他不是工人，沒有什麼東西要做出來；他也不是旁觀者，因為城牆上的安危，與他有關。他站在高處，不是為了比別人高，是為了替別人看。先知在這裡的身分，就是這樣：他替那些還在黑夜裡、看不見的人，站上去看。你有沒有發現，我們今天最缺少的，往往不是答案，而是願意替別人站上去看的人？"],["p","所以，今天如果你是一位母親，在孩子的房門外守著；如果你是一位兒子，在醫院走廊守著；如果你是一位同工，在深夜替弟兄禱告，你就是在守望。這份守望，神看得很清楚。祂沒有說「你守得不夠久」，祂說的是：我有話對你說。守望的人，從來不是被遺忘的人。"],["h","二、惟義人因信得生（2:4--5）"],["p","接著，就是整卷書最有名的一節：「迦勒底人自高自大，心不正直；惟義人因信得生。」兩個人，兩條路。一個自高自大，裡面是歪的；一個是義人。請你想想第一章：這個義人，在 1:4 被圍困，在 1:13 被吞滅，他是被傷害的那一個。現在，神對他說：你要活。而你活著的方式，不是靠你的力量，是靠一個穩定的倚靠。"],["p","這個「信」，原文的意思是可靠、站得穩，不是頭腦裡一個很大的相信。所以我們要很小心：「義人因信得生」，不是說『信心夠大，才有生命』。它不是一個分數。生命，是神給的；信，是靠著祂，不離開。一個信心搖搖晃晃的人，不需要先把信心練到某個程度，才算活著；他只要繼續向神倚靠。"],["p","新約三次引用這一節：羅馬書 1:17、加拉太書 3:11、希伯來書 10:38。保羅用它講稱義，希伯來書用它講忍耐。用法不同，卻都沒有離開哈巴谷的處境：一個在等候中的義人，靠著神，活下去。我們的主耶穌，就是這樣活的。祂在曠野靠神的話活，在十字架上把靈魂交在父手裡；祂是第一位完全因信而活的義人，我們因信與祂聯合，祂的信實，成了我們活下去的根基。"],["p","2:5 把畫面拉回迦勒底人：他像被酒灌醉，貪得無厭，擴充心欲，好像陰間，如死不能知足，聚集萬國、堆積萬民，都歸自己。一個什麼都要吞的人，最後什麼也沒有得到滿足。與義人的「得生」並排，是一個很安靜的對照：吞的人不能滿足，倚靠的人得著生命。"],["d",["「因信得生」是不是說，信心不夠大的人就沒有生命？","不是。這節經文是對一個正在受苦、站不穩的義人說的，它是邀請，不是門檻。「信」的原文有「可靠、站得穩」的意思，指向的是那位可靠的神，不是信的人自己的程度。信心搖晃的時候，神仍然扶住你。我們不能用這節經文去量任何人的信心大小，也不能拿它去安慰自己「我的信心夠大」。生命是神給的，我們只需要繼續靠著祂，不離開。換句話說，這節經文不是給信心評分，而是給軟弱的人一條可以走的路：今天先靠著祂過今天，明天再靠著祂過明天，就是因信得生。"]],["p","這裡還有一件很容易被忽略的事：這一節的「義人」，不是一個完美的人，而是在第一章裡，帶著問題、帶著眼淚、站在神面前的那個人。換句話說，被神稱為義人的，不是從來沒有懷疑的人，而是帶著懷疑，仍然留在神面前的人。你的問題沒有把你踢出義人的行列；離開，才會。"],["p","所以，如果你今天心裡有一堆說不出口的問題，請不要急著把它們藏起來。把它們帶到守望所，一個一個放在神面前，這就是信。信，不是沒有問題；信，是帶著問題，仍然站著。"],["h","三、原文亮光：等候、信、靜默（2:3--20）"],["p","這一章有三個原文字，剛好可以串起整章。第一個是「等候」，希伯來文 חַכֵּה（khakkeh）。2:3 說「雖然遲延，還要等候」。「等候」是一個動詞，不是一個狀態。它和 1:15 的魚鉤（khakka）寫起來很像，但字根不同；先知在這裡用的是耐心地等、指望地等。"],["p","這個字，三十秒怎樣轉成生命？你可以問自己：我現在有一件在等的事嗎？我是在「等結果」，還是在「等神」？等結果的人，每天看手機；等神的人，每天站在守望所。不一樣的，是眼睛看的方向。"],["p","第二個是「信」，希伯來文 בֶּאֱמוּנָתוֹ（be'emunato，靠著他的信）。字根 aman 是「穩固、可靠」。這個名詞指的是一種持續、穩定的倚靠，不是一次的感覺。經文說「他的」emunah：義人靠著的，是他對神那份穩定的倚靠；而那份倚靠，仍然是神所賜的。"],["p","這個字，三十秒怎樣轉成生命？你可以問：今天，我把重量放在什麼上？是我的存款、我的計畫、我的人際關係，還是那位可靠的神？一個很小的練習：每天早上，說一句：主啊，今天我把重量放在祢身上。"],["p","第三個是「肅敬靜默」，希伯來文 הַס（has）。這是一個像「噓」的感嘆詞，專用在人站在神面前不作聲的場合。2:20 說：「全地的人都當在他面前肅敬靜默。」前面有那麼多聲音：譏刺的歌、石頭的呼叫、木偶被喊著「醒起」，到了最後，所有的聲音都停了。"],["p","這個字，三十秒怎樣轉成生命？你可以每天找一個三分鐘，什麼都不說、什麼都不求，只是在祂面前站著。這不是壓抑問題，而是在神回答之後，把自己放回祂的面前。"],["d",["原文的「等候」和「魚鉤」字形很像，有關係嗎？","字形相近，但字根不同，沒有神學上的關聯，不要把它講成一個文字遊戲。「等候」khakkeh 的字根是 khakah（H2442），「魚鉤」khakka 的字根是另一個（H2443）。我們提這個，只是提醒讀者：同一個子音骨架，不同的詞，不要隨意連結。講道時，不能轉成生命的原文討論，就留在書房；能轉成生命的，才帶進來。原文的功用，是讓我們更準確地聽神說話，不是讓我們在會眾面前顯得博學，所以字形的巧合，若不能幫助人更愛主，就留給自己讀就好。"]],["p","讀到這裡，也許你會問：這三個字，對我今天的生活，真的有關係嗎？我想說，關係很大。因為我們每個人，每天都在做同一件事：決定把重量放在哪裡。早上醒來，先看手機，還是先看神？遇到壓力，先找人訴苦，還是先站在祂面前？這些小小的選擇，加起來，就決定了一個人是在「等候」，還是在「焦慮」。"],["p","原文的亮光，不是為了讓我們多認識幾個字，而是讓我們在熟悉的經文裡，聽見更立體的聲音。「等候」是有方向的，「信」是有重量的，「靜默」是有對象的。三個字合起來，就是一個人活在神面前的樣子：眼睛朝向祂，重量放在祂身上，嘴巴在祂面前安靜。"],["h","四、五禍與榮耀的知識（2:6--20）"],["p","接下來是五個「禍哉」。我們要先理解一件事：這五個禍，是被壓迫的人，編成的歌；不是先知拿來咒詛任何人的話。「禍哉」原本是喪禮上的哀哭，像是對一個還活著的人唱挽歌，意思是：你正走向死亡，你自己還不知道。先知問神：到幾時；被壓迫者問壓迫者：到幾時。同一個句型。"],["p","第一禍，說的是增添：增添不屬自己的財物，多多取人的當頭。那可能是錢，也可能是時間、功勞、別人的付出。第二禍，說的是家：為本家積蓄不義之財，在高處搭窩，指望免災。他的動機聽起來不壞，我要保護我的家；可是用不義的方法保護，最後使家蒙羞。2:11 有一句很驚人的話：「牆裡的石頭必呼叫；房內的棟樑必應聲。」被害的人也許沒有機會說話，但房子會說話。"],["p","第三禍，是以人血建城。一座城，是人類最大的成就，也是最大的誘惑。如果這座城，是用別人的血汗堆起來的，它會被火燒。可是就在這裡，在兩個「禍哉」之間，突然出現一幅完全不同的畫面：「認識耶和華榮耀的知識要充滿遍地，好像水充滿洋海一般。」不是血，是水；不是火焚，是充滿。海裡沒有一處是沒有水的；神榮耀的知識，最後也是這樣。這是一個方向，不是一個日期。"],["p","第四禍，是最需要小心閱讀的一個。它講的是一種對鄰舍的羞辱與侵犯，經文用了含蓄的筆法，我們也不重述畫面，更不拿它開任何玩笑。如果你曾經被人這樣傷害，請聽經文先說的話：神看見了，而且說，這是禍。它不是你的羞恥，是那個人的。復原是一條路，有時間，有同伴，有時也需要專業的協助。"],["p","第五禍，是一幅幾乎荒謬的畫面：「對木偶說：醒起！對啞巴石像說：起來！」我們每個人，有沒有一些東西，是我們指望它醒來幫助我們的？專業、存款、計畫、名聲。凡是我必須靠它才能安心的，就是我的神。外表包著金銀，裡面毫無氣息。然後，第二章用一節收尾：「惟耶和華在他的聖殿中；全地的人都當在他面前肅敬靜默。」"],["d",["五個「禍哉」可以用來咒詛壞人嗎？","不可以。2:6 已經說明，這些話是受害的國民提起詩歌、俗語所唱的歌；「禍哉」是喪禮的哀歌，不是咒詛的口號。我們讀五禍，每一個禍都先問：我有沒有？我有沒有增添不屬自己的？我有沒有為自己築高處的窩？我有沒有倚靠沒有氣息的東西？它是一面鏡子，不是一把槍。我們也不把五禍套到任何一家公司、行業或政府。因為一旦指著別人，我們就從被光照的人，變成拿著光去照別人的人，位置已經不對了。"]],["d",["2:14 說知識要充滿遍地，所以我們就不用做什麼了嗎？","不是。2:14 是方向，不是日期，也不是我們可以不行動的理由。神的榮耀要充滿遍地，同時，我們今天每一個誠實的決定、一次饒恕、一次不佔便宜的選擇，都是在這片海裡多加一滴水。盼望使人行動，而不是使人消極。因為知道方向的人，才有力氣走今天的這一步，也才有力氣在不義面前說不。對正在受苦的人，我們也不要用 2:14 去壓迫他「要有盼望」；可以說：這是神的方向，你今天只需要站在守望所，一步一步走下去。"]],["p","最後，讓我們把五禍放回整章的脈絡裡。第二章不是一份審判書，它的中心，是 2:4 與 2:14 與 2:20：義人因信得生、神的知識充滿遍地、神在殿中人當靜默。五個禍夾在中間，像是五面鏡子，讓我們一面一面照自己。照完了，我們不是被定罪，而是被帶回神的面前。"],["p","請你記得，哈巴谷書沒有以咒詛作結，第二章是以靜默作結。當一個人真正看見神，所有的辯論、控告、算計，都會安靜下來。這不是被迫閉嘴，而是發現：原來祂已經在這裡了，原來，我不必再用自己的力量，把世界扶正。"],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 2:3「雖然遲延，還要等候」，講成給受苦者一個時間表，或對他說「再等一下就好」。遲延是人的感覺，不再遲延是神的話；經文沒有給日期，我們也不替等候的人加上時間。"],["p","第二個偏差，是把 2:4「因信得生」講成『信心夠大，才有生命』，或把它當作衡量人的標準。信，不是分數；生命，是神給的。信心軟弱的人聽完，應該更得安慰，而不是更覺得自己不夠格。"],["p","第三個偏差，是把五個「禍哉」當作咒詛的口號，或套到今日某家公司、某個行業、某個政府。五禍是被壓迫者的歌，我們先拿它照自己，不拿它指著別人。"],["p","第四個偏差，是重述 2:15–16 的羞辱細節，或對曾被羞辱、侵犯的人說「你要原諒」「是你當時不小心」。這一段的「禍」落在行惡的人身上，不在受害者；我們先站在受害者一邊，不追問細節。"],["p","第五個偏差，是把 2:14 講成末世時間表，或用 2:20 的「肅敬靜默」，要求受苦者不要再說話。2:14 是方向，不是日期；2:20 的靜默是神回答之後的敬拜，不是封住受傷者的口。"],["d",["有人用 2:5「因酒詭詐」來論斷喝酒的人，可以嗎？","不可以。這句話在原文有不同的讀法，有人視為字面的酒，有人視為比喻，指被自己的貪欲灌醉；上下文的重點，是迦勒底人貪得無厭，擴充心欲如陰間。經文不是在論斷個別喝酒的人，也不是禁酒的唯一根據。如果會眾裡有人正與酒癮掙扎，我們要給他安全與尊重，不當眾點名，也不把酒癮說成「屬靈不夠」，必要時協助他尋求專業的協助。同時，我們要讓整個團契知道：這裡是安全的地方，軟弱不會被當作笑話，掙扎的人，不會被貼上標籤，他們需要的，是同行的人。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「忍耐」和「等」，卻常常把它們講成「不要說話」。在華人的家庭與教會文化裡，「忍一忍就過去了」是很普遍的話。哈巴谷書第二章的「等候」，卻不是不說話：先知站在守望所，有疑問，也在等神說話。我們要學習的是有聲音的等候，不是沒有聲音的忍受。"],["p","第二個問題：我們很習慣『為家人積蓄、為孩子打算』，卻不容易分辨，什麼時候這份愛，越過了一條線。為本家積蓄，是很多華人的重擔，也是一份愛。2:9–11 沒有責備想保護家人的人，它責備的是用不義的方法，在高處搭窩、指望免災。我們要問的是：我的積蓄是怎麼來的？我的安全感，是建立在誰的代價上？"],["h","七、活出321——站好，因信得生"],["p","耶穌是我的榜樣。祂在曠野，以神的話勝過試探；在客西馬尼園，說「不要照我的意思」；在十字架上，把靈魂交給父。祂是真正站在守望所裡，因信而活的那一位。我們的等候，不是一個人的等候，是與祂同行。"],["p","聖經是我的準則。哈巴谷書第二章沒有給我們一個漂亮的解釋，卻給了我們一個準則：寫下來，等候，惟義人因信得生。我們讀這一章，不是為了算日子，也不是為了找一個可以咒詛的對象，而是讓聖經自己說話，使我們站穩。"],["p","聖靈是我的引導。是聖靈，使我們在遲延的日子裡不灰心；也是聖靈，使我們看見自己所築的窩、自己所倚靠的木偶，並且引導我們回到活的神面前。"],["p","讓耶穌作王。無己，是放下『我要自己保障自己』的那個窩，放下以他人所有堆自己的手，放下對木偶說「醒起」的倚靠。回到本位，讓神作神。讓耶穌坐在我心裡的聖殿中間，我在祂面前，肅敬靜默。"],["p","讓耶穌得著一切的榮耀。神的榮耀要充滿遍地，不是靠我們的努力，是祂自己要成就的。我們所做的每一件誠實的小事，若是出於祂，都是這片海的一部分；榮耀歸給祂，不歸給我們。"],["p","建立屬神的體系。一個屬神的群體，是一群肯站在守望所等候的人，不以他人的所有堆自己，不用羞辱換取優越，不倚靠沒有氣息的偶像；彼此陪伴，在遲延裡，仍然因信得生。"],["d",["「站在守望所」在日常生活裡，可以怎麼做？","可以先選一個固定的時間與地方，作你的守望所。可能是清晨的一張椅子，可能是下班路上的十分鐘，也可能是週間固定的禱告會。重點不在華麗，在固定，而且人在那裡。每次只做一件事：說一句，主啊，我站在這裡，等祢對我說話。然後安靜。不必急著聽見什麼，也不要要求祂今天說完所有的話。守望所給人的，是位置，不是時間表。堅持兩個星期，你會發現，自己等候的姿態，慢慢改變了。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我可以自己保障自己，我有我的窩。經文對他說：高處的窩，看起來安全，其實離所有人都很遠；用不義建起來的保障，最後使家蒙羞。邀請你，把「我要自己保障」，換成「我願意因信倚靠」。"],["p","恐懼型的人說：我怕一直等不到，我怕神不回答。經文對他說：神說了，不再遲延；你不是第一個等候的人，先知也站在這裡。邀請你，不要一個人等，找一位同伴，一起站在守望所。"],["p","羞恥型的人說：我曾經用不對的方法積蓄、增添，我不配再被神扶住。經文對他說：「禍哉」是哀歌，神發出這個聲音時，是看見而痛惜的；祂也說，認識祂榮耀的知識要充滿遍地。邀請你，帶著羞愧，回到那位有氣息的神面前。"],["p","受傷型的人說：我是被羞辱、被傷害的人，我沒有聲音。經文對他說：連石頭都有聲音；神看見，而且說，這是禍。它不是你的羞恥。邀請你，不必急著說話，找一位可信的人，慢慢地，陪你走這條路。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天固定一個時間，站著或坐著安靜十分鐘，只說一句：主啊，我在這裡，等祢對我說話。連續七天，不必求什麼。"],["p","第二，寫下一件你正在等的事，分別寫出「我的感覺是遲延」和『神的話是不再遲延』，兩句並排，每天看一次。"],["p","第三，找一位正在等候的人，問他：這陣子，等得辛苦嗎？聽他說完，不說「快了」，只說：我陪你。"],["p","第四，找出一個你指望它「醒來」幫助你的東西，寫下來，對神說：這是我的木偶，我把它放下。"],["p","第五，這個星期，不替自己多築一個「窩」：一次不佔便宜，一個不用羞辱人換取的玩笑，一次誠實地說出自己的錯。"],["p","我宣
