<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="哈巴谷書講義">
<meta name="application-name" content="哈巴谷書講義">
<meta name="description" content="哈巴谷書講義：全書三章逐節原文解經、講章逐字稿、教學講章與321生命應用。">
<title>哈巴谷書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);

}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"你為何看著不理呢","sub":"問、答、問","lv":"A","arc":"呼求與回答","sec":[["1:1--1","先知哈巴谷所得的默示"],["1:2--4","第一問：你不應允，要到幾時呢"],["1:5--6","神的回答：我行一件事，我必興起迦勒底人"],["1:7--11","迦勒底人：以自己的勢力為神"],["1:12--13","第二問：你眼目清潔，你為何看著不理呢"],["1:14--17","如魚與網：向網獻祭，毫不顧惜"]],"serm":{"pts":[["到幾時","1:1--4","你不應允，要到幾時呢"],["我行一件事","1:5--11","我行一件事"],["為何看著不理","1:12--17","你為何看著不理呢"]]},"q":"你有沒有在最累的那個夜晚，對神問過一句：到幾時？先知哈巴谷在書的第一章，沒有先寫頌讚，沒有先說「我知道祢的旨意美好」，他直接把問題貼著地面喊出來：祢不應允，要到幾時？祢為何看著不理？神沒有責備他，反而把這些問題收進了聖經。這一章要問：當我看見罪孽、卻看不見神動手的時候，我是離開祢，還是帶著問題，仍然站在祢面前？","truth":"先知被迫看見罪孽與強暴，就帶著「到幾時」「為何看著不理」的質問，仍然對著神說話；神回答：我行一件事，我必興起迦勒底人。這個回答比問題更大、更難，先知沒有離開，也沒有得到解釋，只是再問；神的話容許這樣的問，並且沒有責備。","mv":{"t":"耶和華啊！我呼求你，你不應允，要到幾時呢？","r":"哈1:2"},"card":["哈巴谷書沒有王名也沒有年代，只說「先知哈巴谷所得的默示」，默示的原文有「擔子」的意思。先知開口就問：我呼求你，你不應允，要到幾時？我因強暴哀求你，你還不拯救。他看見罪孽、毀滅、強暴、爭端，律法放鬆，公理顛倒。神回答：你們要向列國觀看，我行一件事，我必興起迦勒底人。先知再問：你眼目清潔，不看奸惡，為何看著不理？人如海中的魚，被網捕獲，他卻向網獻祭。","「到幾時」是詩篇裡受苦者最古老的禱告，質問不等於離開；先知是跪著問的，稱神為「我的神，我的聖者」。「強暴」是全卷追蹤字：先知在 1:2 哀求的那個字，神在 1:9 用「為行強暴而來」回答。「看」有三個字根：被迫看見（1:3）、向列國觀看（1:5）、定睛看著不理（1:13）。1:11、1:16 一路指向同一個問題：他以自己的勢力為神，向網獻祭。","耶穌在客西馬尼園戰兢，在十字架上喊：我的神，我的神，為什麼離棄我（太27:46）；祂是帶著最深的問題，把自己交在父手裡的那一位。使徒行傳 13:41 引用了 1:5，提醒聽的人不要輕慢神所行的事。神在歷史裡的作為常常比我們的問題更大；耶穌是那位使我們在沒有答案的時候，仍然可以稱神為父的人。","無己，是放下我要先弄明白才肯信的那個驕傲，也放下以自己的勢力、方法、成功當作神的試探；回到本位，讓神作神，讓我帶著問題，仍然站在祂面前。有己的人，要先有答案才肯往前；無己的人，帶著沒有答案的問題，也能與神同行。","「耶和華啊！我呼求你，你不應允，要到幾時呢？我因強暴哀求你，你還不拯救。」","這個星期，找一個你一直不敢對神說出口的「到幾時」或「為什麼」，寫下來，對神誠實地說出口；再找一個你可以不急著給答案、只是陪他說完的人，坐下來聽他說。","最終整合：\n先知帶著「到幾時」，沒有離開神。\n神回答：我行一件事，比問題更大。\n先知再問：祢為何看著不理？\n這一章沒有答案，只有一個站立的姿態。\n不替神解釋，不替受苦的人加壓。\n讓耶穌作王，在我的問題裡，仍然與祂同行。"],"self":"帶著問題仍站在神面前的定義：我不假裝沒有疑問，也不因疑問而離開；我先站在受苦者旁邊，誠實地說出我的「到幾時」，並且不以自己的勢力、方法、成就當作神。","t321":{"k":"耶穌在客西馬尼園戰兢禱告，在十字架上帶著最深的質問喊出：我的神，我的神，為什麼離棄我；祂沒有離開父，是把自己交在父的手裡，成為我們帶著問題也能稱神為父的榜樣（哈1:2；太27:46）。","g":"讓耶穌作王，就是不再要求自己先想通才肯往前，也不再把自己的勢力、方法、成功當作神；我把「到幾時」和「為何」都放在祂的腳前，讓祂的主權比我的問題更大（哈1:2、11、13、16）。","p":"屬神的體系，是一群容許彼此說出「到幾時」的人；在受苦者旁邊先站著、先聽著，不催促、不急著解釋，也不拿網、拿方法、拿勢力當作神（哈1:2–4、13、16）。"},"grp":["【一、破冰】你最近一次對神說出「到幾時」或「為什麼」，是為了什麼事？說出口的時候，你的心裡是什麼感覺？","【二、扎心】1:2–4 先知被迫看見罪孽，你生命裡有沒有一件事，你看見了卻無能為力？你是怎樣處理那份「看見的痛」的？","【三、經文】1:5–6 神的回答比先知的問題更大、更難。這節經文怎樣讓你重新看「神的回答」與「我要的答案」？","【四、福音】耶穌在十字架上帶著最深的質問，把自己交在父手裡。這怎樣改變你面對「沒有答案」的方式？","【五、行動】1:16 迦勒底人向網獻祭。這個星期，你要放下哪一張「網」（方法、成績、人脈）？你要把它放在誰面前？告訴誰？"],"prac":{"main":"帶著問題，不離開神","items":["對神：每天花三分鐘，把心裡最硬的一個「到幾時」寫成一句話，對神說出口，說完不必加任何解釋。","對自己：寫下一件你正在靠它才能安心的「網」，問自己：如果它不見了，我還剩下什麼？","對人：找一位正在受苦的人，只問「你願意說說嗎」，聽他說完，不給答案、不說「要有信心」。","對生活：這個星期，遇到令你不平的事，先不轉發、不評論，先為那件事禱告三分鐘。","對使命：在小組裡，為一位說出「到幾時」的人預備一個安全的空間，不催促、不糾正。"]},"safe":["① 錯誤講法：把 1:2–4 的質問，講成先知信心不夠，勸人「不要這樣問神」","正確理解：「到幾時」是詩篇裡受苦者的古老禱告，先知是對著神說，不是離開神；神沒有責備，反而把這些問題收進聖經。","檢驗標準：會眾聽完，是更敢向神說實話，還是更不敢開口？","② 錯誤講法：把迦勒底人對應到今日某個國家、民族或政權，說這是對現代的預言","正確理解：迦勒底人是當時的新巴比倫帝國，是神在那個歷史時刻所用的工具；本講義不把他們對應到今日任何國家、族群或政權。","檢驗標準：會眾是更貼近經文，還是更熱衷於用新聞去對照經文？","③ 錯誤講法：從 1:1 或迦勒底人的記載，推算全書的確切年代或末世日子","正確理解：書名只說「先知哈巴谷所得的默示」，沒有王名與日期；年代的討論是學者的事，我們不以它算任何日子。","檢驗標準：會眾是更敬畏神的作為，還是更忙著算日期？","④ 錯誤講法：把 1:5「我行一件事」講成「今天的苦難都是神親手安排的管教」","正確理解：1:5 是神對當時猶大的回答，不是對每一個受苦者的解釋；我們不替任何人的苦難，加上「這是神的管教」的標籤。","檢驗標準：受苦的人聽完，是被陪伴，還是被定罪？","⑤ 錯誤講法：用 1:5 與徒 13:41 的字句差異，講成聖經自相矛盾，或隨意改動經文","正確理解：古老譯本與死海古卷在這裡有異讀，使徒行傳引用的是當時流通的版本；差異是文本傳承的現象，不是矛盾。","檢驗標準：會眾是更信靠神的話，還是更懷疑聖經？","⑥ 錯誤講法：把 1:6 神「興起」迦勒底人，講成神贊成暴力，或神是暴力的源頭","正確理解：神使用工具，並不替工具的罪辯護；1:11 說他「顯為有罪」，1:9 說他「為行強暴而來」；神的主權與人的責任，經文同時承認。","檢驗標準：會眾是更看見神的公義與主權，還是更怕神、更誤會神？","⑦ 錯誤講法：把 1:11「以自己的勢力為神」只當作別人的罪，只指向外面的人","正確理解：這是每一個握有權力的人的試探，職位、金錢、人脈、能力都可能成為「網」；本章要先照自己，再談別人。","檢驗標準：會眾是先看見自己的網，還是更急著指出別人的網？","⑧ 錯誤講法：把 1:12「我們必不致死」講成「信徒不會遭遇死亡或傷害」","正確理解：這句話有文本異讀；無論哪一種，核心是神的永恆成為受苦者不被絕望吞沒的繩子，不是保證不受傷。","檢驗標準：正在受苦的人聽完，是得著繩子，還是得著一個落空的承諾？","⑨ 錯誤講法：把 1:13「看著不理」講成神冷漠，或講成神無法看見惡","正確理解：這是先知在信靠裡的質問，不是神學結論；神的聖潔與神的沉默，在這一章並列，下一章神會親自回答。","檢驗標準：會眾是更敢帶著問題來到神面前，還是更覺得神冷漠？","⑩ 錯誤講法：向受害者說「你就是被網捕的魚，是你自己不夠警覺」","正確理解：1:14–17 描寫的是被捕的人，神的眼睛先看見他們；責任在拿網的人，不在被網的魚。","檢驗標準：受害者聽完，是被陪伴，還是被怪罪？","⑪ 錯誤講法：催促受害者「不要再問了，要感恩、要原諒、要有信心」","正確理解：先知的問在聖經裡沒有被修剪；受傷的人先需要被聽見，復原是一段有同伴、有時間、有專業協助的路。","檢驗標準：正在流淚的人聽完，是被安慰，還是被催逼？","⑫ 錯誤講法：急著替 1:17 的問題補上答案，使這一章看起來有「圓滿的結論」","正確理解：第 1 章刻意停在問題上，沒有答案；答案要等到第 2 章先知站上守望所，神才親自開口。","檢驗標準：會眾是更願意等候神，還是更習慣立刻要答案？"]},{"n":2,"t":"惟義人因信得生","sub":"守、候、禍","lv":"A","arc":"守望與等候","sec":[["2:1--1","守望所：看耶和華對我說什麼話"],["2:2--3","寫在版上：雖然遲延，還要等候"],["2:4--5","義人因信得生：對照自高自大的人"],["2:6--8","第一禍：增添不屬自己的財物"],["2:9--11","第二禍：為本家積蓄不義之財"],["2:12--14","第三禍：以人血建城；知識要充滿遍地"],["2:15--17","第四禍：使人喝醉，好看見他下體"],["2:18--19","第五禍：對木偶說醒起"],["2:20--20","惟耶和華在他的聖殿中"]],"serm":{"pts":[["守望所與因信得生","2:1--5","惟義人因信得生"],["五禍與榮耀的知識","2:6--17","認識耶和華榮耀的知識要充滿遍地"],["偶像與聖殿","2:18--20","惟耶和華在他的聖殿中"]]},"q":"你有沒有等過一個遲遲不來的結果？一份報告、一個答案、一個孩子的消息，每天看手機，越看越覺得時間走得很慢。先知哈巴谷問完了第一章的問題，沒有等到解釋，他做了一件事：站在守望所，立在望樓上觀看。神的回答只有一個姿態：寫下來，等候，惟義人因信得生。這一章要問：當答案還沒有來的時候，我站在哪裡？我倚靠的是誰？","truth":"先知站在守望所等神的話，神回答：把默示寫在版上；雖然遲延，還要等候，因為必然臨到，不再遲延；自高自大的人心不正直，惟義人因信得生。五禍指出以他人所有堆自己的、以不義建立保障的、以血建城的、以羞辱他人取樂的、倚靠偶像的，都歸於虛空；神榮耀的知識終要充滿遍地，惟耶和華在祂的聖殿中，全地當肅敬靜默。","mv":{"t":"惟義人因信得生","r":"哈2:4"},"card":["先知說：我要站在守望所，立在望樓上觀看，看耶和華對我說什麼話。神回答：將這默示明明地寫在版上，使讀的人容易讀；這默示有一定的日期，快要應驗，並不虛謊；雖然遲延，還要等候，必然臨到，不再遲延。迦勒底人自高自大，心不正直，惟義人因信得生。接著是五個禍哉：增添不屬自己的財物、為本家積蓄不義之財在高處搭窩、以人血建城、使人喝醉羞辱他、對木偶說醒起。中間 2:14 說：認識耶和華榮耀的知識要充滿遍地，好像水充滿洋海。最後：惟耶和華在他的聖殿中，全地都當在他面前肅敬靜默。","「站」是這一章的第一個動作：我要站，我要立，我要觀看，先知換了站立的位置，不是得到了答案。「遲延」是人的感覺，「不再遲延」是神的話，兩者並列，沒有互相取消。「信」的原文是可靠、站得穩，不是一個分數；義人在 1:4、1:13 被圍困、被吞滅，在 2:4 得生。五禍是被壓迫者編成的歌，不是咒詛。1:2 的「強暴」在 2:8、2:17 回到審判裡；1:11「以自己的勢力為神」在 2:18–19 有了偶像的畫面。","新約三次引用「義人因信得生」：羅馬書 1:17、加拉太書 3:11、希伯來書 10:38；保羅用它講稱義，希伯來書用它講忍耐。耶穌是第一位完全因信而活的義人，祂在曠野靠神的話，在十字架上把靈交在父手裡。祂說：凡勞苦擔重擔的人，可以到我這裡來（太11:28），給在守望所裡等候的人一個真實的安息。","無己，是放下「我要自己保障自己」的那個窩，放下以他人所有堆自己的手，放下對木偶說「醒起」的倚靠；回到本位，讓神作神，我在祂面前肅敬靜默。有己的人，要在高處搭窩才安心；無己的人，站在守望所，也能因信得生。","「雖然遲延，還要等候；因為必然臨到，不再遲延。迦勒底人自高自大，心不正直；惟義人因信得生。」","這個星期，找一個固定的時間與地方，作你的守望所，每天至少十分鐘，安靜地說：主啊，我站在這裡，等祢對我說話；再找一個正在等候的人，只問「這陣子等得辛苦嗎」，聽他說，不說「快了」。","最終整合：\n先知站在守望所，沒有等到解釋，先換了位置。\n神說：寫下來，雖然遲延，還要等候。\n義人因信得生，不是分數，是倚靠。\n五禍是被壓迫者的歌，先照自己。\n神榮耀的知識要充滿遍地。\n惟耶和華在祂的聖殿中，全地肅敬靜默。\n讓耶穌作王，我在祂面前站好，因信得生。"],"self":"站在守望所的定義：我不先想通才肯等，我先站好；我把答案交給神，把時間交給神；我看見自己的窩、自己的木偶，願意放下，因信倚靠那位活著的神。","t321":{"k":"耶穌是第一位完全因信而活的義人：祂在曠野以神的話勝過試探，在客西馬尼園說「不要照我的意思」，在十字架上把靈魂交給父；祂的信實，成了我們因信得生的根基（哈2:4；太4:4；路23:46）。","g":"讓耶穌作王，就是讓祂坐在我的守望所裡、我的聖殿裡；我不再為自己築高處的窩，不再向木偶說「醒起」，我在祂面前肅敬靜默，等候祂的話（哈2:1、9、19–20）。","p":"屬神的體系，是一群肯站在守望所等候的人，不以他人的所有堆自己，不用羞辱換取優越，不倚靠沒有氣息的偶像；彼此陪伴，在遲延裡仍然因信得生（哈2:3–4、14、20）。"},"grp":["【一、破冰】你最近一次等待一個遲遲不來的結果，是什麼事？等待的那段時間，你每天做些什麼？","【二、扎心】2:1 先知選擇站在守望所。你現在有沒有一個固定的「守望所」？如果沒有，是什麼讓你不容易站好？","【三、經文】2:3「雖然遲延，還要等候」與 2:4「惟義人因信得生」。這兩節怎樣重新定義「等候」與「信」？","【四、福音】耶穌是第一位因信而活的義人。祂的信實，怎樣成了你等候時的力量？","【五、行動】2:18–19 人對木偶說「醒起」。這個星期，你要放下哪一個你指望它「醒來」幫助你的東西？你要把它交給誰？告訴誰？"],"prac":{"main":"站在守望所，因信得生","items":["對神：每天固定一個時間，站著或坐著安靜十分鐘，只說一句：主啊，我在這裡，等祢對我說話。","對自己：寫下一件你正在等候的事，分別寫出「我的感覺是遲延」與「神的話是不再遲延」，兩句並排看。","對人：找一位正在等候的人，問他「這陣子等得辛苦嗎」，聽他說完，不說「快了」，只說「我陪你」。","對生活：這個星期，不替自己多築一個「窩」：一次不佔便宜、一個不用羞辱人換取的玩笑。","對使命：在小組裡預備一個「守望所」的時段，十分鐘安靜，不討論，只在神面前站好。"]},"safe":["① 錯誤講法：把 2:3「雖然遲延，還要等候」講成給受苦者一個時間表，或說「再等一下就好」","正確理解：「遲延」是人的感覺，「不再遲延」是神的話；經文沒有給日期，我們也不替正在等候的人加上時間。","檢驗標準：等候的人聽完，是更有力量等候，還是被催促、被壓力？","② 錯誤講法：把 2:4「因信得生」講成「信心夠大，才有生命」","正確理解：「信」原文是可靠、站得穩，不是一個分數；生命是神給的，信是靠著祂、不離開；信心搖晃的人仍然被神扶住。","檢驗標準：信心軟弱的人聽完，是更得安慰，還是更覺得自己不夠格？","③ 錯誤講法：把 2:4 與羅 1:17、加 3:11、來 10:38 的用法完全等同，忽略哈巴谷書自己的處境","正確理解：新約引用各有重點：保羅講稱義，希伯來書講忍耐；哈巴谷的處境是在遲延與患難中的等候，先聽經文本身，再看新約的連結。","檢驗標準：會眾是先聽見先知對他的回答，還是只得到一個教義名詞？","④ 錯誤講法：把 2:2「使讀的人容易讀」「隨跑隨讀」的兩種譯法，講成其中一種是唯一正確","正確理解：原文可譯為「使跑著的人也能讀」，或「使讀的人跑去傳」；兩種讀法都落在：這份話是要被傳開的。","檢驗標準：會眾是更看見話語要被傳出去，還是更陷在字義的爭論？","⑤ 錯誤講法：把 2:5「因酒詭詐」講成論斷喝酒的人，或當作禁酒的唯一根據","正確理解：這句的讀法在學者間有分歧，有人視為縱慾與貪婪的比喻；經文的重點是迦勒底人貪得無厭，不是針對個別的人。","檢驗標準：會眾是更看見貪得無厭的危險，還是更急著論斷別人的習慣？","⑥ 錯誤講法：把五個「禍哉」當作咒詛的口號，用來咒詛任何人、機構或敵人","正確理解：2:6 說明五禍是被壓迫的人編成的歌；「禍哉」是喪禮的哀歌，我們先拿它照自己，不拿它指著別人。","檢驗標準：會眾是更看見自己的偏差，還是更有一個「可以咒詛的對象」？","⑦ 錯誤講法：把 2:6–8 的第一禍，套到今日某家公司、某個行業或某個政府","正確理解：這是對當時迦勒底帝國以債務、押當與搶奪累積財物的審判，也是一個原則：以他人所有堆自己的，終要回到自己。","檢驗標準：會眾是更誠實地問「我有沒有增添不屬自己的」，還是更熱衷於點名別人？","⑧ 錯誤講法：用 2:9–11 論斷所有有積蓄的人，或責備想保護家人的人","正確理解：禍的對象是「不義之財」與「圖謀剪除多國的民」，不是一般的儲蓄；想保護家人本身不是罪，用不義的方法才是。","檢驗標準：會眾是更誠實地問「我的積蓄怎麼來的」，還是對有資源的人更苛刻？","⑨ 錯誤講法：重述 2:15–16 的羞辱細節、開玩笑，或把它當作談資","正確理解：這一段描寫的是對鄰舍的羞辱與侵犯，經文用含蓄的筆法，我們也不描述細節；先站在受害者一邊。","檢驗標準：曾被羞辱、被侵犯的人聽完，是被保護，還是被再傷害一次？","⑩ 錯誤講法：對曾被羞辱或侵犯的人說「你要原諒」或「是你當時不小心」","正確理解：2:15 的「禍」落在行惡的人身上，不在受害者；復原是一條有同伴、有時間、有專業協助的路，我們不催促。","檢驗標準：受害者聽完，是被相信、被陪伴，還是被催逼、被怪罪？","⑪ 錯誤講法：把 2:14 講成末世時間表，或講成「所以我們不必做什麼，神自己會完成」","正確理解：2:14 是方向，不是日期；神的榮耀要充滿遍地，同時我們今天的每一個誠實、饒恕、不佔便宜，都是這片海的一滴水。","檢驗標準：會眾是更有盼望地行動，還是只剩下等待世界末日的消極？","⑫ 錯誤講法：用 2:18–19 嘲諷其他宗教的信徒，或用 2:20 的「肅敬靜默」要求受苦者不要再說話","正確理解：2:18–19 是對倚靠沒有氣息的東西的警告，也先照自己；2:20 的靜默是神回答之後的敬拜，不是封住受傷者的口。","檢驗標準：會眾是更看見自己的偶像，還是更看輕別人的信仰？受傷的人是更敢開口，還是更不敢？"]},{"n":3,"t":"然而，我要因耶和華歡欣","sub":"禱、顯、歡","lv":"A","arc":"禱告與歡欣","sec":[["3:1--2","禱告：求你在這些年間復興你的作為"],["3:3--7","神從提幔而來：榮光、瘟疫、帳棚戰兢"],["3:8--12","江河、山嶺與日月"],["3:13--15","你出來要拯救你的百姓"],["3:16--16","戰兢，與安靜等候"],["3:17--19","雖然……然而：主耶和華是我的力量"]],"serm":{"pts":[["求你復興","3:1--2","求你在這些年間復興你的作為"],["神的顯現","3:3--15","你出來要拯救你的百姓"],["雖然……然而","3:16--19","然而，我要因耶和華歡欣"]]},"q":"你有沒有一首歌，是只有在最黑的夜晚才唱得出來的？不是在舞台上，是在廚房裡一邊洗碗，或在病房外面，聲音發抖地哼著。哈巴谷書第三章是一首禱告的歌：他先聽見神就懼怕，看見神的顯現，身體戰兢、骨中朽爛，然後才說：雖然無花果樹不發旺，然而，我要因耶和華歡欣。這一章要問：當我什麼都沒有的時候，我的「然而」是對著誰說的？","truth":"先知從聽見神的名聲就懼怕開始禱告，求神在這些年間復興祂的作為，在發怒時以憐憫為念；他看見神從提幔而來、出來拯救祂的百姓；他聽見神的聲音，身體戰兢，骨中朽爛，只能安靜等候。然後他說：雖然無花果樹不發旺，田地不出糧食，然而，我要因耶和華歡欣，因救我的神喜樂；主耶和華是我的力量。","mv":{"t":"然而，我要因耶和華歡欣，因救我的神喜樂。","r":"哈3:18"},"card":["這一章是先知哈巴谷的禱告，調用流離歌。他說：我聽見你的名聲就懼怕，求你在這些年間復興你的作為，在發怒的時候以憐憫為念。神從提幔而來，聖者從巴蘭山臨到，榮光遮蔽諸天，頌讚充滿大地；祂站立，觀看；祂乘馬踐踏江海，出來要拯救自己的百姓。先知聽見就身體戰兢、嘴唇發顫、骨中朽爛，只可安靜等候。然後他說：雖然無花果樹不發旺，田地不出糧食，圈中絕了羊，然而，我要因耶和華歡欣；主耶和華是我的力量，使我的腳快如母鹿的蹄，穩行在高處。","「聽見」把 3:2 與 3:16 連成拱形：聽見名聲就懼怕，聽見聲音就戰兢。「拯救」在 3:8、13、18 一再出現：神的戰車是拯救，祂出來要拯救，祂是救我的神。「歡喜」（gil）在 1:15 是迦勒底人對著網，在 3:18 是先知對著耶和華，同一個字，對象換了。「地」從 1:6 迦勒底人通行遍地，到 3:3 頌讚充滿大地，神通行大地（3:12），2:14 的盼望在異象中被看見。「看」：祂站立，觀看（3:6）。","耶穌在客西馬尼園戰兢流汗，也在十字架上把自己交給父；祂是真正在「雖然」之中說出「然而」的那一位。新約說：神的拯救，在耶穌身上成了人的樣式（腓2:6–8）。保羅在監獄裡說：要靠主常常喜樂（腓4:4）。這個喜樂不建立在果樹的收成上，而建立在救我的神身上；耶穌是這份喜樂的來源與榜樣。","無己，是我的歡喜不再靠無花果樹、田地與羊群，而靠耶和華；是在一無所有的時候，仍然有神。有己的人，歡喜建立在網滿了；無己的人，歡喜建立在網空了，仍有耶和華。無己才能在發抖中誠實，在「雖然」裡說出「然而」，並穩行在高處，不靠自己的腳力。","「然而，我要因耶和華歡欣，因救我的神喜樂。主耶和華是我的力量。」","這個星期，寫下你的「雖然」（目前你缺少或失去的一兩件事），然後在後面寫上你的「然而」，每天大聲對神念一次；再找一位正在發抖的人，陪他坐著，不急著叫他歡欣。","最終整合：\n先知聽見神，就懼怕，就禱告。\n他看見神從曠野而來，出來拯救。\n他的身體戰兢，骨中朽爛，這是被允許的。\n然後，他在一無所有之中說：然而。\n歡喜的對象，從網換成耶和華。\n主耶和華是我的力量，使我穩行在高處。\n讓耶穌作王，我的歡喜，不再靠我所擁有的。"],"self":"說出「然而」的定義：我不跳過戰兢，也不在別人的戰兢上加壓；我誠實說出我的「雖然」，再把我的歡喜，放在耶和華與救我的神身上，而不是放在我所擁有的東西上。","t321":{"k":"耶穌在客西馬尼園戰兢，在十字架上把自己交給父；祂是真正在「雖然」之中說出「然而」的榜樣，祂的順服成了我們可以在一無所有時仍倚靠神的根基（哈3:16–18；路22:44；腓2:8）。","g":"讓耶穌作王，就是讓祂作我的力量，不是我的果樹、田地、羊群；我誠實說出我的戰兢，也把我的歡喜，交在救我的神手裡，讓祂得著一切的榮耀（哈3:18–19）。","p":"屬神的體系，是一群容許彼此說「我在發抖」的人，先陪伴、後安慰，先讓戰兢被聽見，再一起學習在「雖然」裡說出「然而」；不以成功、收成、升遷衡量彼此的信心（哈3:16–19）。"},"grp":["【一、破冰】你有沒有一首只在特別的夜晚才唱得出來的歌？是什麼歌？在什麼樣的時候？","【二、扎心】3:16 先知身體戰兢、骨中朽爛。你最近有沒有一次身體對你說「我怕」？你是怎樣對待那份戰兢的？","【三、經文】3:17–18 先知先說「雖然」，再說「然而」。這個次序怎樣重新定義你對「歡欣」的理解？","【四、福音】耶穌在客西馬尼園戰兢，也把自己交給父。這怎樣使你在自己的戰兢裡，不再感到孤單？","【五、行動】請寫下你的「雖然」與「然而」。這個星期，你要在哪一個「雖然」裡，對神說出你的「然而」？告訴誰？"],"prac":{"main":"誠實說出雖然，真實說出然而","items":["對神：每天用一分鐘，把今天的「雖然」對神說出口，再用一分鐘，說出「然而，我要因耶和華歡欣」。","對自己：身體發出「我怕」的訊號時（睡不著、胃緊、發抖），先承認它，不責備自己「信心不夠」。","對人：找一位正在受苦的人，只陪他坐著，不說「你要歡欣」；他準備好時，再一起讀 3:18。","對生活：這個星期，列出三樣你擁有的「無花果樹」，並為每一樣感謝神；再想一想，如果它們不見了，你的歡喜還在哪裡。","對使命：在小組裡預備一個「我在發抖」的分享時段，不評論、不解決，只是聽。"]},"safe":["① 錯誤講法：把 3:1「流離歌」與 3:19「伶長、絲弦的樂器」講成確定的音樂形式或敬拜儀式的規定","正確理解：這些是音樂與詩篇的術語，意義已難確定；經文的重點是這首禱告被交給伶長，可以被教會一起唱。","檢驗標準：會眾是更看見禱告被眾人一起唱的尊重，還是陷在音樂術語的猜測？","② 錯誤講法：把 3:2「在這些年間復興你的作為」講成神必在特定的年份、特定的事件上顯現","正確理解：經文說「在這些年間」，沒有給日期；先知求的是在他們的時代，神的作為「活過來」，我們不算日子。","檢驗標準：會眾是更仰望神的作為，還是更熱衷於預測？","③ 錯誤講法：把 3:3 提幔、巴蘭山，講成確定的地理考證結論，或拿它推論今日的地點","正確理解：提幔與巴蘭是西奈南北的曠野地名，與申命記 33:2 並讀，是以色列出埃及的記憶；先知用舊記憶描寫神的來臨。","檢驗標準：會眾是更看見神過去的作為成為今日的記憶，還是更陷在地名的考證？","④ 錯誤講法：用 3:3–15 的戰爭、瘟疫、山崩，為任何戰爭、暴力或報復辯護","正確理解：這一段行動的主語是神，不是人；它描寫神的主權與威嚴，沒有給任何人拿起暴力的授權。","檢驗標準：會眾是更敬畏神，還是更覺得可以替神動手？","⑤ 錯誤講法：把 3:3–15 的畫面套到今日某個國家、某場戰事或某個災難","正確理解：這是詩歌式的異象，描寫神在歷史中的主權；我們不用它去對照新聞，也不替任何政治立場背書。","檢驗標準：會眾是更看見神的主權，還是更熱衷於用經文解讀新聞？","⑥ 錯誤講法：把 3:13「受膏者」只講成某一個確定的人，或排斥其他讀法","正確理解：「受膏者」可指君王、百姓，或將來的彌賽亞；新約以耶穌為神的受膏者，這是新約自己的連結；本章先照文字讀。","檢驗標準：會眾是更看見神拯救的心，還是更陷在身分的爭論？","⑦ 錯誤講法：把 3:13「打破惡人家長的頭」講成信徒也可以或應該這樣對待惡人","正確理解：這是神對惡的審判的詩歌畫面，主語是神；信徒的呼召是愛仇敵、為逼迫我們的人禱告，不是動手報復。","檢驗標準：會眾是更願意交給神，還是更想自己動手？","⑧ 錯誤講法：對曾被暴力傷害的人，用 3:13、3:14 的畫面要求他立刻同意或歡喜","正確理解：先站在受傷者一邊，神的眼睛先看見被吞吃的貧民；不催促任何人為這些畫面歡喜，也不要求同意。","檢驗標準：受傷的人聽完，是被擁抱，還是被催逼？","⑨ 錯誤講法：跳過 3:16 的戰兢，直接跳到 3:18「要歡欣」","正確理解：先有戰兢，才有然而；3:16 的身體反應是被經文承認的，沒有被聽見的戰兢，會使後面的歡欣變得很輕。","檢驗標準：正在發抖的人聽完，是被允許，還是被要求立刻變好？","⑩ 錯誤講法：對正在受苦的人說「你要歡欣！」把 3:18 當作命令或壓力","正確理解：3:18 是先知在走過戰兢之後的選擇，不是對受苦者的要求；沒有時間表，也沒有速度。","檢驗標準：受苦的人聽完，是得著陪伴，還是得著一個要把情緒調整好的任務？","⑪ 錯誤講法：把 3:19「穩行在高處」講成成功神學，說會升遷、得勝、變得富有","正確理解：這節說的是在險峻的地方，我的腳不會滑，因為神是我的力量；它不承諾地位、財富或成功。","檢驗標準：會眾是更倚靠神，還是更追逐成就？","⑫ 錯誤講法：用 3:17–18「雖然……然而」暗示「失去一切仍要快樂」是信徒的標準，指責難過的人","正確理解：先知先承認失去，再說然而；他的「然而」站在缺乏的旁邊，沒有否認缺乏；難過、流淚都是被允許的。","檢驗標準：難過的人聽完，是更敢誠實，還是更要假裝？"]}],"txt":{"1":["先知哈巴谷所得的默示。","他說：耶和華啊！我呼求你，你不應允，要到幾時呢？我因強暴哀求你，你還不拯救。","你為何使我看見罪孽？你為何看著奸惡而不理呢？毀滅和強暴在我面前，又起了爭端和相鬥的事。","因此律法放鬆，公理也不顯明；惡人圍困義人，所以公理顯然顛倒。","耶和華說：你們要向列國中觀看，大大驚奇；因為在你們的時候，我行一件事，雖有人告訴你們，你們總是不信。","我必興起迦勒底人，就是那殘忍暴躁之民，通行遍地，佔據那不屬自己的住處。","他威武可畏，判斷和勢力都任意發出。","他的馬比豹更快，比晚上的豺狼更猛。馬兵踴躍爭先，都從遠方而來；他們飛跑如鷹抓食，","都為行強暴而來，定住臉面向前，將擄掠的人聚集，多如塵沙。","他們譏誚君王，笑話首領，嗤笑一切保障，築壘攻取。","他以自己的勢力為神，像風猛然掃過，顯為有罪。","耶和華－我的神，我的聖者啊，你不是從亙古而有嗎？我們必不致死。耶和華啊，你派定他為要刑罰人；磐石啊，你設立他為要懲治人。","你眼目清潔，不看邪僻，不看奸惡；行詭詐的，你為何看著不理呢？惡人吞滅比自己公義的，你為何靜默不語呢？","你為何使人如海中的魚，又如沒有管轄的爬物呢？","他用鉤鉤住，用網捕獲，用拉網聚集他們；因此，他歡喜快樂，","就向網獻祭，向網燒香，因他由此得肥美的分和富裕的食物。","他豈可屢次倒空網羅，將列國的人時常殺戮，毫不顧惜呢？"],"2":["我要站在守望所，立在望樓上觀看，看耶和華對我說什麼話，我可用什麼話向他訴冤〔向他訴冤：或譯回答所疑問的〕。","他對我說：將這默示明明地寫在版上，使讀的人容易讀〔或譯：隨跑隨讀〕。","因為這默示有一定的日期，快要應驗，並不虛謊。雖然遲延，還要等候；因為必然臨到，不再遲延。","迦勒底人自高自大，心不正直；惟義人因信得生。","迦勒底人因酒詭詐，狂傲，不住在家中，擴充心欲，好像陰間。他如死不能知足，聚集萬國，堆積萬民都歸自己。","這些國的民豈不都要提起詩歌並俗語譏刺他說：禍哉！迦勒底人，你增添不屬自己的財物，多多取人的當頭，要到幾時為止呢？","咬傷你的豈不忽然起來，擾害你的豈不興起，你就作他們的擄物嗎？","因你搶奪許多的國，殺人流血，向國內的城並城中一切居民施行強暴，所以各國剩下的民都必搶奪你。","為本家積蓄不義之財、在高處搭窩、指望免災的有禍了！","你圖謀剪除多國的民，犯了罪，使你的家蒙羞，自害己命。","牆裡的石頭必呼叫；房內的棟樑必應聲。","以人血建城、以罪孽立邑的有禍了！","眾民所勞碌得來的被火焚燒，列國由勞乏而得的歸於虛空，不都是出於萬軍之耶和華嗎？","認識耶和華榮耀的知識要充滿遍地，好像水充滿洋海一般。","給人酒喝、又加上毒物、使他喝醉、好看見他下體的有禍了！","你滿受羞辱，不得榮耀；你也喝吧，顯出是未受割禮的！耶和華右手的杯必傳到你那裡；你的榮耀就變為大大地羞辱。","你向黎巴嫩行強暴與殘害驚嚇野獸的事必遮蓋你；因你殺人流血，向國內的城並城中一切居民施行強暴。","雕刻的偶像，人將它刻出來，有什麼益處呢？鑄造的偶像就是虛謊的師傅。製造者倚靠這啞巴偶像有什麼益處呢？","對木偶說：醒起！對啞巴石像說：起來！那人有禍了！這個還能教訓人嗎？看哪，是包裹金銀的，其中毫無氣息。","惟耶和華在他的聖殿中；全地的人都當在他面前肅敬靜默。"],"3":["先知哈巴谷的禱告，調用流離歌。","耶和華啊，我聽見你的名聲〔或譯：言語〕就懼怕。耶和華啊，求你在這些年間復興你的作為，在這些年間顯明出來；在發怒的時候以憐憫為念。","神從提幔而來；聖者從巴蘭山臨到。（細拉）他的榮光遮蔽諸天；頌讚充滿大地。","他的輝煌如同日光；從他手裡射出光線，在其中藏著他的能力。","在他前面有瘟疫流行；在他腳下有熱症發出。","他站立，量了大地〔或譯：使地震動〕，觀看，趕散萬民。永久的山崩裂；長存的嶺塌陷；他的作為與古時一樣。","我見古珊的帳棚遭難，米甸的幔子戰兢。","耶和華啊，你乘在馬上，坐在得勝的車上，豈是不喜悅江河、向江河發怒氣、向洋海發憤恨嗎？","你的弓全然顯露，向眾支派所起的誓都是可信的。（細拉）你以江河分開大地。","山嶺見你，無不戰懼；大水氾濫過去，深淵發聲，洶湧翻騰〔原文是向上舉手〕。","因你的箭射出發光，你的槍閃出光耀，日月都在本宮停住。","你發忿恨通行大地，發怒氣責打列國，如同打糧。","你出來要拯救你的百姓，拯救你的受膏者，打破惡人家長的頭，露出他的腳〔原文是根基〕，直到頸項。（細拉）","你用敵人的戈矛刺透他戰士的頭；他們來如旋風，要將我們分散。他們所喜愛的是暗中吞吃貧民。","你乘馬踐踏紅海，就是踐踏洶湧的大水。","我聽見耶和華的聲音，身體戰兢，嘴唇發顫，骨中朽爛；我在所立之處戰兢。我只可安靜等候災難之日臨到，犯境之民上來。","雖然無花果樹不發旺，葡萄樹不結果，橄欖樹也不效力，田地不出糧食，圈中絕了羊，棚內也沒有牛；","然而，我要因耶和華歡欣，因救我的神喜樂。","主耶和華是我的力量；他使我的腳快如母鹿的蹄，又使我穩行在高處。這歌交與伶長，用絲弦的樂器。"]},"blk":{"1":[{"a":1,"z":1,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הַמַּשָׂא אֲשֶׁר חָזָה חֲבַקּוּק הַנָּבִֽיא׃<\/p><\/blockquote>","lit":"<blockquote><p>「先知哈巴谷所得的默示。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>默示<\/td><td>הַמַּשָׂא<\/td><td>hamasa<\/td><td>H4853<\/td><td>擔子、重負；引申為神所託付、沉甸甸的神諭<\/td><\/tr><tr><td>得見<\/td><td>חָזָה<\/td><td>khazah<\/td><td>H2372<\/td><td>看見、得見異象<\/td><\/tr><tr><td>哈巴谷<\/td><td>חֲבַקּוּק<\/td><td>khavaqquq<\/td><td>H2265<\/td><td>哈巴谷（先知之名，字根與「擁抱」同源）<\/td><\/tr><tr><td>先知<\/td><td>הַנָּבִיא<\/td><td>hanavi<\/td><td>H5030<\/td><td>先知、替神說話的人<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>默示<\/strong>：原文 massa，字根是「舉起、扛起」（nasa），名詞形有「擔子、重負」的意思，也用來指「神諭」。這個字用在哈巴谷書、那鴻書、瑪拉基書的書名上，暗示這是一份先知必須扛起來的話。和合本譯作「默示」，意思沒有錯；只是讀者不要忘了，它帶著重量。<\/p><p><strong>得見<\/strong>：原文 khazah，是「看見」。同一節一個「擔子」、一個「看見」並排，先知把話當作自己眼睛所見、肩膀所扛的東西。<\/p><p><strong>哈巴谷<\/strong>：名字的來源不確定，常見說法是與「擁抱」（khavaq）同源；至於這個名字是否帶有「擁抱」的意思、是否可以拿來作講道的文字遊戲，學者之間沒有定論。本講義只把它當作一個人名，不以它立論。<\/p>","exp":"<p>整卷書只有一節，是它的書名。<strong>這一節沒有說王的名字，沒有說年代，也沒有說他是哪一個城的人。<\/strong>其他先知書的開頭，大多會告訴我們「在某王的日子」；哈巴谷書沒有。我們只知道一件事：這是「先知哈巴谷所得的默示」。<\/p><p>這是一個很特別的安靜。讀者一翻開，沒有時間，沒有地點，沒有聽眾名單，只有一個名字與一個身分。<strong>這份缺席本身是一種邀請：誰在受苦，誰就可以站在這個位置。<\/strong>一個人若在心裡問過「神啊，祢在哪裡」，翻到這一卷，會發現先知早就等在那裡了。<\/p><p>「默示」這個字，原文有「擔子」的意思。哈巴谷所得的，不是一份輕鬆的資訊，是一個壓在肩上的重量。他不是旁觀者，他是被這個問題壓住的人。我們讀下去會看見：這一卷與其他先知書不同，大部分的時候不是先知對百姓說話，而是先知對神說話；他把自己的重擔，一整個放到神的面前。<\/p><p>關於寫作年代，我們不替經文補上它沒有給的資料。從第一章神說要興起迦勒底人看，大致落在猶大國被巴比倫勢力逼近的年代；至於精確的年份，本講義不下結論，也不拿它來算任何日子。我們只要記得：<strong>一個沒有年代的書名，讓這個問題成為每一代受苦之人的問題。<\/strong><\/p><p><strong>對一個正在受苦的人來說，這一節還有另一層意思。<\/strong>先知被稱為「先知」，是因為神的話臨到他；但在這一卷裡，我們會看見他更像一個「守望的人」與「禱告的人」。他不是站在高處宣告別人，而是先站在問題裡，扛著問題。能這樣扛著重擔的人，才有資格帶著重擔去聽神的回答。這是整卷書的路線：先扛，再問，再等，再歡欣。<\/p><p>我們也提醒自己：一個沒有時間、沒有地點的書名，不容許我們把它變成日期的猜謎。有人想從「迦勒底人」推算全書的寫作年代，這是學者之間的討論；對牧養而言，更要緊的是這份重擔被神收進了聖經，成了每一代人可以拿來禱告的話。<\/p><p>讀這一節時，也請留意它的<strong>簡短<\/strong>。一節經文，只有十來個字，卻把全卷書的姿態先說完了：這是一份被扛起來的話，是被看見的事，由一位名叫哈巴谷的先知所得。沒有誇耀，沒有鋪陳。神有時就是用這樣安靜的開場，讓人的心先靜下來，預備好聽一段不太容易聽的話。<\/p>"},{"a":2,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַד־אָנָה יְהוָה שִׁוַּעְתִּי וְלֹא תִשְׁמָע אֶזְעַק אֵלֶיךָ חָמָס וְלֹא תוֹשִֽׁיעַ׃ לָמָּה תַרְאֵנִי אָוֶן וְעָמָל תַּבִּיט וְשֹׁד וְחָמָס לְנֶגְדִּי וַיְהִי רִיב וּמָדוֹן יִשָּֽׂא׃ עַל־כֵּן תָּפוּג תּוֹרָה וְלֹֽא־יֵצֵא לָנֶצַח מִשְׁפָּט כִּי רָשָׁע מַכְתִּיר אֶת־הַצַּדִּיק עַל־כֵּן יֵצֵא מִשְׁפָּט מְעֻקָּֽל׃<\/p><\/blockquote>","lit":"<blockquote><p>「他說：耶和華啊！我呼求你，你不應允，要到幾時呢？我因強暴哀求你，你還不拯救。你為何使我看見罪孽？你為何看著奸惡而不理呢？毀滅和強暴在我面前，又起了爭端和相鬥的事。因此律法放鬆，公理也不顯明；惡人圍困義人，所以公理顯然顛倒。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>到幾時<\/td><td>עַד־אָנָה<\/td><td>ad-anah<\/td><td>H575<\/td><td>到什麼時候；「幾時」的哀歌式問法<\/td><\/tr><tr><td>呼求<\/td><td>שִׁוַּעְתִּי<\/td><td>shivvati<\/td><td>H7768<\/td><td>呼救、求助（急迫的喊叫）<\/td><\/tr><tr><td>哀求<\/td><td>אֶזְעַק<\/td><td>ez'aq<\/td><td>H2199<\/td><td>喊叫、呼喊（受冤屈者的呼喊）<\/td><\/tr><tr><td>強暴<\/td><td>חָמָס<\/td><td>khamas<\/td><td>H2555<\/td><td>強暴、殘暴、不義的暴力<\/td><\/tr><tr><td>罪孽<\/td><td>אָוֶן<\/td><td>aven<\/td><td>H205<\/td><td>罪孽、虛妄、造成傷害的惡<\/td><\/tr><tr><td>律法<\/td><td>תּוֹרָה<\/td><td>torah<\/td><td>H8451<\/td><td>律法、教導<\/td><\/tr><tr><td>公理<\/td><td>מִשְׁפָּט<\/td><td>mishpat<\/td><td>H4941<\/td><td>公理、公義、審判<\/td><\/tr><tr><td>顛倒<\/td><td>מְעֻקָּל<\/td><td>me'uqqal<\/td><td>H6127<\/td><td>彎曲、扭曲<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>到幾時<\/strong>：原文 ad-anah，是「直到哪裡」的意思，是詩篇裡常見的哀歌問法（詩13:1–2、詩74:10、詩80:4）。哈巴谷書一開口就用這個格式，等於告訴讀者：這是一個合乎聖經傳統的質問，不是離經叛道的埋怨。<\/p><p><strong>呼求、哀求<\/strong>：兩個動詞，shiwwa 與 za'aq。前者有「喊救命」的意思，後者常用在受冤屈、受欺壓的人的喊叫（創4:10 亞伯的血「呼訴」用的也是這個字根）。先知用了兩個字，是把自己的聲音一層一層加重。<\/p><p><strong>強暴<\/strong>：khamas，是全卷追蹤的字，全卷 6 次。它不只是肢體的暴力，也包括一切不公正的、傷害人的行徑。先知哀求的第一個內容，就是這個字。<\/p><p><strong>罪孽<\/strong>：aven 一般指造成傷害的惡；<strong>奸惡<\/strong>（1:3）原文是 amal，常譯作「勞苦、困苦」，這裡指受害者所承受的苦楚。和合本把兩個詞譯成「罪孽」「奸惡」，讀者要留意：先知看到的，同時是作惡的人與被惡傷害的人。<\/p><p><strong>律法放鬆<\/strong>：原文 tafug torah，動詞 pug 本義是「麻木、發冷、癱軟」。不是律法被廢掉，是律法失去了力量，像手腳發麻的人，不能動。<\/p><p><strong>惡人圍困義人<\/strong>：圍困（makhtir）有「環繞、圍住」的意思，是形容惡人把義人團團圍住。<strong>公理顛倒<\/strong>：me'uqqal 是「彎曲的」，像一條被扭彎的直線。公理本來應該走直路，現在走彎了。<\/p><p>1:3 的「看」有兩個不同的字：「使我看見」（ra'ah）與「看著奸惡」（nabat）。前者是眼睛被迫接收，後者是定睛觀看。先知的抱怨是：我被迫看見，祢卻定睛看著而不動手。<\/p>","exp":"<p>先知第一次開口，一句話就是五個字：到幾時呢。<strong>這是一個沒有學術包裝的問題，是一個人把禱告貼著地面喊出來的聲音。<\/strong>他沒有先寫三段頌讚，沒有先說「我知道祢的旨意是美好的」，他直接說：耶和華啊，我呼求祢，祢不應允；我因強暴哀求祢，祢還不拯救。<\/p><p>請留意：他是在「呼求」，不是在「離開」。他的話是對著耶和華說的，不是對著人，也不是對著空氣。<strong>最會質問神的人，往往是還沒有離開神的人；真正離開的人，已經不再問了。<\/strong>先知的質問，本身就是信心還在的證據。<\/p><p>然後是第 3 節：「你為何使我看見罪孽？」這句話很重。先知的痛苦不在於他遭了什麼，而在於<strong>他被迫看見<\/strong>。有些痛苦，是看見的痛苦：看見身邊的人受欺壓，看見公平被踩在腳下，看見一個本來可以拯救的人沒有動手。他說，毀滅和強暴就在我面前，爭端和相鬥不斷地興起。<\/p><p>第 4 節把這個景象推到制度的層次：律法放鬆，公理不顯明；惡人圍困義人，公理顯然顛倒。<strong>不是只有幾個壞人，是整個應該扶住人的東西——律法、公理——都軟掉了。<\/strong>惡人不只欺負義人，是把義人圍起來；公理不只被忽略，是被彎成另一個形狀。<\/p><p>這一段的牧養意義在這裡：<strong>神的話容許一個受苦的人這樣開口。<\/strong>先知的問題被寫進正典，放在書的最前面，沒有被修剪，也沒有被糾正。這是神給受苦的人的第一個安慰：祢可以這樣問。我們不替先知加上他沒有說的話，也不急著替神解釋。我們先停在他的旁邊，聽他把話說完。<\/p><p>也要留意這段的邊界。先知的質問是禱告，不是教我們以怨恨對待神；他的哀求，是對著神，不是對著鄰舍。我們不拿這一段去鼓勵人憤怒，也不拿它去責備不敢開口的人。有人連問都問不出來，只能沉默地坐著；神也聽得見沒有聲音的呼求。<\/p><p>還有一點要補上：<strong>先知所用的「到幾時」，是整本詩篇裡最常見的哀歌問句。<\/strong>他沒有發明一種新的禱告，他只是把古老的哀歌，用在一個具體的時代裡。這提醒我們：受苦時不必自己創作禱告，聖經早就給了我們可以開口的話。把詩篇十三篇讀一遍，再回頭讀 1:2–4，會發現兩者幾乎是同一種呼吸。<\/p><p>最後，請留意先知沒有說的話。他沒有說「神啊，祢不存在」，也沒有說「我要自己動手」。他只是說：我呼求，祢不應允。<strong>他的信仰還在，他的痛苦也在，兩者同時被寫在同一節經文裡。<\/strong>一個成熟的信徒，不是已經沒有痛苦的人，而是能把痛苦帶到神面前、不肯離開的人。<\/p>"},{"a":5,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>רְאוּ בַגּוֹיִם וְֽהַבִּיטוּ וְהִֽתַּמְּהוּ תְּמָהוּ כִּי־פֹעַל פֹּעֵל בִּֽימֵיכֶם לֹא תַאֲמִינוּ כִּי יְסֻפָּֽר׃ כִּֽי־הִנְנִי מֵקִים אֶת־הַכַּשְׂדִּים הַגּוֹי הַמַּר וְהַנִּמְהָר הַֽהוֹלֵךְ לְמֶרְחֲבֵי־אֶרֶץ לָרֶשֶׁת מִשְׁכָּנוֹת לֹּא־לֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華說：你們要向列國中觀看，大大驚奇；因為在你們的時候，我行一件事，雖有人告訴你們，你們總是不信。我必興起迦勒底人，就是那殘忍暴躁之民，通行遍地，佔據那不屬自己的住處。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>觀看<\/td><td>רְאוּ<\/td><td>re'u<\/td><td>H7200<\/td><td>看見、看<\/td><\/tr><tr><td>列國<\/td><td>בַגּוֹיִם<\/td><td>vagoyim<\/td><td>H1471<\/td><td>列國、外邦人<\/td><\/tr><tr><td>驚奇<\/td><td>הִתַּמְּהוּ<\/td><td>hittamme'hu<\/td><td>H8539<\/td><td>驚訝、驚愕得發呆<\/td><\/tr><tr><td>我行一件事<\/td><td>פֹעַל פֹּעֵל<\/td><td>po'al po'el<\/td><td>H6467<\/td><td>一件作為，我正在作<\/td><\/tr><tr><td>不信<\/td><td>תַאֲמִינוּ<\/td><td>ta'aminu<\/td><td>H539<\/td><td>信、信靠（使役式：相信、以為可靠）<\/td><\/tr><tr><td>迦勒底人<\/td><td>הַכַּשְׂדִּים<\/td><td>hakasdim<\/td><td>H3778<\/td><td>迦勒底人（巴比倫人）<\/td><\/tr><tr><td>殘忍<\/td><td>הַמַּר<\/td><td>hammar<\/td><td>H4751<\/td><td>苦的、兇猛的<\/td><\/tr><tr><td>遍地<\/td><td>אֶרֶץ<\/td><td>eretz<\/td><td>H776<\/td><td>地、大地<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>觀看<\/strong>：1:5 的「觀看」連用兩個字：ra'ah（看見）與 nabat（定睛看），與先知在 1:3 的兩個「看」同一組字根。先知在 1:3 說：我被迫看見罪孽，你定睛看著卻不動；神在 1:5 說：你們也來看，向列國中看。<strong>神把先知的「看」接了過去，換了方向。<\/strong><\/p><p><strong>列國<\/strong>：原文 bagoyim。這裡有一個文本問題：徒 13:41 引用這一節，把「列國」換成「你們這輕慢的人」，因為古老的希臘文譯本與死海古卷的注釋，在這裡讀的是「背信的人」（bogedim）一類的詞。這是字母相近而發生的差異。和合本跟隨希伯來文瑪所拉本讀「列國」。我們在議題裡再談。<\/p><p><strong>驚奇<\/strong>：hittamme'hu temahu，兩個同根的動詞連用，意思是「驚訝到發呆」，像是說：你們要驚訝，真的驚訝。<\/p><p><strong>我行一件事<\/strong>：po'al po'el，名詞與分詞同根，「作為，我正在作為」。這樣的重疊在希伯來文裡有加強的語氣。<\/p><p><strong>迦勒底人<\/strong>：kasdim，指新巴比倫帝國的統治族群。<strong>殘忍<\/strong>（mar，本義是「苦」）與<strong>暴躁<\/strong>（nimhar，本義是「急速」）描寫他們性情兇猛、行動迅速。<strong>通行遍地<\/strong>：le-merkhavei eretz 是「走向地的廣闊處」，帶著佔領、擴張的意味。<\/p>","exp":"<p>先知問完，神回答了。<strong>祂的第一句回答，不是解釋，是一個命令：你們要看。<\/strong>神沒有從先知問的地方開始回答；祂把先知的眼睛轉向另一個方向：向列國中觀看，大大驚奇。<\/p><p>這個方向很重要。先知一直在看自己面前的暴力與不公，他被這些畫面釘住了。神說：抬起頭來，看看更大的地方。<strong>祂不是否認先知看到的痛苦，而是說：還有一些你沒有看見的事，正在發生。<\/strong>「我行一件事」，原文是同根的兩個字疊在一起：作為，我正在作。神沒有在睡覺，也沒有在袖手旁觀。祂說，在你們的時候，祂已經在動工。<\/p><p>然後是那一句非常難的話：「雖有人告訴你們，你們總是不信。」神預先知道這個答案會讓人難以接受。<strong>祂所說的「我行一件事」，不是先知所盼望的那件事。<\/strong>先知盼望的是一個拯救：停止強暴，挽回公理。神說的是第 6 節：我必興起迦勒底人。<\/p><p>這個回答幾乎讓人說不出話來。先知為猶大國內的暴力與不公哀求，神說：我要用一個更兇猛的國，來臨到你們。神的回答，比先知的問題更大，也更難。<\/p><p>請不要太快替神解釋。這一段要慢慢讀，並且讀出三件事：第一，神真的聽見了，祂有回答；第二，神的回答不一定是我們要的那一種；第三，神說祂的作為是「你們不信」的，這句話本身就告訴我們，神知道自己的做法會令人難以承受。<\/p><p>也要記住本卷的界線：迦勒底人是當時的一個帝國，是神在那個歷史時刻所用的工具。<strong>我們不把他們對應到今天任何一個國家、民族或政權，也不拿這段經文去為任何戰爭或暴力辯護。<\/strong>經文說的是神在歷史中的主權，不是替人間的強權背書。<\/p><p>讓我們再停一下，想想「你們總是不信」這句話。這句話不是責備先知，它是神對整個時代說的：神所做的，往往超過人所能預料的方式。<strong>神不是不回答，而是祂的回答，常常需要我們先換一個位置，才聽得懂。<\/strong>先知在下一章會被叫去站在守望所，就是在學習這個功課。<\/p><p>牧養上，這一段給正在等候的人一個很實在的提醒：<strong>神的沉默，不等於神不動工。<\/strong>祂說「我行一件事」，那是一個正在進行的動詞。我們不知道祂用什麼方式、什麼時候完成，但我們可以抓住一件事：祂不是缺席的。這不是要人壓抑痛苦，而是要人在痛苦中，仍然抬起頭來。<\/p>"},{"a":7,"z":11,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>אָיֹם וְנוֹרָא הוּא מִמֶּנּוּ מִשְׁפָּטוֹ וּשְׂאֵתוֹ יֵצֵֽא׃ וְקַלּוּ מִנְּמֵרִים סוּסָיו וְחַדּוּ מִזְּאֵבֵי עֶרֶב וּפָשׁוּ פָּֽרָשָׁיו וּפָֽרָשָׁיו מֵרָחוֹק יָבֹאוּ יָעֻפוּ כְּנֶשֶׁר חָשׁ לֶאֱכֽוֹל׃ כֻּלֹּה לְחָמָס יָבוֹא מְגַמַּת פְּנֵיהֶם קָדִימָה וַיֶּאֱסֹף כַּחוֹל שֶֽׁבִי׃ וְהוּא בַּמְּלָכִים יִתְקַלָּס וְרֹזְנִים מִשְׂחָק לוֹ הוּא לְכָל־מִבְצָר יִשְׂחָק וַיִּצְבֹּר עָפָר וַֽיִּלְכְּדָֽהּ׃ אָז חָלַף רוּחַ וַֽיַּעֲבֹר וְאָשֵׁם זוּ כֹחוֹ לֵאלֹהֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「他威武可畏，判斷和勢力都任意發出。他的馬比豹更快，比晚上的豺狼更猛。馬兵踴躍爭先，都從遠方而來；他們飛跑如鷹抓食，都為行強暴而來，定住臉面向前，將擄掠的人聚集，多如塵沙。他們譏誚君王，笑話首領，嗤笑一切保障，築壘攻取。他以自己的勢力為神，像風猛然掃過，顯為有罪。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>可畏<\/td><td>אָיֹם<\/td><td>ayom<\/td><td>H366<\/td><td>令人驚懼的<\/td><\/tr><tr><td>勢力<\/td><td>כֹחוֹ<\/td><td>kokho<\/td><td>H3581<\/td><td>他的力量、實力<\/td><\/tr><tr><td>快<\/td><td>וְקַלּוּ<\/td><td>veqallu<\/td><td>H7043<\/td><td>輕快、敏捷<\/td><\/tr><tr><td>強暴<\/td><td>לְחָמָס<\/td><td>lekhamas<\/td><td>H2555<\/td><td>為了強暴<\/td><\/tr><tr><td>擄掠的人<\/td><td>שֶׁבִי<\/td><td>shevi<\/td><td>H7628<\/td><td>被擄的人、俘虜<\/td><\/tr><tr><td>保障<\/td><td>מִבְצָר<\/td><td>mivtsar<\/td><td>H4013<\/td><td>要塞、堡壘<\/td><\/tr><tr><td>風<\/td><td>רוּחַ<\/td><td>ruakh<\/td><td>H7307<\/td><td>風、靈、氣<\/td><\/tr><tr><td>有罪<\/td><td>וְאָשֵׁם<\/td><td>ve'ashem<\/td><td>H816<\/td><td>有罪、擔罪<\/td><\/tr><tr><td>神<\/td><td>לֵאלֹהוֹ<\/td><td>leeloho<\/td><td>H430<\/td><td>他的神<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>威武可畏<\/strong>：原文 ayom venora，兩個形容詞，「令人驚懼，令人畏懼」。這兩個字平常用在神身上，用來形容神的威嚴；這裡用在迦勒底人身上，是先知有意的對比：他們看起來像神一樣可怕。<\/p><p><strong>判斷和勢力都任意發出<\/strong>：原文 mimmennu mishpato use'eto yetse'，字面是「他的判斷與他的尊嚴，是從他自己出來的」。重點是「從他自己」：他不問誰，不向誰交代，法律與尊榮都是他自己訂的。<\/p><p><strong>豹、豺狼（晚上的）、鷹<\/strong>：1:8 三個動物比喻，快、猛、俯衝。「晚上的豺狼」中的 erev 也有人讀為「曠野」（arava），意思是「曠野的狼」；兩種讀法都能通，不影響整體意思。<\/p><p><strong>定住臉面向前<\/strong>：megammat penehem qadimah，其中 megammat 在舊約只出現這一次，字義不確定；qadimah 可以指「向東」或「向前」。和合本取「向前」，是一種合理的譯法；各家有不同的看法，這裡不把任何一種說死。<\/p><p><strong>築壘攻取<\/strong>：原文 vayyitsbor afar，「堆積塵土」，指築起攻城的土堆。<strong>像風猛然掃過<\/strong>：az khalaf ruakh，也有學者把 ruakh 解為「他的心思／氣」，讀作「他的心高昂，越過界線」。這是 1:11 最難的一句，各家譯法差異很大。<strong>顯為有罪<\/strong>：ve'ashem，「他便擔了罪」；<strong>以自己的勢力為神<\/strong>：zu kokho le'eloho，「這就是他的力量，他的神」。<\/p>","exp":"<p>這五節是一幅畫像：神回答之後，用五節的篇幅，把迦勒底人描寫得鉅細靡遺。<strong>神不是替他們說好話，是把他們的樣子，原原本本放在先知眼前。<\/strong>他們威武可畏；馬比豹快，比晚上的豺狼猛；馬兵從遠方飛奔而來，像老鷹俯衝抓食。<\/p><p>請留意這幾節最後落在哪裡。第 9 節說，他們「都為行強暴而來」。<strong>這是整卷書最重要的一個回聲：先知在 1:2 哀求神救他脫離「強暴」，神在 1:9 說，迦勒底人「為強暴而來」。<\/strong>同一個字，先知的呼求與神的回答，緊緊扣在一起。先知喊的那個字，成了神說的那個字。這不是巧合，是一個正在展開的故事：神知道先知在為什麼哭，祂的回答，並沒有離開那個字。<\/p><p>第 10 節說，他們譏誚君王，笑話首領，嗤笑一切保障，築起土堆就攻取。他們不把任何人放在眼裡，沒有一道牆擋得住他們。這是一個不尊重任何權威、也不接受任何限制的力量。<\/p><p>然後是第 11 節，這一段的心臟：<strong>他以自己的勢力為神。<\/strong>和合本的這一句，把這個帝國的問題說穿了。他的可畏不只在於他的馬快、他的兵多，而在於他把自己的力量當作神。這是舊約最深的一個罪名：把神的位置，放給自己。<\/p><p>讀到這裡，我們會不自覺地鬆一口氣：原來神也看見他們的罪。但請留意，這句話同時是對我們說的。<strong>以自己的勢力為神，不只是帝國的罪，也是每一個握著權力的人的試探：職位、金錢、人脈、能力。<\/strong>我們不把這一節當作一面指向外人的鏡子，我們先把它舉到自己面前。<\/p><p>最後一句，原文說他「擔了罪」或「顯為有罪」。神把迦勒底人興起來作工具，並沒有因此免除他們自己的責任。神可以使用一個人，也仍然審判那個人。這個張力，哈巴谷書後面還要繼續處理。<\/p><p>再看一次這一段的結構：先是迦勒底人的速度（1:8），再是他們的目的（1:9），再是他們的態度（1:10），最後落在他們的心（1:11）。<strong>從馬到心，經文一路往內走。<\/strong>外面的威風，最後都指向裡面的問題：他把什麼放在神的位置上。這個順序提醒我們，判斷一個人或一個系統，不要只看它多強大，要看它最後敬拜什麼。<\/p><p>這一段也讓我們看見神的公平：祂不是只審判猶大，祂也沒有放過自己所使用的工具。<strong>祂可以使用一個人，卻不替那個人的罪辯護。<\/strong>這是舊約裡反覆出現的真理，在以賽亞書 10 章也有類似的說法：神用亞述作杖，也要審判亞述自己。我們在這裡只先記住：神的主權與人的責任，經文同時承認，不替我們拿掉任何一邊。<\/p>"},{"a":12,"z":13,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲלוֹא אַתָּה מִקֶּדֶם יְהוָה אֱלֹהַי קְדֹשִׁי לֹא נָמוּת יְהוָה לְמִשְׁפָּט שַׂמְתּוֹ וְצוּר לְהוֹכִיחַ יְסַדְתּֽוֹ׃ טְהוֹר עֵינַיִם מֵרְאוֹת רָע וְהַבִּיט אֶל־עָמָל לֹא תוּכָל לָמָּה תַבִּיט בּֽוֹגְדִים תַּחֲרִישׁ בְּבַלַּע רָשָׁע צַדִּיק מִמֶּֽנּוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華－我的神，我的聖者啊，你不是從亙古而有嗎？我們必不致死。耶和華啊，你派定他為要刑罰人；磐石啊，你設立他為要懲治人。你眼目清潔，不看邪僻，不看奸惡；行詭詐的，你為何看著不理呢？惡人吞滅比自己公義的，你為何靜默不語呢？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>亙古<\/td><td>מִקֶּדֶם<\/td><td>miqqedem<\/td><td>H6924<\/td><td>從古時、從太初<\/td><\/tr><tr><td>聖者<\/td><td>קְדֹשִׁי<\/td><td>qedoshi<\/td><td>H6918<\/td><td>我的聖者、至聖者<\/td><\/tr><tr><td>我們必不致死<\/td><td>לֹא נָמוּת<\/td><td>lo namut<\/td><td>H4191<\/td><td>我們不死（文本有異讀）<\/td><\/tr><tr><td>磐石<\/td><td>וְצוּר<\/td><td>vetsur<\/td><td>H6697<\/td><td>磐石、岩石<\/td><\/tr><tr><td>刑罰<\/td><td>לְמִשְׁפָּט<\/td><td>lemishpat<\/td><td>H4941<\/td><td>為了審判、為了裁決<\/td><\/tr><tr><td>清潔<\/td><td>טְהוֹר<\/td><td>tehor<\/td><td>H2890<\/td><td>潔淨、純淨<\/td><\/tr><tr><td>看著不理<\/td><td>תַבִּיט<\/td><td>tabbit<\/td><td>H5027<\/td><td>定睛看、注視<\/td><\/tr><tr><td>靜默不語<\/td><td>תַּחֲרִישׁ<\/td><td>takharish<\/td><td>H2790<\/td><td>沉默、不作聲<\/td><\/tr><tr><td>奸詐<\/td><td>בּוֹגְדִים<\/td><td>bogedim<\/td><td>H898<\/td><td>行詭詐的、背信的<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>你不是從亙古而有嗎<\/strong>：原文 halo attah miqqedem，是一個修辭問句，期待的答案是「是的」。先知先站在神的永恆上，才開口再問。<\/p><p><strong>我的聖者<\/strong>：qedoshi，「我的聖者」。聖是神最深的屬性，原義是「分別出來」。先知用「我的」，是把這個至高的神，放到最私人的關係裡。<\/p><p><strong>我們必不致死<\/strong>：lo namut。這是 1:12 最有名的文本問題。古老的文士傳統（稱為「提古尼·蘇斐林」，即文士修訂）記載，這裡原本是 lo tamut，「祢不死」。後來為了避免對神說出「死」這個字，被改為「我們不死」。和合本跟從現行的希伯來文，譯為「我們必不致死」。兩種讀法都有學者支持，這一點我們在議題裡再談；無論哪一種，核心都是：因為神永恆，所以有指望。<\/p><p><strong>磐石<\/strong>：tsur，常用來指神作為可靠的庇護（申32:4、詩18:2）。先知把這個詞用在這裡，是說：祢就是那位使人站得住的磐石，怎麼反倒設立一個人來懲治我們？<\/p><p><strong>眼目清潔<\/strong>：原文 tehor enayim，「眼睛純淨」，指神的眼睛容不下邪惡。<strong>不看邪僻<\/strong>：me-re'ot ra，直譯是「看見惡事」。<strong>行詭詐的<\/strong>：bogedim，是「背信的人」。<strong>靜默不語<\/strong>：takharish，與詩 28:1、詩 83:1 同一個動詞，意思是「不作聲」，是詩篇裡人對神發出最深一類抱怨的字眼。<\/p><p>1:13 第一次出現「義人」的對照：<strong>惡人吞滅比自己公義的<\/strong>，原文 rasha yeballa tsaddiq mimmennu，和合本把 tsaddiq 譯作「比自己公義的」，意思是「比他更義的人」。<\/p>","exp":"<p>迦勒底人的畫像，先知看完，沒有鬆一口氣，他問得更深。<strong>他的第二個問題，是在第一個問題的基礎上，更進一步。<\/strong>第一次，他問的是：祢為什麼不理？這一次，他問的是：祢為什麼這樣理？<\/p><p>請留意他是從哪裡開口的。他沒有一上來就質問，他先站在神的永恆上：耶和華－我的神，我的聖者啊，你不是從亙古而有嗎？<strong>先知是跪著問的。<\/strong>一個人若是對神已經沒有任何信靠，他不會這樣稱呼祂；他的質問，是從一個「我的神」「我的聖者」的關係裡出來的。這一點，是這卷書與一般的抱怨之間最大的差別。<\/p><p>接著是那一句：「我們必不致死」。如我們在原文欄所說，這一句有一個古老的異讀。無論我們跟從哪一種，這一句話的力量是相同的：<strong>先知抓住神的永恆，作為他不被絕望吞沒的一根繩子。<\/strong>祢是亙古的，所以我們不會被這件事徹底毀滅。<\/p><p>然後他說：你派定他為要刑罰人；磐石啊，你設立他為要懲治人。先知理解到，神興起迦勒底人，是要作審判的工具。他接受這個前提。他的難題並不在於「神為什麼要審判」，而在於接下來這一句。<\/p><p>第 13 節是這卷書的神學心臟：<strong>你眼目清潔，不看邪僻，不看奸惡。<\/strong>先知緊緊抓住神的聖潔，然後把它拿來問神：行詭詐的，你為何看著不理呢？惡人吞滅比自己公義的，你為何靜默不語呢？<\/p><p>這個問題的重量，在於它不是一個外面人的挑戰，而是一個信徒內在的衝突：<strong>我所認識的神是聖潔的、眼目清潔的；但我眼前所看見的歷史，卻讓這位神像是一個旁觀者。<\/strong>這兩件事怎麼同時是真的？<\/p><p>牧養上要特別小心。我們不替神回答這個問題，也不要求受苦的人立刻接受任何一個答案。<strong>先知把這個問題直接放在神面前，這本身就是一種信靠的方式。<\/strong>神沒有因此責備他；下一章，神還要親自回答。我們現在先留在這個問題裡，讓有同樣問題的人知道：這個問題在聖經裡，是被允許的。<\/p><p>這一段還有一個細節值得停下來：先知在 1:12 稱神為「我的神」，在 1:13 卻說「祢」。<strong>人稱的轉換，是一個人從敬拜走向質問的軌跡。<\/strong>他先靠近，說「我的」；再退一步，說「祢」。可是他從來沒有說「他」，他沒有把神推到第三人稱的遠處。質問者始終站在面對面的位置，這是整卷書最安靜的一個證據。<\/p><p>我們也可以學習先知的順序：<strong>先說神是誰，再說我所看見的。<\/strong>不少人是反過來的：先被眼前的景象壓住，再用那個景象去定義神。先知相反，他先把神放在永恆裡，然後才說「可是我看見的不一樣」。這個順序，不能讓問題消失，但能讓人在問題裡站得住。<\/p>"},{"a":14,"z":17,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַתַּעֲשֶׂה אָדָם כִּדְגֵי הַיָּם כְּרֶמֶשׂ לֹא־מֹשֵׁל בּֽוֹ׃ כֻּלֹּה בְּחַכָּה הֵֽעֲלָה יְגֹרֵהוּ בְחֶרְמוֹ וְיַאַסְפֵהוּ בְּמִכְמַרְתּוֹ עַל־כֵּן יִשְׂמַח וְיָגִֽיל׃ עַל־כֵּן יְזַבֵּחַ לְחֶרְמוֹ וִֽיקַטֵּר לְמִכְמַרְתּוֹ כִּי בָהֵמָּה שָׁמֵן חֶלְקוֹ וּמַאֲכָלוֹ בְּרִאָֽה׃ הַעַל כֵּן יָרִיק חֶרְמוֹ וְתָמִיד לַהֲרֹג גּוֹיִם לֹא יַחְמֽוֹל׃<\/p><\/blockquote>","lit":"<blockquote><p>「你為何使人如海中的魚，又如沒有管轄的爬物呢？他用鉤鉤住，用網捕獲，用拉網聚集他們；因此，他歡喜快樂，就向網獻祭，向網燒香，因他由此得肥美的分和富裕的食物。他豈可屢次倒空網羅，將列國的人時常殺戮，毫不顧惜呢？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>魚<\/td><td>כִּדְגֵי<\/td><td>kidgei<\/td><td>H1709<\/td><td>魚<\/td><\/tr><tr><td>沒有管轄的<\/td><td>מֹשֵׁל<\/td><td>moshel<\/td><td>H4910<\/td><td>統治者、管轄者<\/td><\/tr><tr><td>鉤<\/td><td>בְּחַכָּה<\/td><td>bekhakka<\/td><td>H2443<\/td><td>魚鉤<\/td><\/tr><tr><td>網<\/td><td>בְחֶרְמוֹ<\/td><td>bekhermo<\/td><td>H2764<\/td><td>網、魚網<\/td><\/tr><tr><td>拉網<\/td><td>בְּמִכְמַרְתּוֹ<\/td><td>bemikhmarto<\/td><td>H4365<\/td><td>拉網、大魚網<\/td><\/tr><tr><td>歡喜<\/td><td>וְיָגִיל<\/td><td>veyagil<\/td><td>H1523<\/td><td>歡喜、跳躍<\/td><\/tr><tr><td>獻祭<\/td><td>יְזַבֵּחַ<\/td><td>yezabbeakh<\/td><td>H2076<\/td><td>宰殺獻祭<\/td><\/tr><tr><td>燒香<\/td><td>וִיקַטֵּר<\/td><td>viqatter<\/td><td>H6999<\/td><td>使香煙上升<\/td><\/tr><tr><td>顧惜<\/td><td>יַחְמוֹל<\/td><td>yakhmol<\/td><td>H2550<\/td><td>憐惜、顧惜<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>如海中的魚，又如沒有管轄的爬物<\/strong>：原文 kidgei hayyam kerremes lo moshel。remes 是「爬行的小動物」，lo moshel 是「沒有統治者」。這個畫面有兩層：魚在海中，沒有人保護；爬物沒有領袖，不能自衛。人被比作這樣的東西，是因為他們面對網的時候，毫無防備。<\/p><p><strong>鉤、網、拉網<\/strong>：三種捕魚工具。khakka 是單鉤，kherem 是撒網，mikhmeret 是拖網。先知把三種工具並列，是描寫一整套捕獲的系統。注意 kherem 這個字，在舊約另有「滅絕獻神之物」的意思，這裡用在漁網上，與那個宗教意義無關。<\/p><p><strong>歡喜快樂<\/strong>：yismakh veyagil，這是舊約常用在敬拜與慶典上的一對動詞。哈巴谷書 3:18 先知說「我要因耶和華歡欣」，用的同一組字根（gil）。同一個字，第一次用在對著網歡喜的人身上，第二次用在對著耶和華歡喜的先知身上。這是整卷書最安靜的一個對照。<\/p><p><strong>向網獻祭，向網燒香<\/strong>：yezabbeakh lekhermo viqatter lemikhmarto，這是祭祀的語言用在漁網上，意思是：他把自己的工具當作神明來敬拜。與 1:11「以自己的勢力為神」互相呼應。<\/p><p><strong>倒空網羅<\/strong>：原文 yariq khermo，「把網倒空」，指反覆撈捕、反覆倒空。<strong>顧惜<\/strong>：lo yakhmol，「不憐惜」。<\/p>","exp":"<p>先知的第二個問題，沒有在 1:13 就停下來，他接著把這個畫面展開：祢為何使人如海中的魚，又如沒有管轄的爬物呢？<strong>這是一個很具體的畫面：人像魚一樣，被鉤住、被網住、被拉網聚集。<\/strong>他們不是被審判，而是被「捕獲」。<\/p><p>注意這裡的人稱改變了。1:5–11 的主題是迦勒底人這個民族，1:14–17 的主角變成了一個捕魚的人。<strong>先知把整個帝國，縮小成一個站在水邊、手拿網子的人。<\/strong>一個大的歷史，被放進一個很小的畫面裡：一個人，一張網，一海的魚。<\/p><p>然後是最令人不安的兩節：他用鉤鉤住，用網捕獲，用拉網聚集他們；因此，他歡喜快樂，就向網獻祭，向網燒香，因他由此得肥美的分和富裕的食物。<strong>這個人不是在報仇，他是在享受。他把自己的工具當作神明，向它獻祭。<\/strong>他的成功，讓他敬拜那個使他成功的東西。<\/p><p>這幅畫把 1:11 的那一句話「以自己的勢力為神」，畫成了一個可以看見的畫面：他向網獻祭。網是他的手段，也是他的神。<strong>當一個人的方法比他的對象更大，工具就成了神。<\/strong>這是一個很普遍的屬靈危險，不只出現在帝國，也出現在每一個靠某個方法、某個系統、某個成功模式維生的人身上。<\/p><p>最後一句是問題，而且是這一章的最後一個問題：他豈可屢次倒空網羅，將列國的人時常殺戮，毫不顧惜呢？<strong>這一章的結尾，沒有答案。<\/strong>先知把問題放在神面前，就停在那裡。他沒有說「我明白了」，他也沒有說「我不問了」。<\/p><p>這是第 1 章最誠實的地方。它讓我們看見：信心不是沒有問題，信心是把問題帶到神面前，然後等候。第二章第 1 節就是這個等候的開始：<strong>「我要站在守望所，立在望樓上觀看。」<\/strong>先知的轉折，不是得到了答案，而是換了站立的位置。<\/p><p>牧養上請記得：這一段描寫的是受害者的處境，我們先站在受害者的旁邊，不替施暴者找理由，也不要求受害者先原諒。這裡沒有一個字叫人去報復，也沒有一個字要人保持沉默；先知只是把眼睛所看見的，原原本本帶到神面前。<\/p><p>把這一整章放在一起看：<strong>先知問了兩次，神回答了一次，答案比問題更難。<\/strong>這個結構，是整本書的雛形：問、答、再問。它告訴我們，與神的對話不是一問一答就結束，而是一條來回的路。第二章要接著看：先知轉身，站到守望所；神再開口，這次說的是異象與等候。<\/p><p>最後，請把這一章當作一面鏡子，不是照別人，而是照自己：我有沒有一個「網」，是我靠它得肥美的分、並且暗暗向它獻祭的？可能是職位，可能是技術，可能是人脈，也可能是一套讓我不必倚靠神的辦法。<strong>這一章不是要我們去論斷誰是迦勒底人，而是要我們誠實地問：我的神在哪裡。<\/strong>讓耶穌作王，就是把這張網，放回祂的腳前。<\/p>"}],"2":[{"a":1,"z":1,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>עַל־מִשְׁמַרְתִּי אֶעֱמֹדָה וְאֶֽתְיַצְּבָה עַל־מָצוֹר וַאֲצַפֶּה לִרְאוֹת מַה־יְדַבֶּר־בִּי וּמָה אָשִׁיב עַל־תּוֹכַחְתִּֽי׃<\/p><\/blockquote>","lit":"<blockquote><p>「我要站在守望所，立在望樓上觀看，看耶和華對我說什麼話，我可用什麼話向他訴冤。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>站在<\/td><td>אֶעֱמֹדָה<\/td><td>e'emodah<\/td><td>H5975<\/td><td>站立、站穩<\/td><\/tr><tr><td>守望所<\/td><td>מִשְׁמַרְתִּי<\/td><td>mishmarti<\/td><td>H4931<\/td><td>我的守望處、崗哨<\/td><\/tr><tr><td>立<\/td><td>וְאֶתְיַצְּבָה<\/td><td>ve'etyatstsevah<\/td><td>H3320<\/td><td>把自己安置站定<\/td><\/tr><tr><td>望樓<\/td><td>מָצוֹר<\/td><td>matsor<\/td><td>H4692<\/td><td>望樓、被圍的堡壘<\/td><\/tr><tr><td>觀看<\/td><td>וַאֲצַפֶּה<\/td><td>va'atsappeh<\/td><td>H6822<\/td><td>守望、向外探看<\/td><\/tr><tr><td>訴冤<\/td><td>תּוֹכַחְתִּי<\/td><td>tokhakhti<\/td><td>H8433<\/td><td>我的申訴、我的回應（有異譯）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>站在守望所，立在望樓上<\/strong>：原文用了三個動詞：e'emodah（我要站）、ve'etyatstsevah（我要把自己安置站定）、va'atsappeh（我要守望）。前兩個都是「站」，第二個是反身形式，帶著「把自己穩穩安置」的意思。先知不是隨意站一站，是刻意選了一個位置。mishmeret 是守衛的崗位，matsor 本義與「堡壘、圍困」同根，這裡指望樓。<\/p><p><strong>觀看<\/strong>：tsafah（H6822）是全卷追蹤字「看」中的守望一支，全卷只在這裡出現一次。它本是哨兵的動詞，眼睛朝外，等待某事出現。1:3 的「看」是被迫看見，1:13 是定睛看，2:1 是守望：看的方式變了。<\/p><p><strong>訴冤<\/strong>：原文 tokhakhti，字根 yakhakh 有「責備、辯論、申訴」的意思。和合本經文旁註提供另一種譯法「回答所疑問的」。這個字可以讀作「我所受的責備」，也可以讀作「我要提出的辯詞」。各家譯法不同；兩種讀法都在說：先知預備好了要回應，不管神說什麼。<\/p>","exp":"<p>第 2 章第一句話，是全卷書的樞紐。<\/p><p><strong>在第 1 章的最後，先知問完了一串沒有答案的問題。第 2 章的第一句，他沒有再問，他換了一個位置。<\/strong>「我要站在守望所，立在望樓上觀看。」這是他在沒有任何答案的時候，所做的唯一一件事：站好，然後等。<\/p><p>注意他用的三個動詞。他不是路過，不是偷看，他是刻意把自己安置在一個固定的位置上。守望的人有一個特點：<strong>他不決定什麼時候有東西出現，他只決定自己站在哪裡。<\/strong>消息何時到，是城外的事；他的責任，是在那個時間，人在崗位上、眼睛是睜開的。<\/p><p>他要看的是什麼？「看耶和華對我說什麼話」。這句話的重心，與第 1 章不同了。第 1 章，先知看的是罪孽、強暴、公理顛倒——他看的是周圍。第 2 章，他看的是神。<strong>他沒有等到周圍變好才去看神，他是在周圍沒有變的時候，轉過身去看神。<\/strong>這是先知從「被問題釘住」，走向「等候神」的一小步，卻是全卷最重要的一步。<\/p><p>然後他說：我可用什麼話向他訴冤。這一句很誠實：<strong>先知沒有說「我一定會接受」，他說的是「我可以怎麼回應」。<\/strong>他預備好了聽，也預備好了回答；他的心裡還有疑問，但他的雙腳站好了。這是一個正在掙扎的信徒，能做的最好的姿態：不假裝沒有疑問，也不因為疑問而離開崗位。<\/p><p>牧養上，這一節給正在受苦、沒有答案的人一個實用的圖像：<strong>你不必先想通，你可以先站好。<\/strong>站在禱告裡，站在聚會裡，站在每天讀經的那個固定時間裡。這個站，不是消極的，是一種主動的姿態：我把自己放在神可以對我說話的地方。<\/p><p>也要提醒自己，這節經文沒有承諾答案會在今天、這個星期或這個月到來。守望所給人的，不是時間表，而是位置。我們不拿它去催促任何一個正在等候的人「再等一下就好」；我們只是陪著他，一起站好。<\/p><p>讀到這裡，我們還可以問一個很實際的問題：<strong>我現在站在哪裡？<\/strong>有人站在新聞的畫面前，有人站在自己的帳單前，有人站在別人對自己的評語前。這些位置，都不是守望所。守望所是一個選擇：我選擇把自己放在一個可以聽見神的位置上。對有的人是清晨的一段安靜，對有的人是週間固定的禱告會，對有的人是每天下班路上的十分鐘。位置不必華麗，只要固定，而且人在那裡。<\/p><p>先知的第二個動作，是等。他沒有替神寫好答案，也沒有先擬好回覆。<strong>他把自己的答案留白，等神先說。<\/strong>這是一種很深的謙卑：我有問題，我也有看法，但我先聽。我們在後面還要看到，神的回答一說出口，整個畫面就換了。<\/p>"},{"a":2,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיַּעֲנֵנִי יְהוָה וַיֹּאמֶר כְּתוֹב חָזוֹן וּבָאֵר עַל־הַלֻּחוֹת לְמַעַן יָרוּץ קוֹרֵא בֽוֹ׃ כִּי עוֹד חָזוֹן לַמּוֹעֵד וְיָפֵחַ לַקֵּץ וְלֹא יְכַזֵּב אִם־יִתְמַהְמָהּ חַכֵּה־לוֹ כִּֽי־בֹא יָבֹא לֹא יְאַחֵֽר׃<\/p><\/blockquote>","lit":"<blockquote><p>「他對我說：將這默示明明地寫在版上，使讀的人容易讀。因為這默示有一定的日期，快要應驗，並不虛謊。雖然遲延，還要等候；因為必然臨到，不再遲延。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>寫<\/td><td>כְּתוֹב<\/td><td>ketov<\/td><td>H3789<\/td><td>寫下<\/td><\/tr><tr><td>默示<\/td><td>חָזוֹן<\/td><td>khazon<\/td><td>H2377<\/td><td>異象、所見之事<\/td><\/tr><tr><td>版<\/td><td>הַלֻּחוֹת<\/td><td>hallukhot<\/td><td>H3871<\/td><td>寫字的版、石版<\/td><\/tr><tr><td>容易讀<\/td><td>יָרוּץ<\/td><td>yarus<\/td><td>H7323<\/td><td>奔跑（可譯：隨跑隨讀）<\/td><\/tr><tr><td>日期<\/td><td>לַמּוֹעֵד<\/td><td>lamo'ed<\/td><td>H4150<\/td><td>定期、約定的時候<\/td><\/tr><tr><td>遲延<\/td><td>יִתְמַהְמָהּ<\/td><td>yitmahmah<\/td><td>H4102<\/td><td>耽擱、遲疑<\/td><\/tr><tr><td>等候<\/td><td>חַכֵּה<\/td><td>khakkeh<\/td><td>H2442<\/td><td>等候、耐心地等<\/td><\/tr><tr><td>不再遲延<\/td><td>יְאַחֵר<\/td><td>ye'akher<\/td><td>H309<\/td><td>遲到、落後<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>默示<\/strong>：2:2–3 的「默示」，原文是 khazon（異象，H2377），不是 1:1 的 massa（擔子）。和合本都譯作「默示」，讀者要留意：1:1 先知所「扛」的，到了 2:2 變成他要「寫下」的所「見」之事。<\/strong><\/p><p><strong>使讀的人容易讀<\/strong>：原文 lema'an yarus qore，直譯是「使那讀的人可以奔跑」。和合本旁註提供另一種譯法「隨跑隨讀」。學者對這句有兩種主要讀法：一是字寫得夠大夠清楚，路過的人跑著也能讀；二是讀的人讀了之後，會跑去告訴別人。兩種讀法，意思都落在這一點：這份話是要被傳開的。<\/p><p><strong>有一定的日期<\/strong>：lamo'ed，「為了定期」。mo'ed 是神所定的時間，也用於「節期」。2:3 的重點是：時間在神手裡，不在人手裡。<strong>快要應驗<\/strong>：weyafe'akh laqets，字面是「它向著終點喘息」，像一個奔跑的人，氣喘著朝終點衝。<strong>並不虛謊<\/strong>：lo yekhazzev，「不會欺騙」。<\/p><p><strong>雖然遲延，還要等候<\/strong>：im yitmahmah khakkeh lo。yitmahmah（耽擱），khakkeh（H2442，等候）。這個「等候」與 1:15 的魚鉤（khakka，H2443）字形很像，但是不同的字根。<strong>不再遲延<\/strong>：lo ye'akher，「不會晚到」。前面是「雖然遲延」，後面是「不會晚到」：從人的感受說，是遲延；從神的時間說，不遲到。<\/p>","exp":"<p>先知站好了，神回答了。<\/p><p><strong>神的第一句回應，不是答案，是一道指示：寫下來。<\/strong>「將這默示明明地寫在版上。」神沒有說「我現在告訴你原因」，祂說：把你所看見的寫下來，寫得清楚，讓讀的人可以跑著讀。<\/p><p>這是很有趣的次序。先知為了自己的問題站在守望所，神卻把他的位置從「發問的人」變成「記錄的人」。<strong>神的回答，先是把先知的個人問題，變成一份要傳給眾人的話。<\/strong>這份話，要寫在版上，要大大地寫，要讓路過的人都讀得到。<\/p><p>然後是 2:3 那句每個等候的人都熟悉的話：「因為這默示有一定的日期，快要應驗，並不虛謊。雖然遲延，還要等候；因為必然臨到，不再遲延。」<\/p><p>請留意這一節的兩個層次。第一層是人的感覺：<strong>「遲延」。<\/strong>神沒有否認人覺得慢；祂用了「遲延」這個字，承認等候的人所感受到的是真實的。第二層是神的時間：<strong>「不再遲延」。<\/strong>在神那裡，它不會晚到。這兩句話並排，沒有互相取消；它們同時是真的。<\/p><p>這一節給等候的人的，不是一個日期，而是一個姿態：「還要等候。」等候不是消極的，等候是一個動詞。先知在上一節站好了，這一節神說：站著，繼續。<strong>神沒有說「再等一下就好」，祂說的是「等候」，因為它必然臨到。<\/strong>我們不替這句話加上任何時間，也不拿它去算任何事情。<\/p><p>牧養上，請不要對正在等候的人說「快了」。我們不知道。我們能說的是經文給的：神的話不虛謊，神的時間不遲到，而你不是一個人在這裡等；先知也等過。也請讓等候的人知道：感到「遲延」，是被經文承認的感覺，他不是信心不夠。<\/p><p>請再看一個細節：神要先知寫的是「異象」，而不是「理由」。<strong>神沒有給先知一份完整的解釋，祂給的是一個可以被信靠的方向。<\/strong>人在苦難裡，常常盼望的是理由；神常常先給的，是祂自己的話。理由也許在很後面才出現，也許在今生不出現，但神的話，是現在就可以抓住的。<\/p><p>這也提醒我們：<strong>被等候的，是一個「話」，不只是一個「結果」。<\/strong>等候的人，等的是神所說的應驗；而神所說的話，已經在手上。這使等候不再是空手的等，而是握著話等。<\/p><p>還有一件值得放在心上的事：神吩咐先知寫下來，表示這份話不是只給先知一個人的。<strong>一個人在守望所裡領受的，是要成為整個群體可以讀、可以跑的話。<\/strong>所以，當我們在禱告中得到一點亮光、在受苦中學到一個功課，不要只把它藏在自己心裡；在適當的時候，用合適的方式，把它寫下來、說出來，讓下一個正在等候的人，可以跑著讀。<\/p>"},{"a":4,"z":5,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הִנֵּה עֻפְּלָה לֹא־יָשְׁרָה נַפְשׁוֹ בּוֹ וְצַדִּיק בֶּאֱמוּנָתוֹ יִחְיֶֽה׃ וְאַף כִּֽי־הַיַּיִן בּוֹגֵד גֶּבֶר יָהִיר וְלֹא יִנְוֶה אֲשֶׁר הִרְחִיב כִּשְׁאוֹל נַפְשׁוֹ וְהוּא כַמָּוֶת וְלֹא יִשְׂבָּע וַיֶּאֱסֹף אֵלָיו כָּל־הַגּוֹיִם וַיִּקְבֹּץ אֵלָיו כָּל־הָעַמִּֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「迦勒底人自高自大，心不正直；惟義人因信得生。迦勒底人因酒詭詐，狂傲，不住在家中，擴充心欲，好像陰間。他如死不能知足，聚集萬國，堆積萬民都歸自己。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>自高自大<\/td><td>עֻפְּלָה<\/td><td>uffelah<\/td><td>H6075<\/td><td>自高、膨脹（字義不確定）<\/td><\/tr><tr><td>不正直<\/td><td>יָשְׁרָה<\/td><td>yasharah<\/td><td>H3474<\/td><td>正直、平直<\/td><\/tr><tr><td>義人<\/td><td>וְצַדִּיק<\/td><td>vetsaddiq<\/td><td>H6662<\/td><td>義人、公義的人<\/td><\/tr><tr><td>信<\/td><td>בֶּאֱמוּנָתוֹ<\/td><td>be'emunato<\/td><td>H530<\/td><td>信實、忠信、可靠<\/td><\/tr><tr><td>得生<\/td><td>יִחְיֶה<\/td><td>yikhyeh<\/td><td>H2421<\/td><td>活著、存活<\/td><\/tr><tr><td>詭詐<\/td><td>בּוֹגֵד<\/td><td>boged<\/td><td>H898<\/td><td>背信的、詭詐的<\/td><\/tr><tr><td>酒<\/td><td>הַיַּיִן<\/td><td>hayyayin<\/td><td>H3196<\/td><td>酒<\/td><\/tr><tr><td>陰間<\/td><td>כִּשְׁאוֹל<\/td><td>kisheol<\/td><td>H7585<\/td><td>如陰間、如陰府<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>自高自大<\/strong>：原文 uffelah，這個字在舊約只出現這一次，字義不能完全確定，一般認為與「膨脹、鼓起」有關。<strong>心不正直<\/strong>：lo yashrah nafsho vo，「他的心在他裡面不平直」。原文沒有「迦勒底人」，句子開頭是「看哪，他」；和合本為使上下文通順，補上「迦勒底人」。這是一個譯者的補充，不是原文本身。<\/p><p><strong>義人<\/strong>：tsaddiq（H6662），全卷只出現 3 次：1:4（被圍困）、1:13（被吞滅）、2:4（因信得生）。同一個詞，由被傷害的人，變成得生的人。<\/p><p><strong>信<\/strong>：emunah（H530），字根 aman 是「穩固、可靠」。名詞 emunah 的本意是「可靠、忠信、堅定」，不只是頭腦裡的「相信」，也有「站得穩、信得過」的意思。這裡的代名詞是「他的」：be'emunato，「靠著他的 emunah」。學者對這個詞究竟是指「人對神的信靠」還是「人所表現的忠信」有不同的強調，兩者在經文中並不互相排斥；重點是：生命的根基是一種對神的穩定的倚靠。<\/p><p><strong>因酒詭詐<\/strong>：2:5 開頭 ve'af ki hayyayin boged，「並且，酒是背信的」。這一句的讀法在學者中有分歧：有人認為「酒」指縱慾與奢華，有人認為是一個比喻，指他自己被自己的欲望灌醉。本講義只取最穩的意思：他像被酒灌醉，不能自制。<strong>擴充心欲，好像陰間<\/strong>：hirkhiv kisheol nafsho，「把他的欲望擴大，如同陰間」，描寫貪得無厭。<\/p>","exp":"<p>2:4，是整卷書最有名的一節，也是新約引用最多的一節。<\/p><p>在神的回答裡，這一節是整個畫面的核心：一邊是「他」，一邊是「義人」。<strong>「他自高自大，心不正直」；「惟義人因信得生」。<\/strong>兩個人，兩條路。<\/p><p>第一個人，和合本說是迦勒底人。他的問題是「自高」與「不正直」，是一個膨脹的心，一個不再平直的內在。這與 1:11「以自己的勢力為神」一脈相承。他向外征服，向內卻是歪斜的。<\/p><p>第二個人，是義人。經文沒有說他很強，沒有說他有地位，也沒有說他有答案。<strong>經文只說：他因信得生。<\/strong>在 1:4、1:13，這個義人被圍困，被吞滅，是那個被傷害的人。如今神對他說：你要活著，而你活著的方式，不是靠你的力量，是靠你的「信」。<\/p><p>這個「信」不是一個分數。<strong>我們必須很小心：「義人因信得生」，不是說「信心夠大，才有生命」。<\/strong>它是說，生命的根基，不在人的力量、人的成績、人的答案上，而在一個穩定的倚靠上。這個倚靠，本身也是神賜的。一個正在受苦、信心搖搖晃晃的人，不需要先把信心練到某個程度才算活著；他只要繼續向神倚靠，不離開那位磐石。<\/p><p>新約三次引用這一句：羅馬書 1:17、加拉太書 3:11、希伯來書 10:38。保羅用它講「稱義」，希伯來書用它講「忍耐」。三處用法不同，但都沒有離開哈巴谷書的處境：一個在等候中的義人，靠著對神的倚靠，活下去。我們讀這一節時，不要急著把它當作一個教義名詞來處理，而要先聽見它是對一個正在質問神的人所說的回答。<\/p><p>最後，2:5 把畫面拉回迦勒底人：他像被酒灌醉，貪得無厭，如同陰間，張開口不能知足，聚集萬國，堆積萬民歸於自己。<strong>一個什麼都要吞的人，最後什麼也沒有得到滿足。<\/strong>與義人的「得生」並排，是一個很安靜的對照：吞的人不能滿足，倚靠的人得著生命。<\/p><p>最後，請留意 2:4 與全書的接合。第 1 章，義人被圍困、被吞滅；第 2 章，義人得生。這兩個畫面，中間隔著一個守望所。<strong>先知的生命之路，不是從「問題」直接跳到「答案」，而是經過一個站立、等候、聽見的過程。<\/strong>得生，是在這條路的盡頭被賜下來的；而這條路，是義人一步一步走過的。<\/p><p>讓耶穌作王，在這一節的意思是：<strong>我的「活」，不再靠我自己的強壯，而是靠那位我倚靠的主。<\/strong>祂是榜樣，祂在最黑暗的時候仍然信靠父；祂也是我們的生命，祂的信實，成了我們活下去的根基。<\/p>"},{"a":6,"z":8,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הֲלוֹא־אֵלֶּה כֻלָּם עָלָיו מָשָׁל יִשָּׂאוּ וּמְלִיצָה חִידוֹת לוֹ וְיֹאמַר הוֹי הַמַּרְבֶּה לֹּא־לוֹ עַד־מָתַי וּמַכְבִּיד עָלָיו עַבְטִֽיט׃ הֲלוֹא פֶתַע יָקוּמוּ נֹשְׁכֶיךָ וְיִקְצוּ מְזַעְזְעֶיךָ וְהָיִיתָ לִמְשִׁסּוֹת לָֽמוֹ׃ כִּֽי אַתָּה שַׁלּוֹתָ גּוֹיִם רַבִּים יְשָׁלּוּךָ כָּל־יֶתֶר עַמִּים מִדְּמֵי אָדָם וַחֲמַס־אֶרֶץ קִרְיָה וְכָל־יֹשְׁבֵי בָֽהּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「這些國的民豈不都要提起詩歌並俗語譏刺他說：禍哉！迦勒底人，你增添不屬自己的財物，多多取人的當頭，要到幾時為止呢？咬傷你的豈不忽然起來，擾害你的豈不興起，你就作他們的擄物嗎？因你搶奪許多的國，殺人流血，向國內的城並城中一切居民施行強暴，所以各國剩下的民都必搶奪你。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>禍哉<\/td><td>הוֹי<\/td><td>hoy<\/td><td>H1945<\/td><td>哀哉、禍哉（葬禮上的呼聲）<\/td><\/tr><tr><td>詩歌<\/td><td>מָשָׁל<\/td><td>mashal<\/td><td>H4912<\/td><td>俗語、比喻、諷刺詩<\/td><\/tr><tr><td>譏刺<\/td><td>וּמְלִיצָה<\/td><td>umelitsah<\/td><td>H4426<\/td><td>譏諷、嘲弄的話<\/td><\/tr><tr><td>增添<\/td><td>הַמַּרְבֶּה<\/td><td>hammarbeh<\/td><td>H7235<\/td><td>增多、加多<\/td><\/tr><tr><td>當頭<\/td><td>עַבְטִיט<\/td><td>avtit<\/td><td>H5671<\/td><td>抵押物、所押之物<\/td><\/tr><tr><td>要到幾時<\/td><td>עַד־מָתַי<\/td><td>ad-matay<\/td><td>H4970<\/td><td>要到什麼時候<\/td><\/tr><tr><td>搶奪<\/td><td>שַׁלּוֹתָ<\/td><td>shallota<\/td><td>H7997<\/td><td>搶劫、劫掠<\/td><\/tr><tr><td>強暴<\/td><td>וַחֲמַס<\/td><td>vakhamas<\/td><td>H2555<\/td><td>強暴<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>禍哉<\/strong>：hoy 是一個感嘆詞，常見於喪禮上的哀哭，如「哀哉，我的弟兄」（王上13:30）。先知書用它來開頭，是向一個還活著的人，發出像對死人一樣的哀歌。它的力道不在「咒詛」，而在「你正走向死亡，你自己還不知道」。這與一般的「咒詛」字眼（arur）不同。<\/p><p><strong>詩歌並俗語譏刺<\/strong>：mashal（比喻、諷刺詩）、melitsah（譏諷之語）、khidot（謎語）。2:6 說這些受害的國民，都要編成歌謠、謎語來述說他。意思是：被壓迫者的記憶，最終會成為對壓迫者的話語。<\/p><p><strong>增添不屬自己的財物，多多取人的當頭<\/strong>：原文 hammarbeh lo lo，「增加那不屬於他的」；umakhbid avtit，「並使抵押物沉重」。avtit 一般解為「押在他手上的當頭」。有學者把這個詞拆成兩個字，讀作「厚重的債務」；兩種讀法都描寫以債務與押當的方式，累積別人的東西。<\/p><p><strong>要到幾時為止呢<\/strong>：ad matay，與 1:2 的 ad anah（要到幾時）是同一類問法。1:2 是先知問神「要到幾時」，2:6 是受壓迫的人問壓迫者「要到幾時」。<strong>咬傷、擾害<\/strong>：noshekhekha、meza'zea'ekha，把債主比作咬人的蛇，這些債主轉過頭來，成了擄掠的人。<strong>國內<\/strong>：2:8、2:17 的「國內」，原文是 eretz（地）。和合本把「地」譯作「國內」，讀者要知道：這與全卷追蹤的「地」是同一個字。<\/p>","exp":"<p>2:6 開始，是五個「禍哉」的第一個。<\/p><p>要先理解一件事：<strong>這五個禍，是被壓迫的人編成的歌，不是先知拿來咒詛任何人的話。<\/strong>2:6 說得很清楚：「這些國的民，豈不都要提起詩歌並俗語譏刺他說：禍哉！」是那些受害的人，在日後有一天會唱這首歌。<\/p><p>第一個禍的內容：<strong>增添不屬自己的財物，多多取人的當頭。<\/strong>這是一個累積別人東西的人，靠著押當、債務、搶奪，越堆越高。他的問題不只是貪，是一種系統性的取用：把別人的東西，變成自己的。<\/p><p>然後一個問題：要到幾時為止呢？這個問題，與先知在 1:2 的呼求，是同一個句型。<strong>先知問神「要到幾時」，被壓迫者問壓迫者「要到幾時」。<\/strong>這個回聲並不是巧合：神把先知的問題，轉成了壓迫者要面對的問題。<\/p><p>接著是 2:7–8 的反轉：咬傷你的豈不忽然起來，擾害你的豈不興起，你就作他們的擄物嗎？<strong>你怎麼對待別人，別人就怎麼回到你身上。<\/strong>你搶奪許多的國，各國剩下的民都必搶奪你。這個邏輯在聖經裡反覆出現：強暴的結局，是強暴回到自己頭上。<\/p><p>「強暴」這個字，在這裡再次出現：向國內的城並城中一切居民施行強暴。<strong>先知在 1:2 所哀求的那個字，現在成為了審判的理由。<\/strong>這是全卷的一個重要軸線：神聽見了先知所哭的字，並且沒有忘記它。<\/p><p>我們讀這一段時，先回到自己：我有沒有在「增添」？可能不是金錢，可能是時間、尊榮、別人的功勞、別人的付出。<strong>這個「禍」，不是拿來指著別人的，是拿來先照自己的。<\/strong>我們也不把這五禍套到今天的任何一家公司、行業或政府。經文說的是一個原則：以他人的所有來堆自己的，必要回到自己。<\/p><p>讀這一段，還要留意一個很重要的語氣：<strong>這五個禍，是用「歌」的方式說出來的。<\/strong>它們不是政治演說，也不是個人的報復，而是一首被壓迫者終於可以唱出來的歌。這提醒我們，神讓被壓迫的人的聲音，有一天被聽見。聽見這首歌的時候，我們要先問：這首歌裡，有沒有我所傷害過的人的聲音？<\/p><p>與此同時，我們也不要把「禍」當作一個詛咒的口號。它是一個哀歌的呼聲，更像是對一個正走向死亡的人所說的：你不知道自己在往哪裡去。<strong>神發出「禍哉」的時候，祂的心，是看見而痛惜的。<\/strong><\/p>"},{"a":9,"z":11,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הוֹי בֹּצֵעַ בֶּצַע רָע לְבֵיתוֹ לָשׂוּם בַּמָּרוֹם קִנּוֹ לְהִנָּצֵל מִכַּף־רָֽע׃ יָעַצְתָּ בֹּשֶׁת לְבֵיתֶךָ קְצוֹת־עַמִּים רַבִּים וְחוֹטֵא נַפְשֶֽׁךָ׃ כִּי־אֶבֶן מִקִּיר תִּזְעָק וְכָפִיס מֵעֵץ יַעֲנֶֽנָּה׃<\/p><\/blockquote>","lit":"<blockquote><p>「為本家積蓄不義之財、在高處搭窩、指望免災的有禍了！你圖謀剪除多國的民，犯了罪，使你的家蒙羞，自害己命。牆裡的石頭必呼叫；房內的棟樑必應聲。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>禍哉<\/td><td>הוֹי<\/td><td>hoy<\/td><td>H1945<\/td><td>哀哉、禍哉<\/td><\/tr><tr><td>不義之財<\/td><td>בֶּצַע<\/td><td>betsa<\/td><td>H1215<\/td><td>不義之財、貪得的利益<\/td><\/tr><tr><td>積蓄<\/td><td>בֹּצֵעַ<\/td><td>botsea<\/td><td>H1214<\/td><td>貪取、掠取<\/td><\/tr><tr><td>搭窩<\/td><td>קִנּוֹ<\/td><td>qinno<\/td><td>H7064<\/td><td>他的窩、他的巢<\/td><\/tr><tr><td>高處<\/td><td>בַּמָּרוֹם<\/td><td>bammarom<\/td><td>H4791<\/td><td>高處<\/td><\/tr><tr><td>蒙羞<\/td><td>בֹּשֶׁת<\/td><td>boshet<\/td><td>H1322<\/td><td>羞辱<\/td><\/tr><tr><td>石頭<\/td><td>אֶבֶן<\/td><td>even<\/td><td>H68<\/td><td>石頭<\/td><\/tr><tr><td>呼叫<\/td><td>תִּזְעָק<\/td><td>tiz'aq<\/td><td>H2199<\/td><td>喊叫、呼求<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>積蓄不義之財<\/strong>：原文 botsea betsa ra，「貪取惡的利益」，botsea 與 betsa 同根，是一個重疊的說法，意思是：貪取貪得的、攫取攫來的。<\/strong><\/p><p><strong>在高處搭窩<\/strong>：lasum bammarom qinno，「把他的窩安在高處」。這個畫面是老鷹的巢，高到沒有人夠得到（參俄1:4）。<strong>指望免災<\/strong>：lehinnatsel mikkaf ra，「為要從惡的手中脫身」。這個人以為高處與積蓄，能讓他免於一切的災難。<\/p><p><strong>牆裡的石頭必呼叫<\/strong>：even miqqir tiz'aq，「石頭從牆裡呼喊」。tiz'aq 與 1:2 先知「哀求」（ez'aq）是同一個動詞。先知用這個字呼求神救他脫離強暴；現在，連房子的石頭也在用這個字作證。<\/p><p><strong>房內的棟樑必應聲<\/strong>：ya'anennah，「必回應」，與 2:2 神「回答」先知（vayya'aneni）是同一個字根。石頭呼喊，木頭回應：這是一個為不義而造的房子，被自己的材料所控告。<\/p>","exp":"<p>第二個禍，講的是一個人的家。<\/p><p><strong>為本家積蓄不義之財、在高處搭窩、指望免災的有禍了。<\/strong>這個人不是為自己，是為「本家」：為自己的家族、自己的後代、自己的安全。他的動機聽起來並不壞：我要保護我的家。但他保護的方法，是用不義的財，並且把窩築在高處，想要免災。<\/p><p>這一節非常貼近生活。我們每個人心裡，都有一個「想要免災」的欲望。為了讓孩子過得好，為了讓家人不受苦，為了讓自己將來有保障，我們可能會在不知不覺間，越過一條線。<strong>這個禍，不是針對想要保護家人的人，而是針對用不義的方法來保護的人。<\/strong><\/p><p>然後是 2:10：「你圖謀剪除多國的民，犯了罪，使你的家蒙羞，自害己命。」他要保護家，卻使家蒙羞；他要保全自己，卻自害己命。<strong>用不義建起來的保障，最後成了傷害自己的東西。<\/strong><\/p><p>最令人心驚的是 2:11：牆裡的石頭必呼叫，房內的棟樑必應聲。這是一幅很有畫面的圖：一座房子，它的石頭與木頭開口作證。<strong>被害的人也許沒有機會開口，但房子會說話。<\/strong>神記得每一塊石頭是從哪裡來的，每一根棟樑是用什麼代價換來的。<\/p><p>對受害的人，這是一個安慰：<strong>你沒有聲音的地方，連石頭都有聲音。<\/strong>神沒有漏掉任何一個沒有被聽見的呼喊。對握有資源的人，這是一個提醒：我所累積的，有沒有一塊石頭，是在呼叫？<\/p><p>我們也要留意，不要把這一節變成對富有的人的一般性論斷。經文針對的是「不義之財」與「圖謀剪除多國的民」，不是針對所有有積蓄的人。我們要追問的是：我的積蓄是怎麼來的？我的安全感，是建立在誰的代價上？<\/p><p>這一段還有一個提醒：<strong>不義的保障是一個很孤單的地方。<\/strong>高處的窩看起來安全，其實離所有人都很遠。一個人若把所有的安全感，都建在自己的積蓄與位置上，他會越來越不敢信任任何人，也越來越不被任何人信任。神給人的保障，是在一個團體裡、在一份彼此相顧的關係裡，不是一座孤零零的塔。<\/p><p>我們也可以問：我的家，是在為神所用，還是只是我的碉堡？一個為神所用的家，門是開著的，桌子是有位置給別人的。這是屬神的體系在家庭層面的樣子：先有生命，再有關係，後有事工。<\/p>"},{"a":12,"z":14,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הוֹי בֹּנֶה עִיר בְּדָמִים וְכוֹנֵן קִרְיָה בְּעַוְלָֽה׃ הֲלוֹא הִנֵּה מֵאֵת יְהוָה צְבָאוֹת וְיִֽיגְעוּ עַמִּים בְּדֵי־אֵשׁ וּלְאֻמִּים בְּדֵי־רִיק יִעָֽפוּ׃ כִּי תִּמָּלֵא הָאָרֶץ לָדַעַת אֶת־כְּבוֹד יְהוָה כַּמַּיִם יְכַסּוּ עַל־יָֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「以人血建城、以罪孽立邑的有禍了！眾民所勞碌得來的被火焚燒，列國由勞乏而得的歸於虛空，不都是出於萬軍之耶和華嗎？認識耶和華榮耀的知識要充滿遍地，好像水充滿洋海一般。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>以人血建城<\/td><td>בֹּנֶה עִיר בְּדָמִים<\/td><td>boneh ir bedamim<\/td><td>H5892<\/td><td>用血建造城邑<\/td><\/tr><tr><td>罪孽<\/td><td>בְּעַוְלָה<\/td><td>be'avlah<\/td><td>H5766<\/td><td>不義、邪惡<\/td><\/tr><tr><td>勞碌<\/td><td>וְיִיגְעוּ<\/td><td>veyig'u<\/td><td>H3021<\/td><td>勞苦、疲乏<\/td><\/tr><tr><td>火<\/td><td>אֵשׁ<\/td><td>esh<\/td><td>H784<\/td><td>火<\/td><\/tr><tr><td>虛空<\/td><td>רִיק<\/td><td>riq<\/td><td>H7385<\/td><td>空虛、徒然<\/td><\/tr><tr><td>知識<\/td><td>לָדַעַת<\/td><td>lada'at<\/td><td>H3045<\/td><td>認識、知道<\/td><\/tr><tr><td>榮耀<\/td><td>כְּבוֹד<\/td><td>kevod<\/td><td>H3519<\/td><td>榮耀、分量、重量<\/td><\/tr><tr><td>充滿<\/td><td>תִּמָּלֵא<\/td><td>timmale<\/td><td>H4390<\/td><td>充滿、盈滿<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>以人血建城<\/strong>：原文 boneh ir bedamim，「用血建城」，damim 是複數的「血」，指流血的行為。<strong>以罪孽立邑<\/strong>：bekhonen qiryah be'avlah，「用不義建立城邑」。這是第三個禍的內容：用血與不義建造出來的城。<\/p><p><strong>列國由勞乏而得的歸於虛空<\/strong>：2:13 的結構很精巧，與耶利米書 51:58 相近：「民所勞碌得來的被火焚燒，列國由勞乏而得的歸於虛空」。這是一個很有力的警告：人所勞碌建造的，若不是出於神，最終都會像被火燒的稻草，成為虛空（riq）。<\/p><p><strong>不都是出於萬軍之耶和華嗎<\/strong>：halo hinneh me'et YHWH tseva'ot，「這不都是出於萬軍之耶和華嗎」。這是一個修辭問句：這樣的結局，是從萬軍之耶和華那裡來的。<\/p><p><strong>認識耶和華榮耀的知識要充滿遍地，好像水充滿洋海一般<\/strong>：2:14 與以賽亞書 11:9 幾乎相同，只是加上「榮耀」（kevod）。原文 timmale ha'aretz lada'at et kevod YHWH，「地要充滿，為要認識耶和華的榮耀」。kevod 的字根是「重」，指分量、尊貴。<strong>遍地<\/strong>：ha'aretz，「地」，是全卷追蹤的字。<\/p>","exp":"<p>第三個禍之後，緊接著的是整章最亮的一節。<\/p><p>第三個禍：<strong>以人血建城、以罪孽立邑的有禍了。<\/strong>一座城，是人類文明最偉大的成就之一，也是人類最大的誘惑：我要建一個不朽的東西。但如果這座城是用別人的血、別人的眼淚、別人的血汗堆起來的，經文說，它會被火燒。<\/p><p>2:13 是一個很深的觀察：眾民所勞碌得來的，被火焚燒；列國由勞乏而得的，歸於虛空。<strong>這不是說所有的勞動都是徒然，而是說，建在不義之上的，終必歸於虛空。<\/strong>這與傳道書所說的「虛空」，是兩個不同的角度：傳道書談的是人生本身的有限，這裡談的是不義之業的結局。<\/p><p>然後，2:14：<strong>「認識耶和華榮耀的知識要充滿遍地，好像水充滿洋海一般。」<\/strong>在兩個「禍哉」之間，在人的城被火燒的畫面旁邊，突然出現一幅完全不同的圖畫：不是血，是水；不是被火焚燒，而是被知識充滿。<\/p><p>請留意這句話所用的比喻：像水充滿洋海。<strong>海裡沒有一處是沒有水的。<\/strong>這個畫面的意思是：神的榮耀的知識，最終不是局部的、零碎的，而是無所不在的。強暴曾經充滿過這塊地，但那不是最後一句話。<\/p><p>這是整卷書最大的盼望，也是對先知問題最深的一個回答。他問：祢為何看著不理？神說：我的榮耀要充滿遍地。<strong>神沒有說「現在就停止」，祂說的是「終必充滿」。<\/strong>這是一個方向，不是一個日期。我們不把它變成時間表，我們只知道：歷史的方向，不是強暴，是認識神的榮耀。<\/p><p>我們可以把這一節放進日常：每一次我們在家裡、在職場、在教會，用一個誠實的行動、一個饒恕的決定、一次不佔便宜的選擇，我們就是在這片海裡，多加了一滴水。這不是為了成就自己，而是讓耶穌得著榮耀。<\/p><p>再回到 2:14，我們要留意它的位置：<strong>它不是放在整卷書的最後，而是放在第三個禍之後。<\/strong>這意味著，盼望不是等所有的審判都結束了才出現，它是在審判之中，一直在那裡。神在說「禍」的時候，同時也在說「充滿」。審判與盼望，並不是兩個先後的階段，而是同一位神，同時說的兩句話。<\/p><p>這個畫面，也提醒我們事奉的方向：我們不是在建一座自己的城，而是在參與一件比我們更大的事——神的榮耀的知識，如水充滿洋海。<strong>我們所做的每一件小事，若是出於神，都是這片海的一部分。<\/strong>這是屬神體系的異象：不是我們的名被傳開，而是祂的名被認識。<\/p>"},{"a":15,"z":17,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>הוֹי מַשְׁקֵה רֵעֵהוּ מְסַפֵּחַ חֲמָתְךָ וְאַף שַׁכֵּר לְמַעַן הַבִּיט עַל־מְעוֹרֵיהֶֽם׃ שָׂבַעְתָּ קָלוֹן מִכָּבוֹד שְׁתֵה גַם־אַתָּה וְהֵֽעָרֵל תִּסּוֹב עָלֶיךָ כּוֹס יְמִין יְהוָה וְקִיקָלוֹן עַל־כְּבוֹדֶֽךָ׃ כִּי חֲמַס לְבָנוֹן יְכַסֶּךָּ וְשֹׁד בְּהֵמוֹת יְחִיתַן מִדְּמֵי אָדָם וַחֲמַס־אֶרֶץ קִרְיָה וְכָל־יֹשְׁבֵי בָֽהּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「給人酒喝、又加上毒物、使他喝醉、好看見他下體的有禍了！你滿受羞辱，不得榮耀；你也喝吧，顯出是未受割禮的！耶和華右手的杯必傳到你那裡；你的榮耀就變為大大地羞辱。你向黎巴嫩行強暴與殘害驚嚇野獸的事必遮蓋你；因你殺人流血，向國內的城並城中一切居民施行強暴。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>禍哉<\/td><td>הוֹי<\/td><td>hoy<\/td><td>H1945<\/td><td>哀哉、禍哉<\/td><\/tr><tr><td>給人酒喝<\/td><td>מַשְׁקֵה<\/td><td>mashqeh<\/td><td>H8248<\/td><td>使人喝、給人喝<\/td><\/tr><tr><td>羞辱<\/td><td>קָלוֹן<\/td><td>qalon<\/td><td>H7036<\/td><td>羞辱、恥辱<\/td><\/tr><tr><td>榮耀<\/td><td>כָּבוֹד<\/td><td>kavod<\/td><td>H3519<\/td><td>榮耀<\/td><\/tr><tr><td>耶和華右手的杯<\/td><td>כּוֹס יְמִין יְהוָה<\/td><td>kos yemin YHWH<\/td><td>H3563<\/td><td>耶和華右手的杯<\/td><\/tr><tr><td>黎巴嫩<\/td><td>לְבָנוֹן<\/td><td>levanon<\/td><td>H3844<\/td><td>黎巴嫩（森林之地）<\/td><\/tr><tr><td>強暴<\/td><td>חֲמַס<\/td><td>khamas<\/td><td>H2555<\/td><td>強暴<\/td><\/tr><tr><td>遮蓋<\/td><td>יְכַסֶּךָּ<\/td><td>yekhassekha<\/td><td>H3680<\/td><td>遮蓋、淹沒<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>禍哉、給人酒喝<\/strong>：2:15 的 hoy mashqeh re'ehu，「禍哉，使他的鄰舍喝的人」。這個「禍」的內容，是利用鄰舍的信任，使他喪失自制，再趁機羞辱他。經文用的是一個很含蓄的說法，本講義不重述細節，也不加添畫面。<\/p><p><strong>羞辱與榮耀<\/strong>：2:16 的 qalon（羞辱）與 kavod（榮耀）對照：「你滿受羞辱，不得榮耀」。kavod 的字根是「重」，與 2:14 的「耶和華榮耀」同一個字；qalon 的字根是「輕」。這一組輕與重的對比，貫穿整個五禍。<\/p><p><strong>耶和華右手的杯<\/strong>：kos yemin YHWH，是舊約審判的圖像之一（賽51:17、耶25:15）。人以杯使人受辱，耶和華以杯使人承擔自己所作的。這一節把「杯」從人的手，換到神的手。<\/p><p><strong>黎巴嫩、驚嚇野獸<\/strong>：2:17 的黎巴嫩，常被理解為被砍伐的森林，並指向對自然與生靈的破壞；各家對這句的具體所指有不同的看法。重點是：強暴不只傷人，也傷害神所造的萬物。<\/p>","exp":"<p>第四個禍，是五禍中最需要小心閱讀的一個。<\/p><p><strong>給人酒喝、又加上毒物、使他喝醉、好看見他下體的有禍了。<\/strong>這一節描寫的是一種對鄰舍的羞辱與侵犯。經文用了含蓄的筆法，我們也不重述畫面，不加細節，更不拿它開任何玩笑。<\/p><p>在牧養上，這一節必須先站在被羞辱、被侵犯的人那一邊。有人曾經在醉酒、昏睡、失去自制的狀態下被傷害；有人至今不能談；有人從來沒有被人相信。<strong>如果你是其中一位，請聽這一節經文先說的話：神看見，並且說，這是禍。<\/strong>它不是你的羞恥，是那個人的。<\/p><p>然後是 2:16：<strong>你滿受羞辱，不得榮耀。<\/strong>這是一個很刻意的反轉：那個想要使鄰舍蒙羞的人，自己要受羞辱；他所要奪走的榮耀，最終自己也不得。耶和華右手的杯，必傳到他那裡。<\/p><p>請注意這個「杯」的圖像：人用杯使人喝醉、使人失去尊嚴；神的杯，是公義的杯，使人承擔自己所行的。<strong>在神的手裡，羞辱不再是一個人可以對另一個人隨意施加的武器。<\/strong><\/p><p>2:17 又回到「強暴」這個字，並把範圍擴大到黎巴嫩與野獸：你向黎巴嫩行的強暴，與殘害驚嚇野獸的事，必遮蓋你。<strong>強暴不只是人對人的事，也是人對神所造的世界的事。<\/strong>這給我們一個提醒：我們對受造界的態度，也在神的眼裡。<\/p><p>這一段不要拿來指責任何人，也不要拿來給受傷的人一個「你要原諒」的壓力。經文只是說：神看見，神審判，神記得。受傷的人可以不急著說話；他也可以找一位可信的人，一同走這條路，必要時尋求專業的協助。<\/p><p>最後，請把這一段交給神，也交給可信靠的人。如果你自己曾經在這樣的羞辱裡，不必獨自讀這一節，不必逼自己「釋放」或「原諒」任何人；你可以只讀到「神看見」就停下來。<strong>復原是一條有同伴、有時間、有專業協助的路，不是一次決定。<\/strong>教會的責任，是成為一個安全、有界線、不追問細節的地方。<\/p><p>對於握有權力與資源的人，這一節是一面鏡子：我有沒有用我的位置，讓別人在我面前失去自主？我的「好意」，有沒有讓人不敢說不？<strong>真正的權柄，是讓人在我面前更安全，而不是更脆弱。<\/strong>這是耶穌作王的樣式：祂把自己放在最低處，為的是使人得著榮耀。<\/p>"},{"a":18,"z":19,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מָֽה־הוֹעִיל פֶּסֶל כִּי פְסָלוֹ יֹֽצְרוֹ מַסֵּכָה וּמוֹרֶה שָּׁקֶר כִּי בָטַח יֹצֵר יִצְרוֹ עָלָיו לַעֲשׂוֹת אֱלִילִים אִלְּמִֽים׃ הוֹי אֹמֵר לָעֵץ הָקִיצָה עוּרִי לְאֶבֶן דּוּמָם הוּא יוֹרֶה הִנֵּה־הוּא תָּפוּשׂ זָהָב וָכֶסֶף וְכָל־רוּחַ אֵין בְּקִרְבּֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「雕刻的偶像，人將它刻出來，有什麼益處呢？鑄造的偶像就是虛謊的師傅。製造者倚靠這啞巴偶像有什麼益處呢？對木偶說：醒起！對啞巴石像說：起來！那人有禍了！這個還能教訓人嗎？看哪，是包裹金銀的，其中毫無氣息。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>偶像<\/td><td>פֶּסֶל<\/td><td>pesel<\/td><td>H6459<\/td><td>雕刻的像<\/td><\/tr><tr><td>鑄造的偶像<\/td><td>מַסֵּכָה<\/td><td>massekhah<\/td><td>H4541<\/td><td>鑄成的像<\/td><\/tr><tr><td>師傅<\/td><td>וּמוֹרֶה<\/td><td>umoreh<\/td><td>H3384<\/td><td>教師、教導者<\/td><\/tr><tr><td>虛謊<\/td><td>שָּׁקֶר<\/td><td>sheqer<\/td><td>H8267<\/td><td>虛假、謊言<\/td><\/tr><tr><td>啞巴<\/td><td>אִלְּמִים<\/td><td>illemim<\/td><td>H483<\/td><td>不能說話的<\/td><\/tr><tr><td>醒起<\/td><td>הָקִיצָה<\/td><td>haqitsah<\/td><td>H6974<\/td><td>醒來<\/td><\/tr><tr><td>起來<\/td><td>עוּרִי<\/td><td>'uri<\/td><td>H5782<\/td><td>起來、興起<\/td><\/tr><tr><td>氣息<\/td><td>רוּחַ<\/td><td>ruakh<\/td><td>H7307<\/td><td>氣息、風、靈<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>偶像、鑄造的偶像<\/strong>：pesel（雕刻的像）與 massekhah（鑄成的像）是舊約對偶像最常用的兩個字，一個是用刀刻，一個是用火鑄。<\/strong><\/p><p><strong>虛謊的師傅<\/strong>：moreh sheqer，「教導虛假的人」。moreh（H3384）是「教師」，字根 yarah 與「律法」（torah）同源。這裡的反諷是：偶像不能教導，反而成了「虛謊的師傅」，它所教的，只是謊言。<\/p><p><strong>啞巴偶像<\/strong>：elilim illemim，「不能說話的虛無之物」。elil 是舊約常用來嘲諷偶像的字，意思是「無有」。<strong>對木偶說：醒起！<\/strong>haqitsah，「醒來！」；<strong>對啞巴石像說：起來！<\/strong>'uri，「起來！」這兩個命令動詞，其實是用在神身上的動詞（詩44:23、詩7:6），先知把它們放在偶像身上，是對人類荒謬行為的諷刺。<\/p><p><strong>其中毫無氣息<\/strong>：vekhol ruakh ein beqirbo，「它裡面沒有任何氣息」。ruakh 是「風、氣、靈」，在 2:19 指生命的氣息。偶像外表包金裹銀，裡面卻是空的。<\/p>","exp":"<p>第五個禍，是一幅幾乎荒謬的圖畫。<\/p><p><strong>對木偶說：醒起！對啞巴石像說：起來！<\/strong>一個人拿著木頭，對它說：醒來吧。他對石頭說：起來幫助我。這幅圖畫的諷刺，在於它太貼近人性了：我們都有一些東西，是我們指望它「醒來」幫助我們的。<\/p><p>經文先問：雕刻的偶像，人將它刻出來，有什麼益處呢？<strong>是人作的，卻要它來救人。<\/strong>製造者倚靠自己的手工，向它求幫助。這是整卷書所處理的同一個問題：人把自己造出來的東西，當作自己的依靠。<\/p><p>1:11 說迦勒底人「以自己的勢力為神」；1:16 說他向網獻祭；2:18–19 說人向木偶、石像求醒。<strong>這是一個貫穿全卷的主題：一個人的神，是他所倚靠的東西。<\/strong>這個東西不一定是木頭石頭，它可以是我的專業、我的存款、我的計畫、我的名聲。凡我必須靠它才能安心的，就是我的神。<\/p><p>然後，2:19 最後一句：看哪，是包裹金銀的，其中毫無氣息。<strong>外表光鮮，裡面沒有氣息。<\/strong>這是對任何外表華麗、內裡空虛的東西最精準的描寫。偶像有金銀的外衣，但沒有生命。<\/p><p>這與 2:4 的「因信得生」形成最深的對比：<strong>義人因信「得生」，偶像之人倚靠「無氣息」之物。<\/strong>生命來自活的神，不來自人造的東西。這是五禍的終點，也是通向下一節的入口。<\/p><p>讓我們也看一看這一段與第一章的連結：<strong>1:16 說，迦勒底人向網獻祭、向網燒香；2:18–19 說，人向木偶、石像求醒。<\/strong>一個是向工具獻祭，一個是向偶像求助。兩者都是「把有限之物當成無限的依靠」。先知把這兩幅畫面並置，為的是讓我們看見：偶像不只是廟裡的東西，它是任何取代神位置的東西。<\/p><p>面對這樣的反省，我們不用恐慌。<strong>發現自己的偶像，是恩典的開始，不是定罪的開始。<\/strong>因為當我們看見的時候，神已經在這裡；祂不是來嚇我們，是來把我們帶回那位有氣息的神那裡。<\/p><p>讀完這兩節，不妨安靜地問自己一個問題：<strong>如果有一天我所倚靠的那樣東西失去了氣息，我還剩下什麼？<\/strong>這個問題不是要嚇人，而是要幫助我們提早把心放對地方。倚靠活的神的人，不會因為手裡的東西停了，就整個人停下來；因為他的氣息，不在那些東西裡。<\/p><p>先知的諷刺，是為了讓人從夢裡醒過來，不是為了羞辱拜偶像的人；他自己，也曾經站在這條線的邊上。<\/p>"},{"a":20,"z":20,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַֽיהוָה בְּהֵיכַל קָדְשׁוֹ הַס מִפָּנָיו כָּל־הָאָֽרֶץ׃<\/p><\/blockquote>","lit":"<blockquote><p>「惟耶和華在他的聖殿中；全地的人都當在他面前肅敬靜默。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>耶和華<\/td><td>וַיהוָה<\/td><td>vaYHWH<\/td><td>H3068<\/td><td>耶和華<\/td><\/tr><tr><td>聖殿<\/td><td>בְּהֵיכַל קָדְשׁוֹ<\/td><td>beheikhal qodsho<\/td><td>H1964<\/td><td>他聖別的殿宇<\/td><\/tr><tr><td>肅敬靜默<\/td><td>הַס<\/td><td>has<\/td><td>H2013<\/td><td>安靜！肅靜！<\/td><\/tr><tr><td>全地<\/td><td>כָּל־הָאָרֶץ<\/td><td>kol-ha'aretz<\/td><td>H776<\/td><td>全地<\/td><\/tr><tr><td>面前<\/td><td>מִפָּנָיו<\/td><td>mippanav<\/td><td>H6440<\/td><td>在他面前<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>惟耶和華在他的聖殿中<\/strong>：原文 vaYHWH beheikhal qodsho，句首的 vav（惟）帶有轉折的意思，把 2:18–19 沒有氣息的偶像，與「耶和華」放在一組對比裡。<strong>聖殿<\/strong>：heikhal，可指耶路撒冷的聖殿，也可指神在天上的居所；各家有不同的看法，經文的重點是：耶和華在祂的地方，祂是活著的。<\/p><p><strong>肅敬靜默<\/strong>：has 是一個擬聲的感嘆詞，等於「噓！」，在舊約只出現在敬拜與審判的場景（番1:7、亞2:13）。它不是一個「安靜地、不說話」的一般用語，而是「在神面前不作聲」的專用語。<\/p><p><strong>全地<\/strong>：kol-ha'aretz，「全地」，是全卷追蹤字 eretz 的又一次出現。1:6 迦勒底人通行遍地，2:14 知識充滿遍地，2:20 全地都肅敬靜默：地的主人，從迦勒底人，換到耶和華。<\/p>","exp":"<p>第 2 章的最後一節，只有短短的一句。<\/p><p><strong>惟耶和華在他的聖殿中；全地的人都當在他面前肅敬靜默。<\/strong>在這一章裡，有五個「禍哉」，有各種的聲音：譏刺的歌、石頭的呼喊、棟樑的回應、木偶的「醒起」。到了最後，所有的聲音，都停下來了。<\/p><p>這個「惟」字很重要。<strong>在這一切之後，惟有耶和華。<\/strong>偶像是啞巴的，耶和華是活著的；偶像必須被人搖醒，耶和華卻在祂的殿中，不需要任何人叫醒。<\/p><p>然後是「肅敬靜默」。先知從 1:2 開始，是一連串的問題與呼喊；現在，他被帶到一個全然不同的地方：<strong>不再問，不再喊，只是在祂面前靜默。<\/strong>這種靜默，不是被迫閉嘴，也不是屬靈的壓抑，而是一種「我已經在祂面前」的安靜。<\/p><p>我們要小心，這節經文不是要叫人停止禱告、停止問問題。先知的問題，神沒有責備，反而收進了正典。這裡的靜默，是在神回答之後的靜默，是在看見祂的榮耀與主權之後的敬畏。<strong>靜默，是回答之後的敬拜，不是問題之前的封口。<\/strong><\/p><p>這節經文，也給我們一個每天可以使用的操練：在一切的聲音裡，包括自己心裡的各種論述、各種擔憂、各種「我可以怎麼處理」，停一停，對自己說：惟耶和華在祂的聖殿中。<strong>焦點在耶穌，不在自己、不在別人、不在環境。<\/strong>讓祂作王，讓我們安靜。<\/p><p>再補一個提醒：這節經文不是在說「不要說話」，而是在說「當你知道祂在殿中」。<strong>肅靜不是對人的壓制，是對神的回應。<\/strong>在教會裡，我們有時會用「要安靜」來
